# Fast CI — the single automatic deterministic gate.
#
# Exactly one job: root and web typechecks plus the proven-cheap Storybook/
# catalog integrity check when frontend-capable or uncertain paths are affected.
# Non-browser checks (prototype,
# identity, workerd, components) run locally via `pnpm verify:precommit`
# before commits; browser/Worker-D1 Playwright suites are explicit local
# commands; the D1 auth acceptance contract and deployed smoke are manual
# `workflow_dispatch` jobs in e2e.yml. The Ultracite syntax audit is deferred
# to #498 and never runs here.
#
# Failures are LOUD: no continue-on-error, no `|| true`.

name: Fast CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-ci:
    name: Fast CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (single workspace lockfile)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Test Storybook affected-scope resolver
        run: pnpm test:storybook:scope

      - name: Determine Storybook/catalog affected scope
        id: storybook-scope
        env:
          STORYBOOK_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/storybook-affected-scope.mjs

      - name: Storybook/catalog integrity (frontend-affected)
        if: steps.storybook-scope.outputs.run == 'true'
        run: pnpm --filter web test:t07:foundation

      - name: Typecheck (root + web)
        run: pnpm verify:fast

      - name: Resolve governance comparison base
        id: governance-base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            git fetch origin "$DEFAULT_BRANCH"
            base="$(git merge-base HEAD FETCH_HEAD)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Incremental control override ratchet
        run: pnpm verify:governance:affected --control-base="${{ steps.governance-base.outputs.sha }}"
