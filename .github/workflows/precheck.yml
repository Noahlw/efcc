# GitHub Actions: Fast merge precheck workflow.
#
# Per ADR-0014 (docs/adr/0014-precheck-and-precommit-workflow.md), this workflow
# runs typecheck and unit tests on every push and pull_request to gate PR merges.
#
# Failures are LOUD: no `continue-on-error`, no `|| true`.

name: Precheck (Typecheck & Unit)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  precheck:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests (Vitest)
        run: pnpm test:gas
