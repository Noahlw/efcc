name: E2E (Playwright)

on:
  push:
    branches: [main, master]

jobs:
  e2e:
    name: DEV role-navigation acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Decode Google storage states
        env:
          ALICE_STORAGE_STATE: ${{ secrets.ALICE_STORAGE_STATE }}
          BOB_STORAGE_STATE: ${{ secrets.BOB_STORAGE_STATE }}
          NOAH_STORAGE_STATE: ${{ secrets.NOAH_STORAGE_STATE }}
        run: |
          test -n "$ALICE_STORAGE_STATE"
          test -n "$BOB_STORAGE_STATE"
          test -n "$NOAH_STORAGE_STATE"
          mkdir -p .auth
          echo "$ALICE_STORAGE_STATE" | base64 --decode > .auth/alice.storage.json
          echo "$BOB_STORAGE_STATE" | base64 --decode > .auth/bob.storage.json
          echo "$NOAH_STORAGE_STATE" | base64 --decode > .auth/noah.storage.json

      - name: Run Playwright E2E against approved DEV deployment
        env:
          E2E_TARGET_URL: ${{ vars.E2E_TARGET_URL }}
        run: pnpm exec playwright test --config=tests/e2e/playwright.config.ts

      - name: Append executed results to acceptance plan
        if: always() && hashFiles('test-results/e2e-results.json') != ''
        env:
          E2E_TARGET_URL: ${{ vars.E2E_TARGET_URL }}
        run: pnpm exec tsx tests/e2e/plan-doc-appender.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            test-results/
            docs/specs/067-role-nav-acceptance-plan.md
          if-no-files-found: ignore
          retention-days: 14
