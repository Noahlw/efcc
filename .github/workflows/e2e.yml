# GitHub Actions: D1 auth and local Programs acceptance gates.
#
# The rebuilt login boundary is a Cloudflare Worker backed by D1. This
# workflow no longer drives the retired Apps Script /exec role-nav suite or
# decodes Google storage-state cookies. It is manual-only: an operator
# dispatches it to run the full local Programs/Worker/D1 prerequisite, the
# workerd D1 auth contract, or the deployed Worker smoke after provisioning
# isolated disposable fixtures. Fast CI is the single automatic gate.
#
# The browser UI still uses the legacy /api/v1/rpc surface in this branch, so
# the deployed job targets the Worker auth API directly with Playwright's
# request context. It proves the actual cookie boundary without pretending the
# legacy Apps Script iframe is the new login implementation.

# Manual only (Fast CI is the single automatic gate): neither job runs on
# push or pull request, and neither is a required merge check. An operator
# dispatches this workflow to run the workerd D1 auth contract or the
# isolated deployed smoke; both jobs keep their fail-closed behavior.

name: D1 auth acceptance gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-contract:
    name: D1 auth contract (workerd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Typecheck Worker/auth code
        run: pnpm --dir web typecheck

      - name: Run D1 auth acceptance contract
        run: pnpm --dir web exec vitest run worker.auth.test.ts lib/auth

  programs-runtime:
    name: Full Programs runtime (local)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Create disposable local Worker secret
        run: printf 'EFCC_ACCESS_TOKEN_SECRET="%s"\n' "$(openssl rand -hex 32)" > web/.dev.vars

      - name: Run required single-process Programs journey
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: pnpm verify:programs-runtime

      - name: Upload local Programs runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: programs-runtime-${{ github.run_id }}
          path: test-results/programs-d1-runs
          if-no-files-found: ignore
          retention-days: 14

  deployed-auth:
    name: Deployed D1 auth smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Validate deployed auth prerequisites (fail-closed)
        env:
          AUTH_TARGET_URL: ${{ vars.AUTH_TARGET_URL }}
          AUTH_TEST_USERNAME: ${{ secrets.AUTH_TEST_USERNAME }}
          AUTH_TEST_CREDENTIAL: ${{ secrets.AUTH_TEST_CREDENTIAL }}
          AUTH_LEGACY_USERNAME: ${{ secrets.AUTH_LEGACY_USERNAME }}
          AUTH_LEGACY_PIN: ${{ secrets.AUTH_LEGACY_PIN }}
          AUTH_NEW_CREDENTIAL: ${{ secrets.AUTH_NEW_CREDENTIAL }}
        run: |
          set -u
          missing=""
          [ -n "$AUTH_TARGET_URL" ] || missing="$missing AUTH_TARGET_URL"
          [ -n "$AUTH_TEST_USERNAME" ] || missing="$missing AUTH_TEST_USERNAME"
          [ -n "$AUTH_TEST_CREDENTIAL" ] || missing="$missing AUTH_TEST_CREDENTIAL"
          [ -n "$AUTH_LEGACY_USERNAME" ] || missing="$missing AUTH_LEGACY_USERNAME"
          [ -n "$AUTH_LEGACY_PIN" ] || missing="$missing AUTH_LEGACY_PIN"
          [ -n "$AUTH_NEW_CREDENTIAL" ] || missing="$missing AUTH_NEW_CREDENTIAL"
          if [ -n "$missing" ]; then
            echo "::error::Missing deployed D1 auth prerequisites:$missing"
            echo "Provision an isolated Worker/D1 target and acceptance accounts (see .github/CI-SECRETS.md)."
            exit 1
          fi
          AUTH_TARGET_URL="$AUTH_TARGET_URL" node --input-type=module <<'NODE'
          const target = new URL(process.env.AUTH_TARGET_URL);
          if (target.protocol !== "https:" || target.username || target.password) {
            console.error("::error::AUTH_TARGET_URL must be an absolute HTTPS URL without credentials.");
            process.exit(1);
          }
          if (
            !/^efcc-auth-[a-z0-9-]+\.efcc-ggc\.workers\.dev$/iu.test(
              target.hostname
            )
          ) {
            console.error(
              "::error::AUTH_TARGET_URL must use the isolated efcc-auth-*.efcc-ggc.workers.dev acceptance host."
            );
            process.exit(1);
          }
          NODE
          echo "Deployed D1 auth prerequisites present."

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run deployed D1 auth smoke
        env:
          AUTH_TARGET_URL: ${{ vars.AUTH_TARGET_URL }}
          AUTH_TEST_USERNAME: ${{ secrets.AUTH_TEST_USERNAME }}
          AUTH_TEST_CREDENTIAL: ${{ secrets.AUTH_TEST_CREDENTIAL }}
          AUTH_LEGACY_USERNAME: ${{ secrets.AUTH_LEGACY_USERNAME }}
          AUTH_LEGACY_PIN: ${{ secrets.AUTH_LEGACY_PIN }}
          AUTH_NEW_CREDENTIAL: ${{ secrets.AUTH_NEW_CREDENTIAL }}
        run: pnpm exec playwright test --config=tests/e2e/auth-d1.config.ts

      - name: Upload deployed auth evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d1-auth-playwright-results
          path: tests/e2e/test-results/auth-d1-results.json
          if-no-files-found: ignore
          retention-days: 14
