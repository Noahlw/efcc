version: 2
updates:
  # Root manifest and pnpm workspace lockfile (including web/).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      workspace-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
