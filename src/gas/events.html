<div class="events-fragment">
  <header class="page-header">
    <h1 class="page-title">Events / 活動</h1>
    <p class="page-subtitle">
      Upcoming events for your enrolled programs &middot; 你所報名課程的聚會
    </p>
  </header>

  <div id="events-status" class="hidden" aria-live="polite"></div>
  <div id="events-spinner" class="text-center mt-lg" style="display: none">
    <span class="spinner"></span>
  </div>

  <!-- Baseline list: always shown to authenticated users. -->
  <section id="events-mine-section">
    <h2
      style="
        font-size: var(--text-lg);
        font-weight: 600;
        margin: var(--space-md) 0 var(--space-sm);
      "
    >
      Your Upcoming Events / 即將舉行的活動
    </h2>
    <ul class="card-list" id="events-mine-list"></ul>
    <div id="events-mine-empty" class="card text-center mt-md hidden">
      <p>No upcoming events for your enrolled programs.</p>
    </div>
  </section>

  <!-- Privileged list + controls: only shown to granted users. -->
  <section id="events-leader-section" class="hidden">
    <div
      class="flex-between mt-lg mb-md"
      style="flex-wrap: wrap; gap: var(--space-sm)"
    >
      <h2 style="font-size: var(--text-lg); font-weight: 600; margin: 0">
        Manage Events / 管理活動
      </h2>
      <button class="btn btn-primary btn-sm" id="events-show-create-btn">
        + Create Event
      </button>
    </div>

    <div id="events-create-card" class="card mt-md hidden mb-lg">
      <h3
        style="
          font-size: var(--text-base);
          font-weight: 600;
          margin-bottom: var(--space-sm);
        "
      >
        Create Event
      </h3>
      <div class="form-group">
        <label class="label" for="events-prog-select">Program</label>
        <select id="events-prog-select" class="input" required>
          <option value="">-- Select a program --</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label" for="events-name-input">Event Name</label>
        <input
          id="events-name-input"
          class="input"
          type="text"
          required
          placeholder="e.g. Sunday Worship"
        />
      </div>
      <div class="form-group">
        <label class="label" for="events-date-input">Event Date</label>
        <input id="events-date-input" class="input" type="date" required />
      </div>
      <div class="form-group">
        <label class="label" for="events-time-input">Time Slot</label>
        <input
          id="events-time-input"
          class="input"
          type="text"
          required
          placeholder="e.g. 3:00 PM - 4:30 PM"
        />
      </div>
      <div class="form-group">
        <label class="label">Event Type</label>
        <div class="flex-row">
          <label
            style="
              display: inline-flex;
              align-items: center;
              gap: var(--space-xs);
              cursor: pointer;
            "
          >
            <input type="radio" name="events-type" value="REGULAR" checked />
            <span class="badge badge-regular">Regular</span>
          </label>
          <label
            style="
              display: inline-flex;
              align-items: center;
              gap: var(--space-xs);
              cursor: pointer;
            "
          >
            <input type="radio" name="events-type" value="SPECIAL" />
            <span class="badge badge-special">Special</span>
          </label>
        </div>
      </div>
      <div class="form-group">
        <label class="label" for="events-recurrence-select">Recurrence</label>
        <select id="events-recurrence-select" class="input">
          <option value="NONE">None</option>
          <option value="WEEKLY">Weekly</option>
          <option value="MONTHLY">Monthly</option>
        </select>
      </div>
      <div class="flex-row" style="gap: var(--space-sm)">
        <button class="btn btn-primary" id="events-create-btn">Create</button>
        <button class="btn btn-ghost" id="events-cancel-create-btn">
          Cancel
        </button>
      </div>
    </div>

    <ul class="card-list" id="events-leader-list"></ul>
    <div id="events-leader-empty" class="card text-center mt-md hidden">
      <p>No events in the programs you manage.</p>
    </div>
  </section>
</div>

<script>
  /* global google */
  function initEvents() {
    "use strict";

    var raw;
    try {
      raw = JSON.parse(localStorage.getItem("efccSession") || "null");
    } catch (_) {
      raw = null;
    }
    if (!raw || !raw.userId || !raw.token) return;

    var statusEl = document.getElementById("events-status");
    var spinnerEl = document.getElementById("events-spinner");
    var mineListEl = document.getElementById("events-mine-list");
    var mineEmptyEl = document.getElementById("events-mine-empty");
    var leaderSectionEl = document.getElementById("events-leader-section");
    var leaderListEl = document.getElementById("events-leader-list");
    var leaderEmptyEl = document.getElementById("events-leader-empty");
    var showCreateBtn = document.getElementById("events-show-create-btn");
    var createCardEl = document.getElementById("events-create-card");
    var cancelCreateBtn = document.getElementById("events-cancel-create-btn");
    var createBtn = document.getElementById("events-create-btn");
    var progSelectEl = document.getElementById("events-prog-select");
    var nameInputEl = document.getElementById("events-name-input");
    var dateInputEl = document.getElementById("events-date-input");
    var timeInputEl = document.getElementById("events-time-input");
    var recurrenceSelectEl = document.getElementById(
      "events-recurrence-select"
    );

    function showStatus(msg, isError) {
      if (!statusEl) return;
      statusEl.textContent = msg;
      statusEl.className = isError ? "msg-error mt-md" : "msg-success mt-md";
      statusEl.classList.remove("hidden");
    }
    function clearStatus() {
      if (!statusEl) return;
      statusEl.textContent = "";
      statusEl.classList.add("hidden");
    }
    function escapeHtml(str) {
      var div = document.createElement("div");
      div.appendChild(document.createTextNode(String(str == null ? "" : str)));
      return div.innerHTML;
    }
    function escapeAttr(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
    function getSelectedEventType() {
      var checked = document.querySelector('input[name="events-type"]:checked');
      return checked ? checked.value : "REGULAR";
    }
    function setBusy(btn, busy, busyLabel, originalLabel) {
      if (!btn) return;
      btn.disabled = !!busy;
      btn.textContent = busy ? busyLabel : originalLabel;
    }

    // ------------------------------------------------------------------
    // Baseline list — always available to any authenticated member.
    // ------------------------------------------------------------------
    function loadMine() {
      if (spinnerEl) spinnerEl.style.display = "block";
      if (mineEmptyEl) mineEmptyEl.classList.add("hidden");
      if (mineListEl) mineListEl.innerHTML = "";
      google.script.run
        .withSuccessHandler(function (response) {
          if (spinnerEl) spinnerEl.style.display = "none";
          if (!response || !response.success || !Array.isArray(response.data)) {
            if (mineEmptyEl) mineEmptyEl.classList.remove("hidden");
            return;
          }
          renderMine(response.data);
        })
        .withFailureHandler(function (err) {
          if (spinnerEl) spinnerEl.style.display = "none";
          if (mineEmptyEl) mineEmptyEl.classList.remove("hidden");
          showStatus(
            (err && err.message) || "Failed to load your events.",
            true
          );
        })
        .api_getMyEvents(raw.userId, raw.token);
    }

    function renderMine(events) {
      if (!mineListEl) return;
      if (!events || events.length === 0) {
        if (mineEmptyEl) mineEmptyEl.classList.remove("hidden");
        return;
      }
      mineListEl.innerHTML = events.map(renderMemberCard).join("");
    }

    function renderMemberCard(evt) {
      var recurrenceBadge =
        evt.recurrence && evt.recurrence !== "NONE"
          ? '<span class="badge badge-event-leader">' +
            escapeHtml(evt.recurrence) +
            "</span>"
          : "";
      var typeBadge =
        '<span class="badge ' +
        (evt.eventType === "SPECIAL" ? "badge-special" : "badge-regular") +
        '">' +
        escapeHtml(evt.eventType || "REGULAR") +
        "</span>";
      return (
        '<li class="card">' +
        '<div class="flex-between" style="margin-bottom:var(--space-xs);">' +
        "<strong>" +
        escapeHtml(evt.eventName || "") +
        "</strong>" +
        '<span class="badge badge-active">Upcoming</span>' +
        "</div>" +
        '<div class="flex-row flex-wrap mt-sm" style="gap:var(--space-xs);">' +
        typeBadge +
        '<span class="badge badge-member">' +
        escapeHtml(evt.programName || evt.programId || "") +
        "</span>" +
        recurrenceBadge +
        "</div>" +
        '<p class="mt-sm" style="font-size:var(--text-sm);color:var(--color-text-muted);">' +
        "<strong>Date:</strong> " +
        escapeHtml(evt.eventDate || "") +
        " &middot; <strong>Time:</strong> " +
        escapeHtml(evt.timeSlot || "") +
        "</p>" +
        "</li>"
      );
    }

    // ------------------------------------------------------------------
    // Privileged section — only render if the user is a granted user
    // (STAFF/ADMIN OR holds any Active Program_Leaders grant).
    // Defense-in-depth: api_getLeaderProgramOptions also re-checks
    // server-side, and the create/cancel calls themselves re-authorize
    // per-program on the server.
    // ------------------------------------------------------------------
    function loadLeaderScope() {
      google.script.run
        .withSuccessHandler(function (response) {
          if (
            !response ||
            !response.success ||
            !Array.isArray(response.data) ||
            response.data.length === 0
          ) {
            // Not granted: leave the leader section hidden.
            return;
          }
          populateLeaderPrograms(response.data);
          leaderSectionEl.classList.remove("hidden");
          loadLeaderEvents();
        })
        .withFailureHandler(function () {
          // Silent — user just doesn't see the leader section.
        })
        .api_getLeaderProgramOptions(raw.userId, raw.token);
    }

    function populateLeaderPrograms(programs) {
      if (!progSelectEl) return;
      progSelectEl.innerHTML =
        '<option value="">-- Select a program --</option>';
      for (var i = 0; i < programs.length; i++) {
        var opt = document.createElement("option");
        opt.value = programs[i].programId || "";
        opt.textContent =
          (programs[i].title || programs[i].programId || "") +
          (programs[i].type ? " (" + programs[i].type + ")" : "");
        progSelectEl.appendChild(opt);
      }
    }

    function loadLeaderEvents() {
      if (spinnerEl) spinnerEl.style.display = "block";
      if (leaderEmptyEl) leaderEmptyEl.classList.add("hidden");
      if (leaderListEl) leaderListEl.innerHTML = "";
      google.script.run
        .withSuccessHandler(function (response) {
          if (spinnerEl) spinnerEl.style.display = "none";
          if (!response || !response.success || !Array.isArray(response.data)) {
            if (leaderEmptyEl) leaderEmptyEl.classList.remove("hidden");
            return;
          }
          renderLeader(response.data);
        })
        .withFailureHandler(function (err) {
          if (spinnerEl) spinnerEl.style.display = "none";
          if (leaderEmptyEl) leaderEmptyEl.classList.remove("hidden");
          showStatus(
            (err && err.message) || "Failed to load managed events.",
            true
          );
        })
        .api_getEventsForLeader(raw.userId, raw.token);
    }

    function renderLeader(events) {
      if (!leaderListEl) return;
      if (!events || events.length === 0) {
        if (leaderEmptyEl) leaderEmptyEl.classList.remove("hidden");
        return;
      }
      leaderListEl.innerHTML = events.map(renderLeaderCard).join("");
      attachLeaderListeners();
    }

    function renderLeaderCard(evt) {
      var status = (evt.status || "Active").toUpperCase();
      var statusBadgeClass =
        status === "CANCELLED" ? "badge-cancelled" : "badge-active";
      var typeBadgeClass =
        evt.eventType === "SPECIAL" ? "badge-special" : "badge-regular";
      var cancelBtn =
        status === "CANCELLED"
          ? ""
          : '<button class="btn btn-danger btn-sm events-cancel-btn" data-event-id="' +
            escapeAttr(evt.eventId) +
            '">Cancel Event</button>';
      return (
        '<li class="card">' +
        '<div class="flex-between" style="margin-bottom:var(--space-xs);">' +
        "<strong>" +
        escapeHtml(evt.eventName || "") +
        "</strong>" +
        '<span class="badge ' +
        statusBadgeClass +
        '">' +
        escapeHtml(status === "CANCELLED" ? "Cancelled" : "Active") +
        "</span>" +
        "</div>" +
        '<div class="flex-row flex-wrap mt-sm" style="gap:var(--space-xs);">' +
        '<span class="badge ' +
        typeBadgeClass +
        '">' +
        escapeHtml(evt.eventType || "REGULAR") +
        "</span>" +
        '<span class="badge badge-member">' +
        escapeHtml(evt.programName || evt.programId || "") +
        "</span>" +
        (evt.recurrence && evt.recurrence !== "NONE"
          ? '<span class="badge badge-event-leader">' +
            escapeHtml(evt.recurrence) +
            "</span>"
          : "") +
        "</div>" +
        '<p class="mt-sm" style="font-size:var(--text-sm);color:var(--color-text-muted);">' +
        "<strong>Date:</strong> " +
        escapeHtml(evt.eventDate || "") +
        " &middot; <strong>Time:</strong> " +
        escapeHtml(evt.timeSlot || "") +
        "</p>" +
        (cancelBtn
          ? '<div class="flex-row mt-md" style="gap:var(--space-xs);">' +
            cancelBtn +
            "</div>"
          : "") +
        "</li>"
      );
    }

    function attachLeaderListeners() {
      if (!leaderListEl) return;
      var btns = leaderListEl.querySelectorAll(".events-cancel-btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", onCancelClick);
      }
    }

    function onCancelClick(evt) {
      var btn = evt.currentTarget;
      var eventId = btn.getAttribute("data-event-id");
      if (!eventId) return;
      if (!confirm("Are you sure you want to cancel this event?")) return;
      clearStatus();
      setBusy(btn, true, "Cancelling\u2026", "Cancel Event");
      google.script.run
        .withSuccessHandler(function (response) {
          setBusy(btn, false, "", "Cancel Event");
          if (response && response.success) {
            showStatus("Event cancelled successfully.", false);
            loadMine();
            loadLeaderEvents();
            return;
          }
          showStatus(
            (response && response.message) || "Failed to cancel event.",
            true
          );
        })
        .withFailureHandler(function (err) {
          setBusy(btn, false, "", "Cancel Event");
          showStatus((err && err.message) || "Network error.", true);
        })
        .api_cancelEvent({
          cancelledBy: raw.userId,
          eventId: eventId,
          sessionToken: raw.token,
        });
    }

    // -- Create form toggle --------------------------------------------------
    if (showCreateBtn) {
      showCreateBtn.addEventListener("click", function () {
        if (!createCardEl) return;
        createCardEl.classList.remove("hidden");
        showCreateBtn.classList.add("hidden");
        clearStatus();
      });
    }
    if (cancelCreateBtn) {
      cancelCreateBtn.addEventListener("click", function () {
        if (!createCardEl) return;
        createCardEl.classList.add("hidden");
        if (showCreateBtn) showCreateBtn.classList.remove("hidden");
        clearStatus();
      });
    }

    // -- Create submit -------------------------------------------------------
    if (createBtn) {
      createBtn.addEventListener("click", function () {
        clearStatus();

        var programId = progSelectEl ? progSelectEl.value.trim() : "";
        var eventName = nameInputEl ? nameInputEl.value.trim() : "";
        var eventDateRaw = dateInputEl ? dateInputEl.value.trim() : "";
        var timeSlot = timeInputEl ? timeInputEl.value.trim() : "";
        var eventType = getSelectedEventType();
        var recurrence = recurrenceSelectEl
          ? recurrenceSelectEl.value.trim()
          : "NONE";

        if (!programId) return showStatus("Please select a program.", true);
        if (!eventName) return showStatus("Event name is required.", true);
        if (!eventDateRaw) return showStatus("Event date is required.", true);
        if (!timeSlot) return showStatus("Time slot is required.", true);

        // <input type="date"> gives "YYYY-MM-DD"; convert to dd/MM/YYYY for
        // the GAS backend (existing column convention).
        var dateParts = eventDateRaw.split("-");
        var displayDate = eventDateRaw;
        if (dateParts.length === 3) {
          displayDate = dateParts[2] + "/" + dateParts[1] + "/" + dateParts[0];
        }

        setBusy(createBtn, true, "Creating\u2026", "Create");
        google.script.run
          .withSuccessHandler(function (response) {
            setBusy(createBtn, false, "", "Create");
            if (response && response.success) {
              showStatus("Event created successfully.", false);
              if (nameInputEl) nameInputEl.value = "";
              if (dateInputEl) dateInputEl.value = "";
              if (timeInputEl) timeInputEl.value = "";
              if (recurrenceSelectEl) recurrenceSelectEl.value = "NONE";
              var regRadio = document.querySelector(
                'input[name="events-type"][value="REGULAR"]'
              );
              if (regRadio) regRadio.checked = true;
              if (createCardEl) createCardEl.classList.add("hidden");
              if (showCreateBtn) showCreateBtn.classList.remove("hidden");
              loadMine();
              loadLeaderEvents();
              return;
            }
            showStatus(
              (response && response.message) || "Failed to create event.",
              true
            );
          })
          .withFailureHandler(function (err) {
            setBusy(createBtn, false, "", "Create");
            showStatus((err && err.message) || "Network error.", true);
          })
          .api_createEvent({
            createdBy: raw.userId,
            eventDate: displayDate,
            eventName: eventName,
            eventType: eventType,
            programId: programId,
            recurrence: recurrence,
            sessionToken: raw.token,
            timeSlot: timeSlot,
          });
      });
    }

    // -- Boot ----------------------------------------------------------------
    loadMine();
    loadLeaderScope();
  }
  window.initEvents = initEvents;
</script>
