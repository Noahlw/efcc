<script>
  (function () {
    "use strict";

    // EFCC 顯恩堂 — form protection and safe rendering module.
    // Per issue #70 (parent #64), provides:
    //   - A shared form-state contract (pristine/dirty/submitting/succeeded/failed)
    //     with a duplicate-submission guard.
    //   - Safe text rendering utilities (multiline via text nodes + <br>,
    //     safe link building with protocol allowlist).
    //   - A discard-confirmation modal rendered in Traditional Chinese.
    //
    // This module is dependency-free and does not touch the DOM until
    // explicitly invoked. It must be included BEFORE shell-session.js.html
    // because shell-session.js.html references window.EfccFormGuard.
    //
    // State machine:
    //   PRISTINE → markDirty() → DIRTY → beginSubmit() → SUBMITTING
    //                                                       ↓        ↓
    //                                                   succeeded() failed()
    //                                                       ↓        ↓
    //                                                   SUCCEEDED  FAILED
    //                                                              ↓    ↑
    //                                                      markDirty() │
    //                                                        (→DIRTY)  │
    //                                                    beginSubmit() ┘
    //                                                        (→SUBMITTING)
    //
    // Request key regeneration rule:
    //   - A new request key is generated when markDirty() transitions the
    //     state TO DIRTY (from PRISTINE, SUCCEEDED, or FAILED).
    //   - beginSubmit() accepts both DIRTY and FAILED as valid pre-submission
    //     states. When called from FAILED (a retry), the EXISTING key from
    //     the prior markDirty() is reused — no new key is generated.
    //   - This means a retry after a failed submission uses the same
    //     requestKey for idempotency, while a fresh edit cycle gets a new key.

    var discardDialogCounter_ = 0;

    var STATE = Object.freeze({
      PRISTINE: "PRISTINE",
      DIRTY: "DIRTY",
      SUBMITTING: "SUBMITTING",
      SUCCEEDED: "SUCCEEDED",
      FAILED: "FAILED",
    });

    function create() {
      var state = STATE.PRISTINE;
      var requestKey = null;

      function generateKey() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      return {
        getState: function () {
          return state;
        },
        isDirty: function () {
          return state === STATE.DIRTY || state === STATE.FAILED;
        },
        isPending: function () {
          return state === STATE.SUBMITTING;
        },
        markDirty: function () {
          if (
            state === STATE.PRISTINE ||
            state === STATE.SUCCEEDED ||
            state === STATE.FAILED
          ) {
            state = STATE.DIRTY;
            requestKey = generateKey();
          }
        },
        markPristine: function () {
          state = STATE.PRISTINE;
          requestKey = null;
        },
        beginSubmit: function () {
          if (state === STATE.DIRTY || state === STATE.FAILED) {
            state = STATE.SUBMITTING;
            return true;
          }
          return false;
        },
        succeeded: function () {
          if (state === STATE.SUBMITTING) {
            state = STATE.SUCCEEDED;
          }
        },
        failed: function () {
          if (state === STATE.SUBMITTING) {
            state = STATE.FAILED;
          }
        },
        getRequestKey: function () {
          return requestKey;
        },
      };
    }

    /**
     * Build a DocumentFragment from a multi-line text string, using
     * text nodes and <br> elements. NEVER uses innerHTML or any DOM
     * API that interprets markup.
     */
    function renderMultilineText(text) {
      var fragment = document.createDocumentFragment();
      var str = String(text);
      if (str.length === 0) return fragment;
      var lines = str.split("\n");
      for (var i = 0; i < lines.length; i++) {
        if (i > 0) {
          fragment.appendChild(document.createElement("br"));
        }
        fragment.appendChild(document.createTextNode(lines[i]));
      }
      return fragment;
    }

    /**
     * Build either an <a> element (for http/https URLs) or a plain
     * <span> (for any unsafe or unparseable input). The raw href
     * string is NEVER placed into any DOM attribute in the unsafe case.
     * Safe links open in _blank with noopener noreferrer.
     */
    function buildSafeLink(labelText, href) {
      var label = String(labelText);
      try {
        var url = new URL(String(href));
        if (url.protocol === "http:" || url.protocol === "https:") {
          var a = document.createElement("a");
          a.href = url.href;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          return a;
        }
      } catch (e) {
        // URL parsing failed — fall through to safe span.
      }
      // Unsafe or unparseable: render as plain text span.
      var span = document.createElement("span");
      span.textContent = label;
      return span;
    }

    /**
     * Show a discard-confirmation modal in Traditional Chinese.
     * opts = {message, onConfirm, restoreFocusTo}
     * - Cancel button or Escape: removes modal, focuses restoreFocusTo.
     * - Confirm button: removes modal, calls onConfirm().
     * Returns the overlay element (for potential cleanup by test harness).
     */
    function confirmDiscard(opts) {
      var message =
        (opts && opts.message) || "系統將捨棄尚未儲存的變更，確定要離開嗎？";
      var onConfirm = (opts && opts.onConfirm) || function () {};
      var restoreFocusTo = (opts && opts.restoreFocusTo) || null;

      // Native <dialog> element (MDN: baseline widely available since March 2022).
      // showModal() provides: inert background, implicit aria-modal, Escape-to-close,
      // and focus management. Fallback: if showModal is not a function, fall back
      // to custom div overlay with manual Escape handling.
      var dialog = document.createElement("dialog");

      // Heading with ID for aria-labelledby (accessible name).
      // Suffixed with a counter so repeated creates never produce duplicate IDs.
      var headingId = "discard-title-" + ++discardDialogCounter_;
      var heading = document.createElement("h2");
      heading.id = headingId;
      heading.textContent = "確認離開";
      dialog.appendChild(heading);
      dialog.setAttribute("aria-labelledby", headingId);

      // Message body
      var msgP = document.createElement("p");
      msgP.textContent = message;
      dialog.appendChild(msgP);

      // Buttons container
      var btnRow = document.createElement("div");

      // Confirm button: "捨棄變更" (discard changes)
      var confirmBtn = document.createElement("button");
      confirmBtn.className = "btn btn-danger";
      confirmBtn.type = "button";
      confirmBtn.textContent = "捨棄變更";

      // Cancel button: "繼續編輯" (continue editing) - safer default (autofocus)
      var cancelBtn = document.createElement("button");
      cancelBtn.className = "btn btn-secondary";
      cancelBtn.type = "button";
      cancelBtn.setAttribute("autofocus", "autofocus");
      cancelBtn.textContent = "繼續編輯";

      btnRow.appendChild(confirmBtn);
      btnRow.appendChild(cancelBtn);
      dialog.appendChild(btnRow);
      document.body.appendChild(dialog);

      var closedByButton = false;

      function closeDialog() {
        if (dialog.parentNode) {
          dialog.parentNode.removeChild(dialog);
        }
      }

      function restoreFocus() {
        if (restoreFocusTo && typeof restoreFocusTo.focus === "function") {
          restoreFocusTo.focus();
        }
      }

      // Cancel button click: close, restore focus, do NOT call onConfirm.
      cancelBtn.addEventListener("click", function () {
        closedByButton = true;
        dialog.close();
        closeDialog();
        restoreFocus();
      });

      // Confirm button click: close, THEN call onConfirm.
      confirmBtn.addEventListener("click", function () {
        closedByButton = true;
        dialog.close();
        closeDialog();
        onConfirm();
      });

      // Close event fires on Escape (browser default for showModal) and on
      // dialog.close(). If closed via Escape (not button), restore focus.
      dialog.addEventListener("close", function () {
        if (!closedByButton) {
          closeDialog();
          restoreFocus();
        }
      });

      // Show the dialog. showModal() makes background inert, sets up
      // Escape-to-close, and focuses the autofocus element.
      if (typeof dialog.showModal === "function") {
        dialog.showModal();
      } else {
        // Fallback: manual Escape handling and focus management.
        dialog.open = true;
        var escHandler = function (e) {
          if (e.key === "Escape") {
            closeDialog();
            restoreFocus();
            document.removeEventListener("keydown", escHandler);
          }
        };
        document.addEventListener("keydown", escHandler);
        setTimeout(function () {
          cancelBtn.focus();
        }, 0);
      }

      return dialog;
    }

    window.EfccFormGuard = {
      STATE: STATE,
      create: create,
      renderMultilineText: renderMultilineText,
      buildSafeLink: buildSafeLink,
      confirmDiscard: confirmDiscard,
    };
  })();
</script>
