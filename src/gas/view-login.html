<section id="view-login" class="page view-login">
  <div class="login-card">
    <h2 class="text-center">登入</h2>
    <p class="text-center muted">歡迎使用顯恩堂系統</p>
    <form id="login-form" class="form" autocomplete="off">
      <div class="form-group">
        <label class="label" for="login-username">使用者名稱</label>
        <input
          id="login-username"
          class="input"
          type="text"
          name="username"
          autocomplete="username"
          autocapitalize="off"
          spellcheck="false"
          required
        />
      </div>
      <div class="form-group">
        <label class="label" for="login-pin">PIN 碼</label>
        <input
          id="login-pin"
          class="input"
          type="password"
          name="pin"
          inputmode="numeric"
          maxlength="4"
          pattern="\d{4}"
          autocomplete="current-password"
          required
        />
      </div>
      <button id="login-submit" class="btn btn-primary btn-full" type="submit">
        登入
      </button>
      <div id="login-msg" class="msg-error hidden" role="alert"></div>
    </form>
  </div>
</section>
