<!doctype html>
<html>
  <head>
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const loginCard = document.getElementById("loginCard");

        // Check token on load
        const tokenData = JSON.parse(localStorage.getItem("authToken"));
        if (tokenData && Date.now() < tokenData.expiry) {
          // If logged in, load main page
          google.script.run
            .withSuccessHandler(function (html) {
              document.open();
              document.write(html);
              document.close();
            })
            .loadPage("main");
        } else {
          // If not logged in, show login form
          loginCard.style.display = "block";
        }
      });

      function handleLogin() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const btn = document.getElementById("loginBtn");
        const msgBox = document.getElementById("msg");

        // Clear old messages
        msgBox.innerHTML = "";

        // Disable button and show spinner
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Logging in...`;

        google.script.run
          .withSuccessHandler((res) => {
            res = JSON.parse(res);

            if (res.success) {
              localStorage.setItem(
                "authToken",
                JSON.stringify({
                  token: res.token,
                  expiry: res.expiry,
                  accessPages: res.accessPages,
                })
              );

              // Fetch menu once and store in localStorage
              google.script.run
                .withSuccessHandler((menus) => {
                  localStorage.setItem("userMenu", JSON.stringify(menus));
                  google.script.run
                    .withSuccessHandler(function (html) {
                      document.open();
                      document.write(html);
                      document.close();
                    })
                    .loadPage("main");
                })
                .getMenu(res.accessPages);
            } else {
              // Restore button
              btn.disabled = false;
              btn.innerHTML = "Login";

              // Show error message
              msgBox.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
              <strong>Error!</strong> ${res.message}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`;
            }
          })
          .loginUser(email, password);
      }
    </script>
  </head>
  <body
    class="bg-light d-flex justify-content-center align-items-center vh-100"
  >
    <!-- Hidden initially -->
    <div
      id="loginCard"
      class="card shadow-lg p-4"
      style="max-width: 400px; width: 100%; display: none"
    >
      <h3 class="text-center mb-3">Login</h3>
      <div class="mb-3">
        <label>Email</label>
        <input type="email" id="email" class="form-control" />
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input type="password" id="password" class="form-control" />
      </div>
      <button
        id="loginBtn"
        class="btn btn-primary w-100"
        onclick="handleLogin()"
      >
        Login
      </button>
      <div class="mt-3" id="msg"></div>
    </div>
  </body>
  <!-- Bootstrap JS (needed for dismissible alerts) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
