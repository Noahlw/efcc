<!doctype html>
<html>
  <head>
    <title>Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
      }

      /* Layout wrapper */
      .wrapper {
        display: flex;
        flex-wrap: nowrap;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar */
      #sidebar {
        width: 250px;
        background: #343a40;
        color: white;
        transition: margin-left 0.3s;
      }
      #sidebar ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #sidebar ul li a {
        color: white;
        display: block;
        padding: 10px 20px;
        text-decoration: none;
      }
      #sidebar ul li a:hover,
      #sidebar ul li a.active {
        background: #495057;
      }
      #sidebar.collapsed {
        margin-left: -250px;
      }

      /* Main area */
      #main {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        transition: margin-left 0.3s;
      }

      /* Top navbar */
      #topbar {
        flex-shrink: 0;
        transition: margin-left 0.3s;
      }

      /* Page content */
      #content {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
      }

      /* Sidebar on mobile */
      @media (max-width: 768px) {
        #sidebar {
          position: fixed;
          top: 0;
          left: 0;
          height: 100%;
          margin-left: -250px;
          z-index: 1040; /* was 1050, lowered */
        }
        #sidebar.active {
          margin-left: 0;
        }

        /* Ensure topbar stays above sidebar */
        #topbar {
          position: relative;
          z-index: 1051; /* higher than sidebar */
        }
      }

      #sidebar-header {
        background: #212529;
        text-align: center;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <!-- Sidebar -->
      <div id="sidebar">
        <div id="sidebar-header" class="p-3 text-white fw-bold border-bottom">
          My Company
        </div>
        <ul id="menu"></ul>
      </div>

      <!-- Main area -->
      <div id="main">
        <!-- Top Navbar -->
        <nav id="topbar" class="navbar navbar-dark bg-dark">
          <div class="container-fluid">
            <button
              class="btn btn-outline-light me-2"
              onclick="toggleSidebar()"
            >
              ☰
            </button>
            <a class="navbar-brand" href="#">My Dashboard</a>
            <button class="btn btn-outline-light" onclick="logout()">
              Logout
            </button>
          </div>
        </nav>

        <!-- Page Content -->
        <div id="content">
          <div id="main-content">
            <?!= include('dashboard'); ?>
            <!-- initial content -->
          </div>
        </div>
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const tokenData = JSON.parse(localStorage.getItem("authToken"));
        if (!tokenData || Date.now() > tokenData.expiry) {
          localStorage.clear();
          google.script.run
            .withSuccessHandler(function (html) {
              document.open();
              document.write(html);
              document.close();
            })
            .loadPage("login");
          return;
        }
        // Build sidebar menu once from localStorage
        const menus = JSON.parse(localStorage.getItem("userMenu") || "[]");
        const menuContainer = document.getElementById("menu");
        menus.forEach((m) => {
          const li = document.createElement("li");
          li.innerHTML = `<a href="#" onclick="loadMenuPage('${m.url}', this)">${m.name}</a>`;
          menuContainer.appendChild(li);
        });
        initDashboard();
      });

      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const main = document.getElementById("main");
        const topbar = document.getElementById("topbar");

        if (window.innerWidth <= 768) {
          sidebar.classList.toggle("active");
        } else {
          sidebar.classList.toggle("collapsed");
          main.classList.toggle("expanded");
          topbar.classList.toggle("expanded");
        }
      }

      function logout() {
        localStorage.clear();
        google.script.run
          .withSuccessHandler(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .loadPage("login");
      }

      function loadMenuPage(pageName, el) {
        // Highlight active menu
        document
          .querySelectorAll("#menu a")
          .forEach((a) => a.classList.remove("active"));
        if (el) el.classList.add("active");

        // Show loading spinner
        document.getElementById("main-content").innerHTML = `
    <div class="d-flex justify-content-center align-items-center" style="height:300px;">
      <div class="text-center">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <div>Loading, please wait...</div>
      </div>
    </div>
  `;

        // Load page into content area
        google.script.run
          .withSuccessHandler(function (html) {
            const container = document.getElementById("main-content");

            // Parse HTML
            container.innerHTML = html;

            // Extract and run scripts
            const scripts = container.querySelectorAll("script");
            scripts.forEach((script) => {
              const newScript = document.createElement("script");
              if (script.src) {
                newScript.src = script.src; // external script
              } else {
                newScript.textContent = script.textContent; // inline script
              }
              document.body.appendChild(newScript);
              document.body.removeChild(newScript); // cleanup
            });

            // Auto-call init function if defined
            const initFnName =
              "init" + pageName.charAt(0).toUpperCase() + pageName.slice(1);
            if (typeof window[initFnName] === "function") {
              window[initFnName]();
            }
          })
          .loadPage(pageName);

        // Auto-close sidebar on mobile
        if (window.innerWidth <= 768) {
          document.getElementById("sidebar").classList.remove("active");
        }
      }
    </script>
  </body>
</html>
