<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base target="_top" />
    <title>EFCC 顯恩堂 — 登入</title>
    <?!= include('styles'); ?>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1 class="page-title">顯恩堂系統</h1>
        <p class="page-subtitle">EFCC Church Member Portal</p>
      </header>
      <div id="error-msg" class="msg-error hidden"></div>
      <form id="login-form">
        <div class="form-group">
          <label class="label" for="username">Username</label
          ><input
            class="input"
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
          />
        </div>
        <div class="form-group">
          <label class="label" for="pin">PIN Code</label
          ><input
            class="input"
            id="pin"
            name="pin"
            type="password"
            inputmode="numeric"
            maxlength="4"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="btn btn-primary btn-full" id="login-btn" type="submit">
          Login / 登入
        </button>
      </form>
      <p class="text-center mt-md">
        <a href="#" id="register-link" class="btn btn-ghost btn-sm"
          >Register New Member / 註冊新會員</a
        >
      </p>
    </main>
    <script>
      (function () {
        var form = document.getElementById("login-form");
        var error = document.getElementById("error-msg");
        var button = document.getElementById("login-btn");
        function showError(message) {
          error.textContent = message;
          error.classList.remove("hidden");
        }
        function swapToMain() {
          google.script.run
            .withSuccessHandler(function (html) {
              document.open();
              document.write(html);
              document.close();
            })
            .withFailureHandler(function () {
              localStorage.removeItem("efccSession");
              showError("Unable to load the application.");
            })
            .loadMainShell_();
        }
        function validateStoredSession() {
          var raw;
          try {
            raw = JSON.parse(localStorage.getItem("efccSession") || "null");
          } catch (_) {
            raw = null;
          }
          if (
            !raw ||
            !raw.token ||
            !raw.userId ||
            !raw.expiry ||
            Number(raw.expiry) <= Date.now()
          )
            return;
          google.script.run
            .withSuccessHandler(function (response) {
              if (response && response.success && response.data) {
                localStorage.setItem(
                  "efccSession",
                  JSON.stringify({
                    token: response.data.sessionToken,
                    expiry: response.data.expiryTimestamp,
                    userId: response.data.userId,
                  })
                );
                swapToMain();
              } else localStorage.removeItem("efccSession");
            })
            .withFailureHandler(function () {
              localStorage.removeItem("efccSession");
            })
            .api_getCurrentSession(raw.userId, raw.token);
        }
        form.addEventListener("submit", function (event) {
          event.preventDefault();
          error.classList.add("hidden");
          button.disabled = true;
          button.textContent = "Logging in…";
          google.script.run
            .withSuccessHandler(function (response) {
              if (!response || !response.success || !response.data) {
                button.disabled = false;
                button.textContent = "Login / 登入";
                showError((response && response.message) || "Login failed.");
                return;
              }
              var d = response.data;
              localStorage.setItem(
                "efccSession",
                JSON.stringify({
                  token: d.sessionToken,
                  expiry: d.expiryTimestamp,
                  userId: d.userId,
                })
              );
              swapToMain();
            })
            .withFailureHandler(function (err) {
              button.disabled = false;
              button.textContent = "Login / 登入";
              showError(err && err.message ? err.message : "Login failed.");
            })
            .api_loginUser(
              document.getElementById("username").value.trim(),
              document.getElementById("pin").value.trim()
            );
        });
        document
          .getElementById("register-link")
          .addEventListener("click", function (event) {
            event.preventDefault();
            google.script.run
              .withSuccessHandler(function (html) {
                document.open();
                document.write(html);
                document.close();
              })
              .withFailureHandler(function () {
                showError("Unable to load registration.");
              })
              .loadRegisterPage_();
          });
        validateStoredSession();
      })();
    </script>
  </body>
</html>
