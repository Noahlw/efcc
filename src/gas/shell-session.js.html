<script>
  (function () {
    "use strict";

    // EFCC 顯恩堂 — session, login, and bootstrap controller.
    // Per ADR-0010 / docs/specs/009-phone-first-shell-navigation.md /
    // issue #64 (parent) + #50 (auth boundary) + #73 (session detail).
    //
    // This module is the live-wiring sibling of shell.js.html. The
    // static-shell contract (issue #65) forbids RPC calls in
    // shell.js.html, so all server interaction lives here. The
    // App Document includes both modules in this order:
    //   1) shell.js        — flips data-app-state to SIGNED_OUT
    //   2) shell-session.js — restores or renders Login, owns
    //                         the state machine, login form, and
    //                         authenticated Profile render.
    //
    // Module responsibilities:
    //   - data-app-state machine (BOOTING -> SIGNED_OUT ->
    //     AUTHENTICATING -> LOADING_SECTION -> READY, plus
    //     RESTORING and RECOVERABLE_ERROR);
    //   - the single canonical localStorage key
    //     ("efccSession") holding {userId, sessionId, sessionToken};
    //   - login form wiring (calls api_loginUser with both success
    //     and failure handlers per spec 009);
    //   - bootstrap-on-load (calls api_restoreApp when a stored
    //     session is present; otherwise stays in SIGNED_OUT with
    //     zero server calls);
    //   - session-expiry recovery (AUTH_REQUIRED from a protected
    //     RPC clears client state and returns to Login in the
    //     same document, never via navigation);
    //   - visible recovery UI on transport / server / timeout
    //     failures with an explicit retry action;
    //   - rendering the minimal Profile fragment into #app-content
    //     after a successful login or restore.
    //
    // Hard rules (enforced by tests/gas/app-shell.contract.test.js):
    //   - NEVER use document.write/open/close;
    //   - NEVER set location.href, location.replace, or
    //     window.top.location;
    //   - NEVER use meta-refresh;
    //   - NEVER include a query-string router;
    //   - every google.script.run MUST register a failure handler.

    var STORAGE_KEY = "efccSession";
    var STATE = {
      BOOTING: "BOOTING",
      SIGNED_OUT: "SIGNED_OUT",
      AUTHENTICATING: "AUTHENTICATING",
      RESTORING: "RESTORING",
      LOADING_SECTION: "LOADING_SECTION",
      READY: "READY",
      RECOVERABLE_ERROR: "RECOVERABLE_ERROR",
    };

    // Monotonic request id so a slow/stale RPC cannot overwrite a
    // newer view (spec 009 client responsibilities).
    var inflightRequestId_ = 0;
    // The current user/session in memory. Cleared on logout / expiry.
    var session_ = null;
    // True between the moment a user clicks "登入" and the moment
    // the server replies. Suppresses duplicate submits.
    var loginPending_ = false;

    // Stable client-side Section key constants. Must match the
    // server-side SECTION_KEYS in Code.gs (bootstrapSectionsForRole_).
    // The server is authoritative — these are just a convenience
    // for the client to compare against without re-typing string
    // literals. Used by renderSection_ switch, navigateTo_ boot
    // call, and buildNavItem_ phone-label map.
    var SECTION_KEYS = Object.freeze({
      PROFILE: "profile",
      PROGRAMS: "programs",
      EVENTS: "events",
      SCANNER: "scanner",
      CARE: "care",
      PERMISSIONS: "permissions",
    });

    // Server-authorized sections from bootstrap (issue #67).
    var sections_ = [];
    // The currently active section key (e.g. "profile").
    var currentSection_ = null;

    // Nested task state (issue #68).
    var activeTask_ = null;
    // Per-Section view-state cache: {scrollTop, filter, selectedId, stale}.
    var sectionViewCache_ = {};
    // Per-Section badge counts (0 = hidden).
    var sectionBadgeCounts_ = {};
    // Events demo counter seeded at 150 for deterministic badge assertion.
    var eventsDemoCounter_ = 150;
    // Active form guard for the demo edit task (issue #70).
    var activeFormGuard_ = null;

    // Monotonic navigation generation (issue #69). Bumped every time
    // a real per-Section async load starts. A late RPC response
    // whose captured generation no longer matches the current value
    // has been superseded by a subsequent navigation and is dropped
    // — this is what prevents a late response from an abandoned
    // Section overwriting the user's newer location (AC #3),
    // distinct from callServer_'s per-tag dedup (which only guards
    // against two calls racing under the SAME tag).
    var navGeneration_ = 0;
    // Per-Section async state machine (issue #69), used for
    // Sections that load real data via an RPC. Only Programs uses
    // this in this branch; other Sections remain synchronous
    // placeholders. sectionKey -> { state, data, errorCode }.
    var SECTION_STATE = Object.freeze({
      IDLE: "IDLE",
      LOADING: "LOADING",
      READY: "READY",
      EMPTY: "EMPTY",
      ERROR: "ERROR",
    });
    var sectionStates_ = {};

    // Scanner Section runtime state (F5, external-origin Option A). The
    // events list lives in sectionStates_[SCANNER] (LOADING/READY/ERROR);
    // this object holds the open Scanner Window, bridge lifecycle, in-flight
    // check-in, and same-code cooldown so a continuous camera stream does not
    // double-submit (spec #93 US 12-14).
    var SCANNER_SUPPRESS_MS_ = 2500;
    // External-origin scanner page (ADR-0015 Option A). Hosted on GitHub Pages
    // because getUserMedia is blocked in the /exec IFRAME (research
    // 2026-07-30/#87 + 2026-08-01 best-method note). The App Document opens
    // this page, bridges an opaque scannedCode via postMessage, runs
    // api_qrCheckIn, and posts the result back for inline display.
    var SCANNER_PAGE_URL_ =
      "https://noahwong-hue.github.io/efcc-scanner/index.html";
    var SCANNER_ORIGIN_ = "https://noahwong-hue.github.io";
    var SCANNER_MSG_HANDSHAKE_ = "EFCC_QR_HANDSHAKE";
    var SCANNER_MSG_SCAN_ = "EFCC_QR_SCAN";
    var SCANNER_MSG_RESULT_ = "EFCC_QR_RESULT";
    var scannerRuntime_ = {
      selectedEventId: null,
      selectedEventName: "",
      scannerWindow: null, // window.open reference to the external scanner page
      listenerInstalled: false,
      messageListener: null,
      handshakeTimer: null,
      inFlight: false, // one pending check-in at a time (spec #93 US 12)
      lastCode: null, // set only on a SETTLED success (US 25)
      lastCodeAt: 0,
      lastResult: null, // __e2e observability: last result sent to the scanner
    };

    // -----------------------------------------------------------------
    // Tiny DOM helpers
    // -----------------------------------------------------------------
    function $(id) {
      return document.getElementById(id);
    }
    function appRoot() {
      return $("app");
    }
    function setAppState(state) {
      var root = appRoot();
      if (root) root.setAttribute("data-app-state", state);
    }
    function setStatus(text) {
      var el = $("app-status");
      if (el) el.textContent = text || "";
    }
    function clearChildren(el) {
      if (!el) return;
      while (el.firstChild) el.removeChild(el.firstChild);
    }
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(function (k) {
          if (k === "class") node.className = attrs[k];
          else if (k === "text") node.textContent = attrs[k];
          else if (
            k === "type" ||
            k === "id" ||
            k === "name" ||
            k === "autocomplete" ||
            k === "inputmode" ||
            k === "maxlength" ||
            k === "pattern" ||
            k === "role" ||
            k === "aria-live" ||
            k === "for" ||
            k === "required"
          ) {
            node.setAttribute(k, attrs[k]);
          } else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") {
            node.addEventListener(k.slice(2), attrs[k]);
          } else if (
            typeof attrs[k] === "string" ||
            typeof attrs[k] === "number"
          ) {
            node.setAttribute(k, attrs[k]);
          }
        });
      }
      // Normalize children to an array — a single child may be a
      // string (text content) or a single element, and the caller
      // should not have to wrap a one-off in an array literal.
      var kids = children;
      if (kids == null) kids = [];
      else if (!Array.isArray(kids)) kids = [kids];
      for (var i = 0; i < kids.length; i++) {
        var c = kids[i];
        if (c == null) continue;
        if (typeof c === "string") {
          node.appendChild(document.createTextNode(c));
        } else {
          node.appendChild(c);
        }
      }
      return node;
    }

    // -----------------------------------------------------------------
    // localStorage helpers
    // -----------------------------------------------------------------
    function readStoredSession_() {
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return null;
        if (!parsed.userId || !parsed.sessionId || !parsed.sessionToken)
          return null;
        return parsed;
      } catch (e) {
        return null;
      }
    }
    function writeStoredSession_(s) {
      try {
        window.localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            userId: s.userId,
            sessionId: s.sessionId,
            sessionToken: s.sessionToken,
          })
        );
      } catch (e) {
        // localStorage may be disabled (private mode). Continue
        // with the in-memory session; the next reload will land
        // back on Login.
      }
    }
    function clearStoredSession_() {
      try {
        window.localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
    }

    // -----------------------------------------------------------------
    // RPC wrapper — enforces success + failure handlers and request
    // id monotonicity. The caller passes a stable `idTag` (e.g.
    // "login") and a runner. If a newer call with the same tag
    // starts before this one finishes, the older response is
    // dropped (spec 009).
    // -----------------------------------------------------------------
    var inflightTags_ = {};
    function callServer_(idTag, runner, onSuccess, onError) {
      var myId = ++inflightRequestId_;
      inflightTags_[idTag] = myId;
      function maybeApply(tag, fn, value) {
        if (inflightTags_[tag] !== myId) return;
        fn(value);
      }
      function success(value) {
        maybeApply(idTag, onSuccess, value);
      }
      function failure(err) {
        // Per spec 009: unexpected execution exceptions reach the
        // failure handler; render a generic recoverable error.
        var message = err && err.message ? String(err.message) : "";
        maybeApply(idTag, onError, {
          kind: "TRANSPORT",
          code: "INTERNAL_ERROR",
          message: message || "網絡連線不穩定，請稍後再試。",
        });
      }
      try {
        var maybe = runner(success, failure);
        if (maybe && typeof maybe.then === "function") {
          maybe.then(success, failure);
        }
      } catch (e) {
        failure(e);
      }
    }

    // -----------------------------------------------------------------
    // Section rendering — Profile is the Day 1 landing section per
    // ADR-0010 / spec 009 / issue #64. Intentionally self-contained
    // so the AC "bootstrap returns initial Profile data" is met
    // without committing to a full Section-controller registry
    // (later ticket).
    // -----------------------------------------------------------------
    function renderProfile_(bootstrap) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      content.appendChild(
        el("section", { class: "page view-profile" }, [
          el("div", { class: "login-card" }, [
            el("h2", { text: "個人資料" }),
            el("p", {
              class: "muted",
              text: "已登入：" + (bootstrap.session.name || ""),
            }),
            el("dl", { class: "profile-fields" }, [
              el("dt", { text: "使用者名稱" }),
              el("dd", { text: bootstrap.profile.username || "" }),
              el("dt", { text: "角色" }),
              el("dd", { text: bootstrap.profile.role || "" }),
              el("dt", { text: "QR 碼" }),
              el("dd", {}, [
                (function () {
                  var img = document.createElement("img");
                  img.src =
                    "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
                    encodeURIComponent(bootstrap.profile.qrCodeString || "");
                  img.alt = "QR 碼";
                  img.width = 200;
                  img.height = 200;
                  return img;
                })(),
              ]),
            ]),
            el(
              "button",
              {
                id: "profile-logout",
                class: "btn btn-primary btn-full",
                type: "button",
                "data-action": "logout",
                onclick: handleLogoutClick_,
              },
              "登出"
            ),
          ]),
        ])
      );
    }

    // -----------------------------------------------------------------
    // Navigation rendering (issue #67) — phone bottom nav with "More"
    // overflow for >4 sections; desktop side rail with all sections.
    // -----------------------------------------------------------------
    var PHONE_MAX_VISIBLE = 4;

    function renderNavigation_() {
      renderNavPhone_();
      renderNavDesktop_();
      updateActiveNav_();
    }

    function renderNavPhone_() {
      var nav = $("app-nav-phone");
      if (!nav) return;
      clearChildren(nav);
      if (sections_.length === 0) {
        nav.setAttribute("hidden", "");
        return;
      }
      nav.removeAttribute("hidden");

      var visible = sections_;
      var overflow = [];
      if (sections_.length > PHONE_MAX_VISIBLE) {
        visible = sections_.slice(0, PHONE_MAX_VISIBLE);
        overflow = sections_.slice(PHONE_MAX_VISIBLE);
      }

      for (var i = 0; i < visible.length; i++) {
        nav.appendChild(buildNavItem_(visible[i], true));
      }

      if (overflow.length > 0) {
        nav.appendChild(buildMoreButton_(overflow));
      }
    }

    function renderNavDesktop_() {
      var nav = $("app-nav-desktop");
      if (!nav) return;
      clearChildren(nav);
      if (sections_.length === 0) {
        nav.setAttribute("hidden", "");
        return;
      }
      nav.removeAttribute("hidden");

      for (var i = 0; i < sections_.length; i++) {
        // Scanner is phone-only: it drives the rear camera via
        // <input capture=environment>, which is meaningless on desktop.
        if (sections_[i].key === SECTION_KEYS.SCANNER) continue;
        nav.appendChild(buildNavItem_(sections_[i], false));
      }
    }

    function buildNavItem_(section, isPhone) {
      var label = section.label;
      // Phone nav uses compact labels for space.
      if (isPhone) {
        if (section.key === SECTION_KEYS.PROFILE) label = "個人";
        else if (section.key === SECTION_KEYS.PROGRAMS) label = "課程";
        else if (section.key === SECTION_KEYS.EVENTS) label = "聚會";
        else if (section.key === SECTION_KEYS.SCANNER) label = "掃描";
        else if (section.key === SECTION_KEYS.CARE) label = "關懷";
        else if (section.key === SECTION_KEYS.PERMISSIONS) label = "權限";
      }
      // Build nav item button with optional badge.
      var children = [el("span", { class: "nav-item-label", text: label })];
      var count = sectionBadgeCounts_[section.key];
      if (count !== undefined && count !== null) {
        var badge = document.createElement("span");
        badge.className = "nav-badge";
        badge.setAttribute("data-badge", section.key);
        if (count > 0) {
          badge.textContent = formatBadgeCount_(count);
        } else {
          badge.setAttribute("hidden", "");
        }
        children.push(badge);
      }
      return el(
        "button",
        {
          class: isPhone
            ? "nav-item nav-item-phone"
            : "nav-item nav-item-desktop",
          type: "button",
          "data-section": section.key,
          "aria-current": "false",
          role: "link",
          onclick: (function (key) {
            return function () {
              navigateTo_(key);
            };
          })(section.key),
        },
        children
      );
    }

    function buildMoreButton_(overflowSections) {
      var btn = el(
        "button",
        {
          class: "nav-item nav-item-phone nav-item-more",
          type: "button",
          "data-section": "more",
          "aria-haspopup": "true",
          role: "link",
          onclick: toggleMoreMenu_,
        },
        [el("span", { class: "nav-item-label", text: "更多" })]
      );
      // Build the overflow menu (hidden by default).
      var menu = el("div", {
        id: "more-menu",
        class: "more-menu hidden",
        role: "menu",
      });
      for (var i = 0; i < overflowSections.length; i++) {
        var s = overflowSections[i];
        var itemChildren = [document.createTextNode(s.label)];
        var count = sectionBadgeCounts_[s.key];
        if (count !== undefined && count !== null) {
          var badge = document.createElement("span");
          badge.className = "nav-badge";
          badge.setAttribute("data-badge", s.key);
          if (count > 0) {
            badge.textContent = formatBadgeCount_(count);
          } else {
            badge.setAttribute("hidden", "");
          }
          itemChildren.push(badge);
        }
        menu.appendChild(
          el(
            "button",
            {
              class: "more-menu-item",
              type: "button",
              role: "menuitem",
              "data-section": s.key,
              onclick: (function (key) {
                return function () {
                  hideMoreMenu_();
                  navigateTo_(key);
                };
              })(s.key),
            },
            itemChildren
          )
        );
      }
      btn.appendChild(menu);
      return btn;
    }

    function toggleMoreMenu_() {
      var menu = $("more-menu");
      if (!menu) return;
      if (menu.classList.contains("hidden")) {
        menu.classList.remove("hidden");
      } else {
        hideMoreMenu_();
      }
    }

    function hideMoreMenu_() {
      var menu = $("more-menu");
      if (menu) menu.classList.add("hidden");
    }

    function updateActiveNav_() {
      // Iterate children of both nav containers rather than using
      // document.querySelectorAll which may not be available in test
      // harness minimal DOM mocks.
      var containers = [$("app-nav-phone"), $("app-nav-desktop")];
      for (var ci = 0; ci < containers.length; ci++) {
        var container = containers[ci];
        if (!container) continue;
        var children = container.children;
        for (var i = 0; i < children.length; i++) {
          var item = children[i];
          if (!item.getAttribute) continue;
          var section = item.getAttribute("data-section");
          if (section === currentSection_) {
            item.setAttribute("aria-current", "page");
            item.classList.add("nav-item-active");
          } else if (section !== "more") {
            item.setAttribute("aria-current", "false");
            item.classList.remove("nav-item-active");
          }
        }
      }
    }
    // -----------------------------------------------------------------
    // Section navigation (issue #67 / #68)
    // -----------------------------------------------------------------
    function navigateTo_(sectionKey) {
      // Dirty-form guard (issue #70): if a form is dirty, confirm discard first.
      if (
        activeFormGuard_ &&
        (activeFormGuard_.isDirty() || activeFormGuard_.isPending())
      ) {
        window.EfccFormGuard.confirmDiscard({
          message: "系統將捨棄尚未儲存的變更，確定要離開嗎？",
          onConfirm: function () {
            activeFormGuard_ = null;
            navigateToImpl_(sectionKey);
          },
          restoreFocusTo: $("demo-edit-field"),
        });
        return;
      }
      navigateToImpl_(sectionKey);
    }
    function beginServerAuth_(section) {
      var sectionKey = section.key;
      navGeneration_ += 1;
      var authGeneration = navGeneration_;
      currentSection_ = sectionKey;
      updateActiveNav_();
      hideMoreMenu_();
      renderSectionLoadingCard_(sectionKey);
      callServer_(
        "section-auth:" + sectionKey,
        function (onSuccess, onFailure) {
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .api_authorizedNavigate(
              session_.userId,
              session_.sessionId,
              session_.sessionToken,
              sectionKey
            );
        },
        function (envelope) {
          if (authGeneration !== navGeneration_) return; // superseded
          if (!envelope || typeof envelope !== "object") {
            renderSectionErrorCard_(sectionKey, "MALFORMED");
            return;
          }
          if (envelope.success === true) {
            renderSection_(sectionKey);
            return;
          }
          var code =
            (envelope.error && envelope.error.code) || "INTERNAL_ERROR";
          if (code === "AUTH_REQUIRED") {
            var message =
              (envelope.error && envelope.error.message) ||
              "工作階段已過期，請重新登入";
            clearAuthenticatedClientState_();
            setAppState(STATE.SIGNED_OUT);
            renderLogin_();
            setStatus("");
            showLoginError_(message);
            return;
          }
          if (code === "FORBIDDEN") {
            navigateToNearestPermitted_();
            return;
          }
          renderSectionErrorCard_(sectionKey, "GENERIC");
        },
        function (err) {
          if (authGeneration !== navGeneration_) return; // superseded
          renderSectionErrorCard_(sectionKey, "TRANSPORT");
        }
      );
    }

    function findSectionByKey_(sectionKey) {
      for (var i = 0; i < sections_.length; i++) {
        if (sections_[i].key === sectionKey) {
          return sections_[i];
        }
      }
      return null;
    }

    function navigateToImpl_(sectionKey) {
      // If a nested task is open, any root nav click closes it first.
      if (activeTask_ !== null) {
        activeTask_ = null;
        if (sectionKey === currentSection_) {
          // Same root as the open task's parent — close task, show root.
          renderSection_(sectionKey);
          return;
        }
        // Different root — close task and fall through to navigate.
      } else if (sectionKey === currentSection_) {
        return; // True no-op: at this root with no task open.
      }
      if (
        currentSection_ === SECTION_KEYS.SCANNER &&
        sectionKey !== SECTION_KEYS.SCANNER
      ) {
        teardownScannerRuntime_();
      }
      // Check authorization: client-side membership in bootstrap list.
      var section = findSectionByKey_(sectionKey);
      if (!section) {
        renderForbidden_(sectionKey);
        return;
      }

      // Server-authorized sections require an explicit RPC before rendering
      // (tiered auth model: issue #69 AC #7).
      if (section.requiresServerAuth === true) {
        beginServerAuth_(section);
        return;
      }

      // Member-accessible sections render directly after client-side check.
      currentSection_ = sectionKey;
      updateActiveNav_();
      hideMoreMenu_();
      renderSection_(sectionKey);
    }

    function buildSectionCard_(sectionKey, title, description) {
      var isProfile = sectionKey === SECTION_KEYS.PROFILE;
      var container = el("section", { class: "page view-" + sectionKey });
      var card = el("div", { class: "login-card" });
      card.appendChild(el("h2", { text: title }));
      // Refresh button for non-profile data-bearing Sections.
      if (!isProfile) {
        card.appendChild(
          el(
            "button",
            {
              class: "btn btn-refresh",
              type: "button",
              "data-action": "refresh-section",
              "data-section": sectionKey,
              "aria-label": "重新整理",
              onclick: (function (k) {
                return function () {
                  refreshSection_(k);
                };
              })(sectionKey),
            },
            "重新整理"
          )
        );
      }
      card.appendChild(el("p", { class: "muted", text: description }));
      // Demo task buttons (issue #68).
      if (sectionKey === SECTION_KEYS.PROGRAMS) {
        card.appendChild(
          el(
            "button",
            {
              class: "btn btn-open-task",
              type: "button",
              "data-action": "open-task",
              "data-task": "programs-detail-demo",
              onclick: function () {
                openTask_({
                  key: "programs-detail-demo",
                  parentSection: SECTION_KEYS.PROGRAMS,
                  parentLabel: "課程",
                  title: "詳情",
                  kind: "detail",
                });
              },
            },
            "查看範例課程詳情"
          )
        );
      }
      if (sectionKey === SECTION_KEYS.EVENTS) {
        card.appendChild(
          el("p", {
            class: "muted",
            text: "範例計數器：" + eventsDemoCounter_,
          })
        );
        card.appendChild(
          el(
            "button",
            {
              class: "btn btn-open-task",
              type: "button",
              "data-action": "open-task",
              "data-task": "events-edit-demo",
              onclick: function () {
                openTask_({
                  key: "events-edit-demo",
                  parentSection: SECTION_KEYS.EVENTS,
                  parentLabel: "聚會",
                  title: "編輯",
                  kind: "edit",
                });
              },
            },
            "編輯範例聚會"
          )
        );
      }
      container.appendChild(card);
      return container;
    }

    // -----------------------------------------------------------------
    // Async Section recovery UI (issue #69). Distinct Traditional
    // Chinese copy per error code, plus loading/empty/error card
    // renderers scoped to the content region. Only Programs uses
    // these in this branch (see loadProgramsSection_ below); the
    // functions are written generically so a future Section RPC can
    // reuse them without duplicating copy.
    // -----------------------------------------------------------------
    function errorCopyFor_(code) {
      switch (code) {
        case "AUTH_REQUIRED":
          return { heading: "登入工作階段已失效", detail: "請重新登入。" };
        case "FORBIDDEN":
          return { heading: "無法存取", detail: "你沒有權限使用此功能。" };
        case "INTERNAL_ERROR":
          return {
            heading: "伺服器錯誤",
            detail: "系統發生錯誤，請稍後再試。",
          };
        case "TRANSPORT":
          return {
            heading: "網絡連線失敗",
            detail: "請檢查網絡連線後再試。",
          };
        case "RENDER_ERROR":
          return {
            heading: "顯示錯誤",
            detail: "頁面顯示時發生錯誤，請重新整理或返回其他頁面。",
          };
        default:
          return {
            heading: "載入失敗",
            detail: "網絡連線不穩定或伺服器暫時無法回應，請稍後再試。",
          };
      }
    }

    function renderSectionLoadingCard_(sectionKey) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      content.appendChild(
        el(
          "section",
          { class: "page view-loading", "data-section": sectionKey },
          [
            el("div", { class: "login-card text-center" }, [
              el("p", { class: "muted", text: "載入中..." }),
            ]),
          ]
        )
      );
    }

    function renderSectionErrorCard_(sectionKey, code) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      var copy = errorCopyFor_(code);
      content.appendChild(
        el(
          "section",
          { class: "page view-error", "data-section": sectionKey },
          [
            el("div", { class: "login-card text-center" }, [
              el("h2", { text: copy.heading }),
              el("p", { class: "muted", text: copy.detail }),
              el(
                "button",
                {
                  class: "btn btn-primary btn-full",
                  type: "button",
                  "data-action": "section-retry",
                  "data-section": sectionKey,
                  onclick: (function (k) {
                    return function () {
                      handleSectionRetry_(k);
                    };
                  })(sectionKey),
                },
                "重試"
              ),
            ]),
          ]
        )
      );
    }

    function renderProgramsEmpty_() {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      content.appendChild(
        el(
          "section",
          {
            class: "page view-empty",
            "data-section": SECTION_KEYS.PROGRAMS,
          },
          [
            el("div", { class: "login-card text-center" }, [
              el("h2", { text: "課程" }),
              el("p", { class: "muted", text: "目前沒有課程資料。" }),
              el(
                "button",
                {
                  class: "btn btn-refresh",
                  type: "button",
                  "data-action": "refresh-section",
                  "data-section": SECTION_KEYS.PROGRAMS,
                  "aria-label": "重新整理",
                  onclick: function () {
                    refreshSection_(SECTION_KEYS.PROGRAMS);
                  },
                },
                "重新整理"
              ),
            ]),
          ]
        )
      );
    }

    function renderProgramsContent_(programs) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      var container = el("section", { class: "page view-programs" });
      var card = el("div", { class: "login-card" });
      card.appendChild(el("h2", { text: "課程" }));
      card.appendChild(
        el(
          "button",
          {
            class: "btn btn-refresh",
            type: "button",
            "data-action": "refresh-section",
            "data-section": SECTION_KEYS.PROGRAMS,
            "aria-label": "重新整理",
            onclick: function () {
              refreshSection_(SECTION_KEYS.PROGRAMS);
            },
          },
          "重新整理"
        )
      );
      var list = el("ul", { class: "programs-list" });
      for (var i = 0; i < programs.length; i++) {
        var p = programs[i];
        list.appendChild(
          el("li", { class: "programs-list-item", "data-program-id": p.id }, [
            el("strong", { text: p.name }),
            el("span", { class: "muted", text: " (" + p.type + ")" }),
            (function () {
              var descEl = document.createElement("p");
              descEl.className = "muted";
              var descText = String(p.description);
              // Scan for first http/https URL token and linkify it.
              var urlMatch = descText.match(/(https?:\/\/[^\s]+)/);
              if (urlMatch) {
                var idx = urlMatch.index;
                var before = descText.slice(0, idx);
                var urlStr = urlMatch[1];
                var after = descText.slice(idx + urlStr.length);
                if (before) {
                  descEl.appendChild(
                    window.EfccFormGuard.renderMultilineText(before)
                  );
                }
                descEl.appendChild(
                  window.EfccFormGuard.buildSafeLink(urlStr, urlStr)
                );
                if (after) {
                  descEl.appendChild(
                    window.EfccFormGuard.renderMultilineText(after)
                  );
                }
              } else {
                descEl.appendChild(
                  window.EfccFormGuard.renderMultilineText(descText)
                );
              }
              return descEl;
            })(),
          ])
        );
      }
      card.appendChild(list);
      // Demo detail task preserved from issue #68's nested-task proof.
      card.appendChild(
        el(
          "button",
          {
            class: "btn btn-open-task",
            type: "button",
            "data-action": "open-task",
            "data-task": "programs-detail-demo",
            onclick: function () {
              openTask_({
                key: "programs-detail-demo",
                parentSection: SECTION_KEYS.PROGRAMS,
                parentLabel: "課程",
                title: "詳情",
                kind: "detail",
              });
            },
          },
          "查看範例課程詳情"
        )
      );
      container.appendChild(card);
      content.appendChild(container);
    }

    // -----------------------------------------------------------------
    // Programs Section async loader (issue #69, prerequisite slice of
    // #53). This is the ONE real Section RPC in this branch; other
    // Sections remain synchronous placeholders (see renderSectionImpl_
    // below). Uses callServer_ for per-tag request dedup AND
    // navGeneration_ for cross-Section stale-response protection.
    // -----------------------------------------------------------------
    function loadProgramsSection_() {
      var sectionKey = SECTION_KEYS.PROGRAMS;
      if (!session_) return;
      sectionStates_[sectionKey] = { state: SECTION_STATE.LOADING };
      renderSectionLoadingCard_(sectionKey);
      // Capture (do not increment) — renderSection_ already bumped
      // navGeneration_ for THIS render pass. Any older in-flight
      // Programs load from a PRIOR render pass will see a mismatch
      // below and drop its response silently.
      var myGeneration = navGeneration_;
      callServer_(
        "section:programs",
        function (onSuccess, onFailure) {
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .api_getPrograms(
              session_.userId,
              session_.sessionId,
              session_.sessionToken
            );
        },
        function (envelope) {
          if (myGeneration !== navGeneration_) return; // superseded
          handleProgramsEnvelope_(envelope);
        },
        function (err) {
          if (myGeneration !== navGeneration_) return; // superseded
          handleProgramsFailure_(err);
        }
      );
    }

    function isValidProgramItem_(p) {
      return (
        p !== null &&
        typeof p === "object" &&
        typeof p.id === "string" &&
        p.id.length > 0 &&
        typeof p.name === "string" &&
        typeof p.type === "string" &&
        typeof p.description === "string"
      );
    }

    // Given ALREADY-VALIDATED Programs data (empty or non-empty),
    // set the correct state (EMPTY vs READY) and render it, wrapped
    // in its own try/catch (issue #69 AC #9). Shared by the initial
    // RPC success path AND the render-only retry path so both
    // dispatch identically between the empty-state view and the
    // content view — a render-only retry after an EMPTY-state crash
    // must not regress to showing content-view chrome for zero
    // items, and vice versa.
    function applyProgramsData_(data) {
      var sectionKey = SECTION_KEYS.PROGRAMS;
      if (data.length === 0) {
        sectionStates_[sectionKey] = { state: SECTION_STATE.EMPTY, data: [] };
        try {
          renderProgramsEmpty_();
        } catch (e) {
          if (typeof console !== "undefined" && console.error) {
            console.error("Programs empty-state render error:", e);
          }
          sectionStates_[sectionKey] = {
            state: SECTION_STATE.ERROR,
            errorCode: "RENDER_ERROR",
            data: [],
          };
          renderSectionErrorCard_(sectionKey, "RENDER_ERROR");
        }
        return;
      }
      sectionStates_[sectionKey] = { state: SECTION_STATE.READY, data: data };
      try {
        renderProgramsContent_(data);
      } catch (e) {
        if (typeof console !== "undefined" && console.error) {
          console.error("Programs content render error:", e);
        }
        sectionStates_[sectionKey] = {
          state: SECTION_STATE.ERROR,
          errorCode: "RENDER_ERROR",
          data: data,
        };
        renderSectionErrorCard_(sectionKey, "RENDER_ERROR");
      }
    }

    function handleProgramsEnvelope_(envelope) {
      var sectionKey = SECTION_KEYS.PROGRAMS;
      if (!envelope || typeof envelope !== "object") {
        handleProgramsFailure_({
          kind: "MALFORMED",
          message: "伺服器回應格式不正確。",
        });
        return;
      }
      if (envelope.success === true) {
        var data = envelope.data;
        if (!Array.isArray(data)) {
          // Malformed success envelope (data is not an array) is a
          // server contract violation, distinct from a genuinely
          // empty catalog. Route through the same MALFORMED failure
          // path as a structurally invalid envelope.
          handleProgramsFailure_({
            kind: "MALFORMED",
            message: "伺服器回應格式不正確。",
          });
          return;
        }
        if (data.length === 0) {
          applyProgramsData_([]);
          return;
        }
        // Validate every item BEFORE transitioning to READY. A
        // malformed item (null, missing field) inside an otherwise
        // valid array must not reach renderProgramsContent_, since
        // this async RPC callback path is NOT covered by
        // renderSection_'s synchronous error boundary — an
        // uncaught exception here would leak past any recovery UI.
        for (var i = 0; i < data.length; i++) {
          if (!isValidProgramItem_(data[i])) {
            handleProgramsFailure_({
              kind: "MALFORMED",
              message: "伺服器回應格式不正確。",
            });
            return;
          }
        }
        applyProgramsData_(data);
        return;
      }
      var code = (envelope.error && envelope.error.code) || "INTERNAL_ERROR";
      var message = (envelope.error && envelope.error.message) || null;
      if (code === "AUTH_REQUIRED") {
        sectionStates_[sectionKey] = {
          state: SECTION_STATE.ERROR,
          errorCode: code,
        };
        clearAuthenticatedClientState_();
        setAppState(STATE.SIGNED_OUT);
        renderLogin_();
        setStatus("");
        showLoginError_(message || "登入工作階段已失效，請重新登入。");
        return;
      }
      if (code === "FORBIDDEN") {
        sectionStates_[sectionKey] = {
          state: SECTION_STATE.ERROR,
          errorCode: code,
        };
        setStatus("");
        refreshAuthorization_();
        return;
      }
      sectionStates_[sectionKey] = {
        state: SECTION_STATE.ERROR,
        errorCode: code,
      };
      renderSectionErrorCard_(sectionKey, code);
    }

    function handleProgramsFailure_(err) {
      var sectionKey = SECTION_KEYS.PROGRAMS;
      var code = "TRANSPORT";
      if (err && err.kind === "MALFORMED") code = "INTERNAL_ERROR";
      sectionStates_[sectionKey] = {
        state: SECTION_STATE.ERROR,
        errorCode: code,
      };
      renderSectionErrorCard_(sectionKey, code);
    }

    function handleSectionRetry_(sectionKey) {
      if (sectionKey === SECTION_KEYS.PROGRAMS) {
        var existing = sectionStates_[sectionKey];
        if (
          existing &&
          existing.errorCode === "RENDER_ERROR" &&
          Array.isArray(existing.data)
        ) {
          // The data already fetched successfully — only the
          // rendering step failed. Repeat ONLY the failed operation
          // (render), not the already-succeeded RPC (AC #6).
          // applyProgramsData_ dispatches EMPTY vs READY correctly
          // (an EMPTY-view render failure must retry into the EMPTY
          // view again, not regress into the content view for zero
          // items) and re-wraps the retry in its own try/catch, so a
          // repeat failure stays RENDER_ERROR with the same data
          // preserved rather than silently falling back to a
          // network re-fetch for what is a client-side rendering
          // defect.
          applyProgramsData_(existing.data);
          return;
        }
        sectionStates_[sectionKey] = { state: SECTION_STATE.IDLE };
        loadProgramsSection_();
        return;
      }
      // Server-authorized Sections need a fresh auth RPC on retry,
      // not just a re-render (issue #69 AC #7).
      var section = findSectionByKey_(sectionKey);
      if (section && section.requiresServerAuth === true) {
        beginServerAuth_(section);
        return;
      }
      // Generic render-error retry (issue #69 AC #9): re-attempt
      // rendering the same Section. The error boundary in
      // renderSection_ will catch a repeat failure.
      renderSection_(sectionKey);
    }

    function renderSection_(sectionKey) {
      // Monotonic navigation generation (issue #69 AC #3): every
      // render intent — whether from navigateTo_, closeTask_,
      // refreshSection_, or recovery navigation — bumps this
      // counter. A Programs load started under an OLDER generation
      // drops its response silently when it resolves, so a late
      // response from a Section the user has since left (or
      // re-entered) cannot overwrite the current view.
      navGeneration_ += 1;
      // Error boundary (issue #69 AC #9): an unexpected client
      // rendering exception must never leave a blank document. Any
      // throw inside renderSectionImpl_ is caught and replaced with
      // a recoverable error panel. Preserve any already-loaded data
      // for the Section so a retry can re-attempt rendering ONLY
      // (AC #6), without discarding a previously successful fetch.
      var priorState = sectionStates_[sectionKey];
      try {
        renderSectionImpl_(sectionKey);
      } catch (e) {
        if (typeof console !== "undefined" && console.error) {
          console.error("Section render error for " + sectionKey + ":", e);
        }
        sectionStates_[sectionKey] = {
          state: SECTION_STATE.ERROR,
          errorCode: "RENDER_ERROR",
          data: priorState && priorState.data,
        };
        renderSectionErrorCard_(sectionKey, "RENDER_ERROR");
      }
    }

    function renderSectionImpl_(sectionKey) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      // Check view-state cache: restore scroll unless stale.
      var cached = sectionViewCache_[sectionKey];
      if (cached && !cached.stale) {
        // Scroll restoration hint — the content will be re-rendered
        // but preserving scroll is handled by the real DOM.
      }
      switch (sectionKey) {
        case SECTION_KEYS.PROFILE:
          if (session_) {
            renderProfileContent_(session_);
          } else {
            content.appendChild(
              el("section", { class: "page view-placeholder" }, [
                el("div", { class: "login-card text-center" }, [
                  el("h2", { text: "個人資料" }),
                  el("p", { class: "muted", text: "載入中..." }),
                ]),
              ])
            );
          }
          break;
        case SECTION_KEYS.PROGRAMS: {
          // Programs is the one real async Section RPC in this
          // branch (issue #69, prerequisite slice of #53). Render
          // from cached state if READY/EMPTY/ERROR; otherwise
          // (IDLE, or LOADING from a now-superseded generation)
          // start a fresh load for the CURRENT generation. Always
          // (re)starting here — rather than treating LOADING as a
          // no-op — is what keeps the loading UI visible instead of
          // going blank when the user revisits Programs while an
          // older, now-abandoned request is still in flight.
          var progState = sectionStates_[SECTION_KEYS.PROGRAMS];
          var progStateName = progState ? progState.state : SECTION_STATE.IDLE;
          if (progStateName === SECTION_STATE.READY) {
            renderProgramsContent_(progState.data);
          } else if (progStateName === SECTION_STATE.EMPTY) {
            renderProgramsEmpty_();
          } else if (progStateName === SECTION_STATE.ERROR) {
            renderSectionErrorCard_(SECTION_KEYS.PROGRAMS, progState.errorCode);
          } else {
            loadProgramsSection_();
          }
          break;
        }
        case SECTION_KEYS.EVENTS:
          content.appendChild(
            buildSectionCard_(sectionKey, "聚會", "聚會管理將於後續版本提供。")
          );
          break;
        case SECTION_KEYS.SCANNER: {
          // F5 external-origin QR Scanner (Option A: external camera page +
          // postMessage bridge). Load active events (capability-filtered)
          // once, then render the Event picker + open-scanner flow. Re-entry
          // reuses cached events.
          var scanState = sectionStates_[SECTION_KEYS.SCANNER];
          var scanStateName = scanState ? scanState.state : SECTION_STATE.IDLE;
          if (scanStateName === SECTION_STATE.READY) {
            renderScannerContent_(scanState.data);
          } else if (scanStateName === SECTION_STATE.ERROR) {
            renderSectionErrorCard_(SECTION_KEYS.SCANNER, scanState.errorCode);
          } else {
            loadScannerSection_();
          }
          break;
        }
        case SECTION_KEYS.CARE:
          content.appendChild(
            buildSectionCard_(
              sectionKey,
              "關懷",
              "關懷儀表板將於後續版本提供。"
            )
          );
          break;
        case SECTION_KEYS.PERMISSIONS:
          content.appendChild(
            buildSectionCard_(
              sectionKey,
              "權限管理",
              "權限管理將於後續版本提供。"
            )
          );
          break;
        default:
          renderForbidden_(sectionKey);
      }
      // Mark cache as not stale after render.
      if (sectionViewCache_[sectionKey]) {
        sectionViewCache_[sectionKey].stale = false;
      }
      content.scrollTop = cached && !cached.stale ? cached.scrollTop || 0 : 0;
    }

    // -----------------------------------------------------------------
    // Scanner Section (F5, external-origin Option A per ADR-0015).
    // Camera capture + decode live on an external HTTPS origin
    // (SCANNER_PAGE_URL_) because getUserMedia is blocked in the /exec IFRAME
    // (research 2026-07-30/#87 + 2026-08-01 best-method note). This Section
    // opens the external scanner page (window.open), receives an opaque
    // scannedCode via postMessage, runs api_qrCheckIn, and posts the result
    // back for inline ✓/✗ on the scanner page. The check-in authority stays
    // server-side: api_qrCheckIn re-verifies session, capability, Event,
    // Member, and Enrollment; the client only sends an opaque scannedCode.
    // -----------------------------------------------------------------
    function loadScannerSection_() {
      sectionStates_[SECTION_KEYS.SCANNER] = { state: SECTION_STATE.LOADING };
      renderSectionLoadingCard_(SECTION_KEYS.SCANNER);
      // Capture (do not increment) - renderSection_ already bumped
      // navGeneration_ for this entry (same convention as loadProgramsSection_).
      var gen = navGeneration_;
      callServer_(
        "section:scanner-events",
        function (onSuccess, onFailure) {
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .api_getScannerEvents(
              session_.userId,
              session_.sessionId,
              session_.sessionToken
            );
        },
        function (envelope) {
          if (gen !== navGeneration_) return; // superseded
          if (!envelope || typeof envelope !== "object") {
            sectionStates_[SECTION_KEYS.SCANNER] = {
              state: SECTION_STATE.ERROR,
              errorCode: "MALFORMED",
            };
            renderSectionErrorCard_(SECTION_KEYS.SCANNER, "MALFORMED");
            return;
          }
          if (envelope.success === true) {
            sectionStates_[SECTION_KEYS.SCANNER] = {
              state: SECTION_STATE.READY,
              data: envelope.data || [],
            };
            renderSection_(SECTION_KEYS.SCANNER);
            return;
          }
          var code =
            (envelope.error && envelope.error.code) || "INTERNAL_ERROR";
          if (code === "AUTH_REQUIRED") {
            var message =
              (envelope.error && envelope.error.message) ||
              "工作階段已過期，請重新登入";
            clearAuthenticatedClientState_();
            setAppState(STATE.SIGNED_OUT);
            renderLogin_();
            setStatus("");
            showLoginError_(message);
            return;
          }
          if (code === "FORBIDDEN") {
            navigateToNearestPermitted_();
            return;
          }
          sectionStates_[SECTION_KEYS.SCANNER] = {
            state: SECTION_STATE.ERROR,
            errorCode: "GENERIC",
          };
          renderSectionErrorCard_(SECTION_KEYS.SCANNER, "GENERIC");
        },
        function () {
          if (gen !== navGeneration_) return;
          sectionStates_[SECTION_KEYS.SCANNER] = {
            state: SECTION_STATE.ERROR,
            errorCode: "TRANSPORT",
          };
          renderSectionErrorCard_(SECTION_KEYS.SCANNER, "TRANSPORT");
        }
      );
    }

    function renderScannerContent_(events) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      if (!events || events.length === 0) {
        content.appendChild(
          buildSectionCard_(
            SECTION_KEYS.SCANNER,
            "掃描",
            "目前沒有可掃描的活躍聚會。"
          )
        );
        return;
      }
      // Fresh entry resets in-flight + cooldown.
      scannerRuntime_.selectedEventId = events[0].eventId;
      scannerRuntime_.selectedEventName = events[0].eventName;
      scannerRuntime_.inFlight = false;
      scannerRuntime_.lastCode = null;
      scannerRuntime_.lastCodeAt = 0;
      scannerRuntime_.lastResult = null;

      var card = el("div", { class: "login-card" }, [
        el("h2", { text: "出席掃描" }),
        el("p", {
          class: "muted",
          text: "選擇聚會後，點按「掃描 QR Code」開啟相機掃描會員 QR Code。",
        }),
      ]);

      var select = el("select", {
        id: "scanner-event",
        class: "input",
      });
      for (var i = 0; i < events.length; i++) {
        var ev = events[i];
        select.appendChild(
          el("option", {
            value: ev.eventId,
            text: ev.eventName + "（" + ev.programName + "）",
          })
        );
      }
      select.addEventListener("change", function () {
        scannerRuntime_.selectedEventId = select.value;
        var picked = events.filter(function (e) {
          return e.eventId === select.value;
        })[0];
        scannerRuntime_.selectedEventName = picked
          ? picked.eventName
          : select.value;
      });
      card.appendChild(el("label", { for: "scanner-event", text: "聚會" }));
      card.appendChild(select);

      var scanBtn = el("button", {
        id: "scanner-scan",
        class: "btn btn-primary btn-full",
        type: "button",
        text: "掃描 QR Code",
      });
      scanBtn.addEventListener("click", openScanner_);
      card.appendChild(scanBtn);

      // Keep only a compact recoverable error surface here. The Scanner Window
      // owns camera/loading/check-in/result feedback so the operator does not
      // see two competing result surfaces.
      var status = el("p", {
        id: "scanner-status",
        class: "scanner-status scanner-status--info",
        role: "status",
        "aria-live": "polite",
        text: "",
      });
      status.setAttribute("hidden", "hidden");
      card.appendChild(status);

      content.appendChild(
        el("section", { class: "page view-scanner" }, [card])
      );

      // __e2e hook (spec #93 Seam 2): inject a scannedCode without a real
      // camera/external window so Playwright can drive auto check-in, suppress,
      // and typed-error paths. Does NOT grant auth or write Sheets - the RPC
      // re-checks authority server-side. lastResult exposes the result message
      // that would be posted to the external scanner window.
      if (window.__EFCC_E2E) {
        window.__EFCC_E2E_SCANNER = {
          scan: handleScannerScan_,
          setEvent: function (id, name) {
            scannerRuntime_.selectedEventId = id;
            scannerRuntime_.selectedEventName = name || "";
          },
          events: events,
          lastResult: function () {
            return scannerRuntime_.lastResult;
          },
        };
      }
    }

    function scannerSetStatus_(text, tone) {
      var node = $("scanner-status");
      if (!node) return;
      node.textContent = text || "";
      node.className = "scanner-status scanner-status--" + (tone || "info");
      if (text) node.removeAttribute("hidden");
      else node.setAttribute("hidden", "hidden");
    }

    // -----------------------------------------------------------------
    // External-origin bridge (ADR-0015 Option A). The App Document opens the
    // scanner page (window.open), the scanner decodes + posts an opaque
    // scannedCode back, the App Document runs api_qrCheckIn and posts the
    // result back so the scanner shows inline ✓/✗. The message listener is
    // registered ONCE and reused across open/close cycles.
    // -----------------------------------------------------------------
    function ensureScannerMessageListener_() {
      if (scannerRuntime_.listenerInstalled) return;
      scannerRuntime_.listenerInstalled = true;
      scannerRuntime_.messageListener = function (event) {
        // Fail closed: only accept scans from the configured scanner origin.
        if (event.origin !== SCANNER_ORIGIN_) return;
        if (
          scannerRuntime_.scannerWindow &&
          event.source !== scannerRuntime_.scannerWindow
        ) {
          return;
        }
        var data = event.data;
        if (!data || data.type !== SCANNER_MSG_SCAN_) return;
        handleScannerScan_(data.scannedCode);
      };
      window.addEventListener("message", scannerRuntime_.messageListener);
    }

    function teardownScannerRuntime_() {
      if (scannerRuntime_.handshakeTimer) {
        window.clearInterval(scannerRuntime_.handshakeTimer);
        scannerRuntime_.handshakeTimer = null;
      }
      var popup = scannerRuntime_.scannerWindow;
      if (popup && !popup.closed) {
        try {
          popup.close();
        } catch (e) {
          // best-effort: the external page still tears down its camera on close
        }
      }
      scannerRuntime_.scannerWindow = null;
      if (scannerRuntime_.messageListener) {
        window.removeEventListener("message", scannerRuntime_.messageListener);
      }
      scannerRuntime_.messageListener = null;
      scannerRuntime_.listenerInstalled = false;
      scannerRuntime_.inFlight = false;
      scannerRuntime_.lastCode = null;
      scannerRuntime_.lastCodeAt = 0;
      scannerRuntime_.lastResult = null;
    }

    function sendScannerHandshake_(popup) {
      try {
        popup.postMessage(
          {
            type: SCANNER_MSG_HANDSHAKE_,
            eventName: scannerRuntime_.selectedEventName,
          },
          SCANNER_ORIGIN_
        );
      } catch (e) {
        // best-effort: the interval retries while the external page loads
      }
    }

    function openScanner_() {
      var eventId = scannerRuntime_.selectedEventId;
      if (!eventId) {
        scannerSetStatus_("請先選擇聚會。", "error");
        return;
      }
      ensureScannerMessageListener_();
      if (scannerRuntime_.handshakeTimer) {
        window.clearInterval(scannerRuntime_.handshakeTimer);
        scannerRuntime_.handshakeTimer = null;
      }
      if (
        scannerRuntime_.scannerWindow &&
        !scannerRuntime_.scannerWindow.closed
      ) {
        try {
          scannerRuntime_.scannerWindow.close();
        } catch (e) {
          // best-effort: replace the reference with a fresh window below
        }
      }
      // window.open from a user gesture; the popup escapes the sandbox via
      // allow-popups-to-escape-sandbox (research 2026-07-30/#87).
      var scannerUrl = SCANNER_PAGE_URL_;
      var query = [];
      if (window.location && window.location.origin) {
        query.push("opener=" + encodeURIComponent(window.location.origin));
      }
      if (scannerRuntime_.selectedEventName) {
        query.push(
          "eventName=" + encodeURIComponent(scannerRuntime_.selectedEventName)
        );
      }
      if (query.length > 0) scannerUrl += "?" + query.join("&");
      var popup = window.open(scannerUrl, "efccScanner");
      if (!popup) {
        scannerSetStatus_(
          "彈出視窗被封鎖。請允許此網站的彈出視窗後再試。",
          "error"
        );
        return;
      }
      scannerRuntime_.scannerWindow = popup;
      scannerSetStatus_("");
      // Send the handshake so the scanner learns our origin + the Event name
      // for its top bar. Retry a few times for a slow cross-origin page load.
      var attempts = 0;
      sendScannerHandshake_(popup);
      scannerRuntime_.handshakeTimer = window.setInterval(function () {
        attempts += 1;
        if (!popup || popup.closed || attempts > 6) {
          window.clearInterval(scannerRuntime_.handshakeTimer);
          scannerRuntime_.handshakeTimer = null;
          return;
        }
        sendScannerHandshake_(popup);
      }, 350);
    }

    function handleScannerScan_(rawCode) {
      var code = String(rawCode || "").trim();
      if (code === "") return; // the scanner normalizes; ignore empty
      var eventId = scannerRuntime_.selectedEventId;
      if (!eventId) {
        sendScannerResult_("error", "請先選擇聚會。");
        return;
      }
      var now = Date.now();
      // Same-code cooldown: a continuous camera stream fires many frames;
      // suppress repeats of the last settled code briefly (spec #93 US 13-14).
      if (
        code === scannerRuntime_.lastCode &&
        now - scannerRuntime_.lastCodeAt < SCANNER_SUPPRESS_MS_
      ) {
        return;
      }
      if (scannerRuntime_.inFlight) {
        return; // one pending check-in at a time (spec #93 US 12)
      }
      scannerRuntime_.inFlight = true;
      callServer_(
        "scanner:checkin",
        function (onSuccess, onFailure) {
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .api_qrCheckIn(
              session_.userId,
              session_.sessionId,
              session_.sessionToken,
              eventId,
              code,
              "QR_SCAN"
            );
        },
        function (envelope) {
          scannerRuntime_.inFlight = false;
          var result = buildCheckinResultMessage_(envelope);
          sendScannerResult_(result.tone, result.message, result.action);
          // Settled success: suppress the same code briefly (US 13-14).
          if (result.settled) {
            scannerRuntime_.lastCode = code;
            scannerRuntime_.lastCodeAt = Date.now();
          }
          if (result.authRequired) {
            clearAuthenticatedClientState_();
            setAppState(STATE.SIGNED_OUT);
            renderLogin_();
            setStatus("");
            showLoginError_(result.authMessage);
          }
        },
        function () {
          scannerRuntime_.inFlight = false;
          // Transport failure: generic Traditional Chinese copy only (never
          // echo the raw google.script.run error). lastCode is NOT set, so a
          // retry of the same code is not blocked (spec #93 US 25).
          var msg = "網絡連線不穩定，請重新掃描。";
          sendScannerResult_("error", msg, "retry");
        }
      );
    }

    // Build the inline result message (tone + text) from the api_qrCheckIn
    // envelope. Reuses the shared copy contract: created/duplicate success,
    // server-supplied Traditional-Chinese error messages, never echoes the code.
    function buildCheckinResultMessage_(envelope) {
      if (!envelope || typeof envelope !== "object") {
        return { tone: "error", message: "系統回應異常，請重試。" };
      }
      if (envelope.success === true) {
        var d = envelope.data || {};
        // created:true = new Attendance; created:false = quiet duplicate
        // (no alarm, no second row - spec #93 US 15-17).
        return {
          tone: d.created ? "success" : "info",
          action: "auto",
          settled: true,
          message:
            (d.created ? "簽到成功：" : "已簽到：") + (d.memberName || ""),
        };
      }
      var errCode = (envelope.error && envelope.error.code) || "INTERNAL_ERROR";
      if (errCode === "AUTH_REQUIRED") {
        return {
          tone: "error",
          action: "resume",
          settled: false,
          authRequired: true,
          authMessage:
            (envelope.error && envelope.error.message) ||
            "工作階段已過期，請重新登入",
          message:
            (envelope.error && envelope.error.message) ||
            "工作階段已過期，請重新登入",
        };
      }
      // Typed failures (FORBIDDEN/NOT_ENROLLED/MEMBER_NOT_FOUND/etc.) - the
      // server message is Traditional Chinese and never echoes the code.
      return {
        tone: "error",
        action: "resume",
        settled: false,
        message:
          (envelope.error && envelope.error.message) || "簽到失敗，請重試。",
      };
    }

    // Post the check-in result back to the external scanner window so it can
    // show inline ✓/✗. Also records lastResult for __e2e observability.
    function sendScannerResult_(tone, message, action) {
      scannerRuntime_.lastResult = {
        tone: tone,
        message: message,
        action: action || "resume",
      };
      var popup = scannerRuntime_.scannerWindow;
      if (!popup || popup.closed) return;
      try {
        popup.postMessage(
          {
            type: SCANNER_MSG_RESULT_,
            tone: tone,
            message: message,
            action: action || "resume",
          },
          SCANNER_ORIGIN_
        );
      } catch (e) {
        // best-effort: the scanner keeps its last visible state
      }
    }

    function renderProfileContent_(sessionData) {
      var content = $("app-content");
      if (!content) return;

      content.appendChild(

    function navigateToNearestPermitted_() {
      if (sections_.length > 0) {
        navigateTo_(sections_[0].key);
      } else {
        currentSection_ = null;
        updateActiveNav_();
        renderProfileContent_(session_);
      }
    }

    // -----------------------------------------------------------------
    // Badge formatting and update (issue #68)
    // -----------------------------------------------------------------
    function formatBadgeCount_(count) {
      if (count > 99) return "99+";
      return String(count);
    }

    function updateBadge_(sectionKey, count) {
      sectionBadgeCounts_[sectionKey] = count;
      var containers = [$("app-nav-phone"), $("app-nav-desktop")];
      for (var ci = 0; ci < containers.length; ci++) {
        var container = containers[ci];
        if (!container) continue;
        var children = container.children;
        for (var i = 0; i < children.length; i++) {
          var item = children[i];
          if (!item || !item.getAttribute) continue;
          var key = item.getAttribute("data-section");
          if (key !== sectionKey) continue;
          // Find existing badge child or create one on demand.
          var badge = null;
          for (var bi = 0; bi < item.childNodes.length; bi++) {
            var child = item.childNodes[bi];
            if (
              child.getAttribute &&
              child.getAttribute("data-badge") === sectionKey
            ) {
              badge = child;
              break;
            }
          }
          if (!badge && count > 0) {
            badge = document.createElement("span");
            badge.className = "nav-badge";
            badge.setAttribute("data-badge", sectionKey);
            item.appendChild(badge);
          }
          if (badge) {
            if (count > 0) {
              badge.textContent = formatBadgeCount_(count);
              badge.removeAttribute("hidden");
            } else {
              badge.setAttribute("hidden", "");
            }
          }
        }
      }
    }

    // -----------------------------------------------------------------
    // Section view-state cache (issue #68)
    // -----------------------------------------------------------------
    function invalidateSection_(sectionKey) {
      if (!sectionViewCache_[sectionKey]) {
        sectionViewCache_[sectionKey] = {};
      }
      sectionViewCache_[sectionKey].stale = true;
    }

    function refreshSection_(sectionKey) {
      // Defensive guard: the refresh button only ever renders inside
      // its own Section's card, so a legitimate click's sectionKey
      // always matches currentSection_ (task-open state does not
      // change currentSection_ — see openTask_). Reject anything
      // else rather than risk replacing a different active view.
      if (sectionKey !== currentSection_) return;
      // Explicit Refresh action (issue #64/#69). For Programs, force
      // a real re-fetch by resetting cached state to IDLE — without
      // this, renderSectionImpl_'s READY branch would just re-render
      // the stale cached list instead of calling the RPC again.
      if (sectionKey === SECTION_KEYS.PROGRAMS) {
        sectionStates_[sectionKey] = { state: SECTION_STATE.IDLE };
      }
      if (activeTask_ !== null) {
        // If a task is open, invalidate the parent section so returning
        // forces a fresh render. Do not re-render while the task is visible.
        invalidateSection_(sectionKey);
        return;
      }
      renderSection_(sectionKey);
    }

    // -----------------------------------------------------------------
    // Nested task navigation (issue #68)
    // -----------------------------------------------------------------
    function openTask_(descriptor) {
      if (!descriptor || !descriptor.key) return;
      // Create form guard for edit tasks (issue #70).
      if (descriptor.kind === "edit") {
        activeFormGuard_ = window.EfccFormGuard.create();
      }
      // Bump the navigation generation (issue #69 AC #3): opening a
      // task does not call renderSection_, so without this a Programs
      // (or any future async Section) load that was in flight when
      // the task opened would still apply its late response over the
      // now-displayed task view. See renderSection_ for the primary
      // bump point covering ordinary navigation.
      navGeneration_ += 1;
      // Save scroll position of the current section to its cache entry.
      var content = $("app-content");
      if (content) {
        if (!sectionViewCache_[currentSection_]) {
          sectionViewCache_[currentSection_] = {};
        }
        sectionViewCache_[currentSection_].scrollTop = content.scrollTop || 0;
      }
      activeTask_ = descriptor;
      renderTask_(descriptor);
    }

    function closeTask_() {
      // Dirty-form guard (issue #70): if a form is dirty, confirm discard first.
      if (
        activeFormGuard_ &&
        (activeFormGuard_.isDirty() || activeFormGuard_.isPending())
      ) {
        window.EfccFormGuard.confirmDiscard({
          message: "系統將捨棄尚未儲存的變更，確定要離開嗎？",
          onConfirm: function () {
            activeFormGuard_ = null;
            closeTaskImpl_();
          },
          restoreFocusTo: $("demo-edit-field"),
        });
        return;
      }
      closeTaskImpl_();
    }
    function closeTaskImpl_() {
      if (!activeTask_) return;
      var parentSection = activeTask_.parentSection;
      activeTask_ = null;
      // Save scroll position before returning.
      var content = $("app-content");
      if (content) {
        if (!sectionViewCache_[parentSection]) {
          sectionViewCache_[parentSection] = {};
        }
        sectionViewCache_[parentSection].scrollTop = content.scrollTop || 0;
      }
      // Directly render the parent section. navigateTo_ cannot be used
      // here because activeTask_ is already cleared and currentSection_
      // is unchanged, so navigateTo_ would no-op.
      renderSection_(parentSection);
      updateActiveNav_();
      hideMoreMenu_();
    }

    function renderTask_(descriptor) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      var section = el("section", {
        class: "page view-task",
        "data-task-key": descriptor.key,
      });
      // Task header with Back button and breadcrumb.
      var header = el("div", { class: "task-header" });
      header.appendChild(
        el(
          "button",
          {
            class: "btn-back",
            type: "button",
            "data-action": "task-back",
            "aria-label": "返回",
            onclick: closeTask_,
          },
          [el("span", { class: "task-back-label", text: "返回" })]
        )
      );
      var breadcrumb = el(
        "nav",
        {
          class: "breadcrumb",
          "aria-label": "breadcrumb",
        },
        [
          el("span", {
            class: "breadcrumb-parent",
            "data-breadcrumb-parent": "",
            text: descriptor.parentLabel,
          }),
          el("span", { class: "breadcrumb-sep", text: " \u203A " }),
          el("span", {
            class: "breadcrumb-current",
            "data-breadcrumb-current": "",
            text: descriptor.title,
          }),
        ]
      );
      header.appendChild(breadcrumb);
      header.appendChild(
        el("h2", { class: "task-title", text: descriptor.title })
      );
      section.appendChild(header);
      // Task body.
      var body = el("div", { class: "task-body" });
      if (descriptor.kind === "detail") {
        body.appendChild(
          el("p", {
            class: "muted",
            text: "（示範資料，實際課程資料由後續票證提供）",
          })
        );
      } else if (descriptor.kind === "edit") {
        body.appendChild(
          el("p", {
            class: "muted",
            text: "（示範編輯功能，實際聚會編輯由後續票證提供）",
          })
        );
        body.appendChild(
          el("div", { class: "form-group" }, [
            el("label", { class: "label", text: "範例欄位" }),
            el("input", {
              class: "input",
              type: "text",
              id: "demo-edit-field",
              value: "範例資料",
              oninput: handleFieldInput_,
            }),
          ])
        );
        // Error message container for failed submissions (issue #70).
        body.appendChild(
          el("div", {
            id: "demo-submit-msg",
            class: "msg-error hidden",
            role: "alert",
          })
        );
        body.appendChild(
          el(
            "button",
            {
              class: "btn btn-primary",
              type: "button",
              "data-action": "demo-form-submit",
              onclick: handleDemoFormSubmit_,
            },
            "儲存"
          )
        );
      }
      section.appendChild(body);
      content.appendChild(section);
    }

    function handleFieldInput_() {
      if (activeFormGuard_) {
        activeFormGuard_.markDirty();
      }
    }

    function handleDemoFormSubmit_() {
      if (!activeFormGuard_ || !activeFormGuard_.beginSubmit()) return;
      var fieldEl = $("demo-edit-field");
      if (!fieldEl) return;
      // Disable the submit button while pending.
      var submitBtn = document.querySelector(
        '[data-action="demo-form-submit"]'
      );
      if (submitBtn) submitBtn.setAttribute("disabled", "disabled");
      // Clear any previous error.
      var errMsg = $("demo-submit-msg");
      if (errMsg) {
        errMsg.textContent = "";
        errMsg.classList.add("hidden");
      }
      var requestKey = activeFormGuard_.getRequestKey();
      callServer_(
        "task:submit:events-edit-demo",
        function (onSuccess, onFailure) {
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .api_submitDemoTaskForm(
              session_.userId,
              session_.sessionId,
              session_.sessionToken,
              requestKey,
              fieldEl.value
            );
        },
        function (envelope) {
          // Re-enable submit button.
          if (submitBtn) submitBtn.removeAttribute("disabled");
          if (!envelope || typeof envelope !== "object") {
            if (activeFormGuard_) activeFormGuard_.failed();
            if (errMsg) {
              errMsg.textContent = "網絡連線不穩定，請稍後再試。";
              errMsg.classList.remove("hidden");
            }
            return;
          }
          if (envelope.success === true) {
            activeFormGuard_.succeeded();
            activeFormGuard_ = null;
            // Keep existing side effects from the old mock-save.
            eventsDemoCounter_ += 1;
            invalidateSection_(SECTION_KEYS.EVENTS);
            updateBadge_(SECTION_KEYS.EVENTS, eventsDemoCounter_);
            activeTask_ = null;
            renderSection_(SECTION_KEYS.EVENTS);
            return;
          }
          // Server-side failure (validation, auth, etc.)
          activeFormGuard_.failed();
          var serverMsg =
            (envelope.error && envelope.error.message) ||
            "提交失敗，請稍後再試。";
          if (errMsg) {
            errMsg.textContent = serverMsg;
            errMsg.classList.remove("hidden");
          }
          // Field value is NOT touched — user can retry.
        },
        function (err) {
          // Transport failure.
          if (submitBtn) submitBtn.removeAttribute("disabled");
          if (activeFormGuard_) activeFormGuard_.failed();
          if (errMsg) {
            errMsg.textContent = "網絡連線不穩定，請稍後再試。";
            errMsg.classList.remove("hidden");
          }
        }
      );
    }
