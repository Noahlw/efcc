<script>
  (function () {
    "use strict";

    // EFCC 顯恩堂 — session, login, and bootstrap controller.
    // Per ADR-0010 / docs/specs/009-phone-first-shell-navigation.md /
    // issue #64 (parent) + #50 (auth boundary) + #73 (session detail).
    //
    // This module is the live-wiring sibling of shell.js.html. The
    // static-shell contract (issue #65) forbids RPC calls in
    // shell.js.html, so all server interaction lives here. The
    // App Document includes both modules in this order:
    //   1) shell.js        — flips data-app-state to SIGNED_OUT
    //   2) shell-session.js — restores or renders Login, owns
    //                         the state machine, login form, and
    //                         authenticated Profile render.
    //
    // Module responsibilities:
    //   - data-app-state machine (BOOTING -> SIGNED_OUT ->
    //     AUTHENTICATING -> LOADING_SECTION -> READY, plus
    //     RESTORING and RECOVERABLE_ERROR);
    //   - the single canonical localStorage key
    //     ("efccSession") holding {userId, sessionId, sessionToken};
    //   - login form wiring (calls api_loginUser with both success
    //     and failure handlers per spec 009);
    //   - bootstrap-on-load (calls api_restoreApp when a stored
    //     session is present; otherwise stays in SIGNED_OUT with
    //     zero server calls);
    //   - session-expiry recovery (AUTH_REQUIRED from a protected
    //     RPC clears client state and returns to Login in the
    //     same document, never via navigation);
    //   - visible recovery UI on transport / server / timeout
    //     failures with an explicit retry action;
    //   - rendering the minimal Profile fragment into #app-content
    //     after a successful login or restore.
    //
    // Hard rules (enforced by tests/gas/app-shell.contract.test.js):
    //   - NEVER use document.write/open/close;
    //   - NEVER set location.href, location.replace, or
    //     window.top.location;
    //   - NEVER use meta-refresh;
    //   - NEVER include a query-string router;
    //   - every google.script.run MUST register a failure handler.

    var STORAGE_KEY = "efccSession";
    var STATE = {
      BOOTING: "BOOTING",
      SIGNED_OUT: "SIGNED_OUT",
      AUTHENTICATING: "AUTHENTICATING",
      RESTORING: "RESTORING",
      LOADING_SECTION: "LOADING_SECTION",
      READY: "READY",
      RECOVERABLE_ERROR: "RECOVERABLE_ERROR",
    };

    // Monotonic request id so a slow/stale RPC cannot overwrite a
    // newer view (spec 009 client responsibilities).
    var inflightRequestId_ = 0;
    // The current user/session in memory. Cleared on logout / expiry.
    var session_ = null;
    // True between the moment a user clicks "登入" and the moment
    // the server replies. Suppresses duplicate submits.
    var loginPending_ = false;

    // Stable client-side Section key constants. Must match the
    // server-side SECTION_KEYS in Code.gs (bootstrapSectionsForRole_).
    // The server is authoritative — these are just a convenience
    // for the client to compare against without re-typing string
    // literals. Used by renderSection_ switch, navigateTo_ boot
    // call, and buildNavItem_ phone-label map.
    var SECTION_KEYS = Object.freeze({
      PROFILE: "profile",
      PROGRAMS: "programs",
      EVENTS: "events",
      SCANNER: "scanner",
      CARE: "care",
      PERMISSIONS: "permissions",
    });

    // Server-authorized sections from bootstrap (issue #67).
    var sections_ = [];
    // The currently active section key (e.g. "profile").
    var currentSection_ = null;

    // Nested task state (issue #68).
    var activeTask_ = null;
    // Per-Section view-state cache: {scrollTop, filter, selectedId, stale}.
    var sectionViewCache_ = {};
    // Per-Section badge counts (0 = hidden).
    var sectionBadgeCounts_ = {};
    // Events demo counter seeded at 150 for deterministic badge assertion.
    var eventsDemoCounter_ = 150;

    // -----------------------------------------------------------------
    // Tiny DOM helpers
    // -----------------------------------------------------------------
    function $(id) {
      return document.getElementById(id);
    }
    function appRoot() {
      return $("app");
    }
    function setAppState(state) {
      var root = appRoot();
      if (root) root.setAttribute("data-app-state", state);
    }
    function setStatus(text) {
      var el = $("app-status");
      if (el) el.textContent = text || "";
    }
    function clearChildren(el) {
      if (!el) return;
      while (el.firstChild) el.removeChild(el.firstChild);
    }
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(function (k) {
          if (k === "class") node.className = attrs[k];
          else if (k === "text") node.textContent = attrs[k];
          else if (
            k === "type" ||
            k === "id" ||
            k === "name" ||
            k === "autocomplete" ||
            k === "inputmode" ||
            k === "maxlength" ||
            k === "pattern" ||
            k === "role" ||
            k === "aria-live" ||
            k === "for" ||
            k === "required"
          ) {
            node.setAttribute(k, attrs[k]);
          } else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") {
            node.addEventListener(k.slice(2), attrs[k]);
          } else if (
            typeof attrs[k] === "string" ||
            typeof attrs[k] === "number"
          ) {
            node.setAttribute(k, attrs[k]);
          }
        });
      }
      // Normalize children to an array — a single child may be a
      // string (text content) or a single element, and the caller
      // should not have to wrap a one-off in an array literal.
      var kids = children;
      if (kids == null) kids = [];
      else if (!Array.isArray(kids)) kids = [kids];
      for (var i = 0; i < kids.length; i++) {
        var c = kids[i];
        if (c == null) continue;
        if (typeof c === "string") {
          node.appendChild(document.createTextNode(c));
        } else {
          node.appendChild(c);
        }
      }
      return node;
    }

    // -----------------------------------------------------------------
    // localStorage helpers
    // -----------------------------------------------------------------
    function readStoredSession_() {
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return null;
        if (!parsed.userId || !parsed.sessionId || !parsed.sessionToken)
          return null;
        return parsed;
      } catch (e) {
        return null;
      }
    }
    function writeStoredSession_(s) {
      try {
        window.localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            userId: s.userId,
            sessionId: s.sessionId,
            sessionToken: s.sessionToken,
          })
        );
      } catch (e) {
        // localStorage may be disabled (private mode). Continue
        // with the in-memory session; the next reload will land
        // back on Login.
      }
    }
    function clearStoredSession_() {
      try {
        window.localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
    }

    // -----------------------------------------------------------------
    // RPC wrapper — enforces success + failure handlers and request
    // id monotonicity. The caller passes a stable `idTag` (e.g.
    // "login") and a runner. If a newer call with the same tag
    // starts before this one finishes, the older response is
    // dropped (spec 009).
    // -----------------------------------------------------------------
    var inflightTags_ = {};
    function callServer_(idTag, runner, onSuccess, onError) {
      var myId = ++inflightRequestId_;
      inflightTags_[idTag] = myId;
      function maybeApply(tag, fn, value) {
        if (inflightTags_[tag] !== myId) return;
        fn(value);
      }
      function success(value) {
        maybeApply(idTag, onSuccess, value);
      }
      function failure(err) {
        // Per spec 009: unexpected execution exceptions reach the
        // failure handler; render a generic recoverable error.
        var message = err && err.message ? String(err.message) : "";
        maybeApply(idTag, onError, {
          kind: "TRANSPORT",
          code: "INTERNAL_ERROR",
          message: message || "網絡連線不穩定，請稍後再試。",
        });
      }
      try {
        var maybe = runner(success, failure);
        if (maybe && typeof maybe.then === "function") {
          maybe.then(success, failure);
        }
      } catch (e) {
        failure(e);
      }
    }

    // -----------------------------------------------------------------
    // Section rendering — Profile is the Day 1 landing section per
    // ADR-0010 / spec 009 / issue #64. Intentionally self-contained
    // so the AC "bootstrap returns initial Profile data" is met
    // without committing to a full Section-controller registry
    // (later ticket).
    // -----------------------------------------------------------------
    function renderProfile_(bootstrap) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      content.appendChild(
        el("section", { class: "page view-profile" }, [
          el("div", { class: "login-card" }, [
            el("h2", { text: "個人資料" }),
            el("p", {
              class: "muted",
              text: "已登入：" + (bootstrap.session.name || ""),
            }),
            el("dl", { class: "profile-fields" }, [
              el("dt", { text: "使用者名稱" }),
              el("dd", { text: bootstrap.profile.username || "" }),
              el("dt", { text: "角色" }),
              el("dd", { text: bootstrap.profile.role || "" }),
              el("dt", { text: "QR 碼" }),
              el("dd", {}, [
                (function () {
                  var img = document.createElement("img");
                  img.src =
                    "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
                    encodeURIComponent(bootstrap.profile.qrCodeString || "");
                  img.alt = "QR 碼";
                  img.width = 200;
                  img.height = 200;
                  return img;
                })(),
              ]),
            ]),
            el(
              "button",
              {
                id: "profile-logout",
                class: "btn btn-primary btn-full",
                type: "button",
                "data-action": "logout",
                onclick: handleLogoutClick_,
              },
              "登出"
            ),
          ]),
        ])
      );
    }

    // -----------------------------------------------------------------
    // Navigation rendering (issue #67) — phone bottom nav with "More"
    // overflow for >4 sections; desktop side rail with all sections.
    // -----------------------------------------------------------------
    var PHONE_MAX_VISIBLE = 4;

    function renderNavigation_() {
      renderNavPhone_();
      renderNavDesktop_();
      updateActiveNav_();
    }

    function renderNavPhone_() {
      var nav = $("app-nav-phone");
      if (!nav) return;
      clearChildren(nav);
      if (sections_.length === 0) {
        nav.setAttribute("hidden", "");
        return;
      }
      nav.removeAttribute("hidden");

      var visible = sections_;
      var overflow = [];
      if (sections_.length > PHONE_MAX_VISIBLE) {
        visible = sections_.slice(0, PHONE_MAX_VISIBLE);
        overflow = sections_.slice(PHONE_MAX_VISIBLE);
      }

      for (var i = 0; i < visible.length; i++) {
        nav.appendChild(buildNavItem_(visible[i], true));
      }

      if (overflow.length > 0) {
        nav.appendChild(buildMoreButton_(overflow));
      }
    }

    function renderNavDesktop_() {
      var nav = $("app-nav-desktop");
      if (!nav) return;
      clearChildren(nav);
      if (sections_.length === 0) {
        nav.setAttribute("hidden", "");
        return;
      }
      nav.removeAttribute("hidden");

      for (var i = 0; i < sections_.length; i++) {
        nav.appendChild(buildNavItem_(sections_[i], false));
      }
    }

    function buildNavItem_(section, isPhone) {
      var label = section.label;
      // Phone nav uses compact labels for space.
      if (isPhone) {
        if (section.key === SECTION_KEYS.PROFILE) label = "個人";
        else if (section.key === SECTION_KEYS.PROGRAMS) label = "課程";
        else if (section.key === SECTION_KEYS.EVENTS) label = "聚會";
        else if (section.key === SECTION_KEYS.SCANNER) label = "掃描";
        else if (section.key === SECTION_KEYS.CARE) label = "關懷";
        else if (section.key === SECTION_KEYS.PERMISSIONS) label = "權限";
      }
      // Build nav item button with optional badge.
      var children = [el("span", { class: "nav-item-label", text: label })];
      var count = sectionBadgeCounts_[section.key];
      if (count !== undefined && count !== null) {
        var badge = document.createElement("span");
        badge.className = "nav-badge";
        badge.setAttribute("data-badge", section.key);
        if (count > 0) {
          badge.textContent = formatBadgeCount_(count);
        } else {
          badge.setAttribute("hidden", "");
        }
        children.push(badge);
      }
      return el(
        "button",
        {
          class: isPhone
            ? "nav-item nav-item-phone"
            : "nav-item nav-item-desktop",
          type: "button",
          "data-section": section.key,
          "aria-current": "false",
          role: "link",
          onclick: (function (key) {
            return function () {
              navigateTo_(key);
            };
          })(section.key),
        },
        children
      );
    }

    function buildMoreButton_(overflowSections) {
      var btn = el(
        "button",
        {
          class: "nav-item nav-item-phone nav-item-more",
          type: "button",
          "data-section": "more",
          "aria-haspopup": "true",
          role: "link",
          onclick: toggleMoreMenu_,
        },
        [el("span", { class: "nav-item-label", text: "更多" })]
      );
      // Build the overflow menu (hidden by default).
      var menu = el("div", {
        id: "more-menu",
        class: "more-menu hidden",
        role: "menu",
      });
      for (var i = 0; i < overflowSections.length; i++) {
        var s = overflowSections[i];
        var itemChildren = [document.createTextNode(s.label)];
        var count = sectionBadgeCounts_[s.key];
        if (count !== undefined && count !== null) {
          var badge = document.createElement("span");
          badge.className = "nav-badge";
          badge.setAttribute("data-badge", s.key);
          if (count > 0) {
            badge.textContent = formatBadgeCount_(count);
          } else {
            badge.setAttribute("hidden", "");
          }
          itemChildren.push(badge);
        }
        menu.appendChild(
          el(
            "button",
            {
              class: "more-menu-item",
              type: "button",
              role: "menuitem",
              "data-section": s.key,
              onclick: (function (key) {
                return function () {
                  hideMoreMenu_();
                  navigateTo_(key);
                };
              })(s.key),
            },
            itemChildren
          )
        );
      }
      btn.appendChild(menu);
      return btn;
    }

    function toggleMoreMenu_() {
      var menu = $("more-menu");
      if (!menu) return;
      if (menu.classList.contains("hidden")) {
        menu.classList.remove("hidden");
      } else {
        hideMoreMenu_();
      }
    }

    function hideMoreMenu_() {
      var menu = $("more-menu");
      if (menu) menu.classList.add("hidden");
    }

    function updateActiveNav_() {
      // Iterate children of both nav containers rather than using
      // document.querySelectorAll which may not be available in test
      // harness minimal DOM mocks.
      var containers = [$("app-nav-phone"), $("app-nav-desktop")];
      for (var ci = 0; ci < containers.length; ci++) {
        var container = containers[ci];
        if (!container) continue;
        var children = container.children;
        for (var i = 0; i < children.length; i++) {
          var item = children[i];
          if (!item.getAttribute) continue;
          var section = item.getAttribute("data-section");
          if (section === currentSection_) {
            item.setAttribute("aria-current", "page");
            item.classList.add("nav-item-active");
          } else if (section !== "more") {
            item.setAttribute("aria-current", "false");
            item.classList.remove("nav-item-active");
          }
        }
      }
    }
    // -----------------------------------------------------------------
    // Section navigation (issue #67 / #68)
    // -----------------------------------------------------------------
    function navigateTo_(sectionKey) {
      // If a nested task is open, any root nav click closes it first.
      if (activeTask_ !== null) {
        activeTask_ = null;
        if (sectionKey === currentSection_) {
          // Same root as the open task's parent — close task, show root.
          renderSection_(sectionKey);
          return;
        }
        // Different root — close task and fall through to navigate.
      } else if (sectionKey === currentSection_) {
        return; // True no-op: at this root with no task open.
      }
      // Check authorization: server-authorized sections only.
      var authorized = false;
      for (var i = 0; i < sections_.length; i++) {
        if (sections_[i].key === sectionKey) {
          authorized = true;
          break;
        }
      }
      if (!authorized) {
        renderForbidden_(sectionKey);
        return;
      }
      currentSection_ = sectionKey;
      updateActiveNav_();
      hideMoreMenu_();
      renderSection_(sectionKey);
    }

    function buildSectionCard_(sectionKey, title, description) {
      var isProfile = sectionKey === SECTION_KEYS.PROFILE;
      var container = el("section", { class: "page view-" + sectionKey });
      var card = el("div", { class: "login-card" });
      card.appendChild(el("h2", { text: title }));
      // Refresh button for non-profile data-bearing Sections.
      if (!isProfile) {
        card.appendChild(
          el(
            "button",
            {
              class: "btn btn-refresh",
              type: "button",
              "data-action": "refresh-section",
              "data-section": sectionKey,
              "aria-label": "重新整理",
              onclick: (function (k) {
                return function () {
                  refreshSection_(k);
                };
              })(sectionKey),
            },
            "重新整理"
          )
        );
      }
      card.appendChild(el("p", { class: "muted", text: description }));
      // Demo task buttons (issue #68).
      if (sectionKey === SECTION_KEYS.PROGRAMS) {
        card.appendChild(
          el(
            "button",
            {
              class: "btn btn-open-task",
              type: "button",
              "data-action": "open-task",
              "data-task": "programs-detail-demo",
              onclick: function () {
                openTask_({
                  key: "programs-detail-demo",
                  parentSection: SECTION_KEYS.PROGRAMS,
                  parentLabel: "課程",
                  title: "詳情",
                  kind: "detail",
                });
              },
            },
            "查看範例課程詳情"
          )
        );
      }
      if (sectionKey === SECTION_KEYS.EVENTS) {
        card.appendChild(
          el("p", {
            class: "muted",
            text: "範例計數器：" + eventsDemoCounter_,
          })
        );
        card.appendChild(
          el(
            "button",
            {
              class: "btn btn-open-task",
              type: "button",
              "data-action": "open-task",
              "data-task": "events-edit-demo",
              onclick: function () {
                openTask_({
                  key: "events-edit-demo",
                  parentSection: SECTION_KEYS.EVENTS,
                  parentLabel: "聚會",
                  title: "編輯",
                  kind: "edit",
                });
              },
            },
            "編輯範例聚會"
          )
        );
      }
      container.appendChild(card);
      return container;
    }

    function renderSection_(sectionKey) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      // Check view-state cache: restore scroll unless stale.
      var cached = sectionViewCache_[sectionKey];
      if (cached && !cached.stale) {
        // Scroll restoration hint — the content will be re-rendered
        // but preserving scroll is handled by the real DOM.
      }
      switch (sectionKey) {
        case SECTION_KEYS.PROFILE:
          if (session_) {
            renderProfileContent_(session_);
          } else {
            content.appendChild(
              el("section", { class: "page view-placeholder" }, [
                el("div", { class: "login-card text-center" }, [
                  el("h2", { text: "個人資料" }),
                  el("p", { class: "muted", text: "載入中..." }),
                ]),
              ])
            );
          }
          break;
        case SECTION_KEYS.PROGRAMS:
          content.appendChild(
            buildSectionCard_(sectionKey, "課程", "課程列表將於後續版本提供。")
          );
          break;
        case SECTION_KEYS.EVENTS:
          content.appendChild(
            buildSectionCard_(sectionKey, "聚會", "聚會管理將於後續版本提供。")
          );
          break;
        case SECTION_KEYS.SCANNER:
          content.appendChild(
            buildSectionCard_(sectionKey, "掃描", "出席掃描將於後續版本提供。")
          );
          break;
        case SECTION_KEYS.CARE:
          content.appendChild(
            buildSectionCard_(
              sectionKey,
              "關懷",
              "關懷儀表板將於後續版本提供。"
            )
          );
          break;
        case SECTION_KEYS.PERMISSIONS:
          content.appendChild(
            buildSectionCard_(
              sectionKey,
              "權限管理",
              "權限管理將於後續版本提供。"
            )
          );
          break;
        default:
          renderForbidden_(sectionKey);
      }
      // Mark cache as not stale after render.
      if (sectionViewCache_[sectionKey]) {
        sectionViewCache_[sectionKey].stale = false;
      }
      content.scrollTop = cached && !cached.stale ? cached.scrollTop || 0 : 0;
    }

    function renderProfileContent_(sessionData) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      content.appendChild(
        el("section", { class: "page view-profile" }, [
          el("div", { class: "login-card" }, [
            el("h2", { text: "個人資料" }),
            el("p", {
              class: "muted",
              text: "已登入：" + (sessionData.name || ""),
            }),
            el("dl", { class: "profile-fields" }, [
              el("dt", { text: "使用者名稱" }),
              el("dd", { text: sessionData.username || "" }),
              el("dt", { text: "角色" }),
              el("dd", { text: sessionData.role || "" }),
              el("dt", { text: "QR 碼" }),
              el("dd", {}, [
                (function () {
                  var img = document.createElement("img");
                  img.src =
                    "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
                    encodeURIComponent(sessionData.qrCodeString || "");
                  img.alt = "QR 碼";
                  img.width = 200;
                  img.height = 200;
                  return img;
                })(),
              ]),
            ]),
            el(
              "button",
              {
                id: "profile-logout",
                class: "btn btn-primary btn-full",
                type: "button",
                "data-action": "logout",
                onclick: handleLogoutClick_,
              },
              "登出"
            ),
          ]),
        ])
      );
    }

    function buildPlaceholderSection_(title, message) {
      return el("section", { class: "page view-placeholder" }, [
        el("div", { class: "login-card text-center" }, [
          el("h2", { text: title }),
          el("p", { class: "muted", text: message }),
        ]),
      ]);
    }

    function renderForbidden_(sectionKey) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      content.appendChild(
        el("section", { class: "page view-forbidden" }, [
          el("div", { class: "login-card text-center" }, [
            el("h2", { text: "無法存取" }),
            el("p", {
              class: "muted",
              text: "你沒有權限使用此功能（" + sectionKey + "）。",
            }),
            el(
              "button",
              {
                class: "btn btn-primary btn-full",
                type: "button",
                onclick: function () {
                  navigateToNearestPermitted_();
                },
              },
              "返回"
            ),
          ]),
        ])
      );
    }

    function navigateToNearestPermitted_() {
      if (sections_.length > 0) {
        navigateTo_(sections_[0].key);
      } else {
        currentSection_ = null;
        updateActiveNav_();
        renderProfileContent_(session_);
      }
    }

    // -----------------------------------------------------------------
    // Badge formatting and update (issue #68)
    // -----------------------------------------------------------------
    function formatBadgeCount_(count) {
      if (count > 99) return "99+";
      return String(count);
    }

    function updateBadge_(sectionKey, count) {
      sectionBadgeCounts_[sectionKey] = count;
      var containers = [$("app-nav-phone"), $("app-nav-desktop")];
      for (var ci = 0; ci < containers.length; ci++) {
        var container = containers[ci];
        if (!container) continue;
        var children = container.children;
        for (var i = 0; i < children.length; i++) {
          var item = children[i];
          if (!item || !item.getAttribute) continue;
          var key = item.getAttribute("data-section");
          if (key !== sectionKey) continue;
          // Find existing badge child or create one on demand.
          var badge = null;
          for (var bi = 0; bi < item.childNodes.length; bi++) {
            var child = item.childNodes[bi];
            if (
              child.getAttribute &&
              child.getAttribute("data-badge") === sectionKey
            ) {
              badge = child;
              break;
            }
          }
          if (!badge && count > 0) {
            badge = document.createElement("span");
            badge.className = "nav-badge";
            badge.setAttribute("data-badge", sectionKey);
            item.appendChild(badge);
          }
          if (badge) {
            if (count > 0) {
              badge.textContent = formatBadgeCount_(count);
              badge.removeAttribute("hidden");
            } else {
              badge.setAttribute("hidden", "");
            }
          }
        }
      }
    }

    // -----------------------------------------------------------------
    // Section view-state cache (issue #68)
    // -----------------------------------------------------------------
    function invalidateSection_(sectionKey) {
      if (!sectionViewCache_[sectionKey]) {
        sectionViewCache_[sectionKey] = {};
      }
      sectionViewCache_[sectionKey].stale = true;
    }

    function refreshSection_(sectionKey) {
      // For now, refresh is client-only: re-render the section.
      // Future tickets will wire this through api_loadSection.
      if (activeTask_ !== null) {
        // If a task is open, invalidate the parent section so returning
        // forces a fresh render. Do not re-render while the task is visible.
        invalidateSection_(sectionKey);
        return;
      }
      renderSection_(sectionKey);
    }

    // -----------------------------------------------------------------
    // Nested task navigation (issue #68)
    // -----------------------------------------------------------------
    function openTask_(descriptor) {
      if (!descriptor || !descriptor.key) return;
      // Save scroll position of the current section to its cache entry.
      var content = $("app-content");
      if (content) {
        if (!sectionViewCache_[currentSection_]) {
          sectionViewCache_[currentSection_] = {};
        }
        sectionViewCache_[currentSection_].scrollTop = content.scrollTop || 0;
      }
      activeTask_ = descriptor;
      renderTask_(descriptor);
    }

    function closeTask_() {
      if (!activeTask_) return;
      var parentSection = activeTask_.parentSection;
      activeTask_ = null;
      // Save scroll position before returning.
      var content = $("app-content");
      if (content) {
        if (!sectionViewCache_[parentSection]) {
          sectionViewCache_[parentSection] = {};
        }
        sectionViewCache_[parentSection].scrollTop = content.scrollTop || 0;
      }
      // Directly render the parent section. navigateTo_ cannot be used
      // here because activeTask_ is already cleared and currentSection_
      // is unchanged, so navigateTo_ would no-op.
      renderSection_(parentSection);
      updateActiveNav_();
      hideMoreMenu_();
    }

    function renderTask_(descriptor) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      var section = el("section", {
        class: "page view-task",
        "data-task-key": descriptor.key,
      });
      // Task header with Back button and breadcrumb.
      var header = el("div", { class: "task-header" });
      header.appendChild(
        el(
          "button",
          {
            class: "btn-back",
            type: "button",
            "data-action": "task-back",
            "aria-label": "返回",
            onclick: closeTask_,
          },
          [el("span", { class: "task-back-label", text: "返回" })]
        )
      );
      var breadcrumb = el(
        "nav",
        {
          class: "breadcrumb",
          "aria-label": "breadcrumb",
        },
        [
          el("span", {
            class: "breadcrumb-parent",
            "data-breadcrumb-parent": "",
            text: descriptor.parentLabel,
          }),
          el("span", { class: "breadcrumb-sep", text: " \u203A " }),
          el("span", {
            class: "breadcrumb-current",
            "data-breadcrumb-current": "",
            text: descriptor.title,
          }),
        ]
      );
      header.appendChild(breadcrumb);
      header.appendChild(
        el("h2", { class: "task-title", text: descriptor.title })
      );
      section.appendChild(header);
      // Task body.
      var body = el("div", { class: "task-body" });
      if (descriptor.kind === "detail") {
        body.appendChild(
          el("p", {
            class: "muted",
            text: "（示範資料，實際課程資料由後續票證提供）",
          })
        );
      } else if (descriptor.kind === "edit") {
        body.appendChild(
          el("p", {
            class: "muted",
            text: "（示範編輯功能，實際聚會編輯由後續票證提供）",
          })
        );
        body.appendChild(
          el("div", { class: "form-group" }, [
            el("label", { class: "label", text: "範例欄位" }),
            el("input", {
              class: "input",
              type: "text",
              id: "demo-edit-field",
              value: "範例資料",
            }),
          ])
        );
        body.appendChild(
          el(
            "button",
            {
              class: "btn btn-primary",
              type: "button",
              "data-action": "mock-save",
              onclick: handleMockSave_,
            },
            "儲存"
          )
        );
      }
      section.appendChild(body);
      content.appendChild(section);
    }

    function handleMockSave_() {
      // Client-only mock save: no google.script.run call.
      eventsDemoCounter_ += 1;
      // Invalidate the Events section cache so returning forces a fresh render.
      invalidateSection_(SECTION_KEYS.EVENTS);
      // Derive the nav badge from the same refreshed Section data — this
      // is the concrete proof of "badges are derived from refreshed
      // Section data" (issue #68 AC), not a value only reachable via a
      // manual test hook.
      updateBadge_(SECTION_KEYS.EVENTS, eventsDemoCounter_);
      // Re-render Events root and close the task.
      activeTask_ = null;
      renderSection_(SECTION_KEYS.EVENTS);
    }

    /**
     * Refresh navigation after a sheet-side role/leadership change
     * (issue #67 AC #10). Re-calls api_restoreApp to get current
     * capabilities, then re-renders navigation and invalidates any
     * now-forbidden active section.
     */
    function refreshAuthorization_() {
      if (!session_) return;
      setAppState(STATE.RESTORING);
      restoreFromStorage_();
    }

    function renderLoadingSection_() {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      content.appendChild(
        el("section", { class: "page view-loading" }, [
          el("div", { class: "login-card text-center" }, [
            el("p", { class: "muted", text: "載入中..." }),
          ]),
        ])
      );
    }

    function renderLogin_() {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      // Rebuild the Login fragment client-side. The IDs MUST match
      // the markup-only view-login.html fragment so any future
      // contract test on that fragment remains valid.
      content.appendChild(
        el("section", { id: "view-login", class: "page view-login" }, [
          el("div", { class: "login-card" }, [
            el("h2", { class: "text-center", text: "登入" }),
            el("p", { class: "text-center muted", text: "歡迎使用顯恩堂系統" }),
            el(
              "form",
              {
                id: "login-form",
                class: "form",
                autocomplete: "off",
                onsubmit: handleLoginSubmit_,
              },
              [
                el("div", { class: "form-group" }, [
                  el("label", {
                    class: "label",
                    for: "login-username",
                    text: "使用者名稱",
                  }),
                  el("input", {
                    id: "login-username",
                    class: "input",
                    type: "text",
                    name: "username",
                    autocomplete: "username",
                    required: "required",
                  }),
                ]),
                el("div", { class: "form-group" }, [
                  el("label", {
                    class: "label",
                    for: "login-pin",
                    text: "PIN 碼",
                  }),
                  el("input", {
                    id: "login-pin",
                    class: "input",
                    type: "password",
                    name: "pin",
                    inputmode: "numeric",
                    maxlength: "4",
                    pattern: "\\d{4}",
                    autocomplete: "current-password",
                    required: "required",
                  }),
                ]),
                el("button", {
                  id: "login-submit",
                  class: "btn btn-primary btn-full",
                  type: "submit",
                  text: "登入",
                }),
                el("div", {
                  id: "login-msg",
                  class: "msg-error hidden",
                  role: "alert",
                }),
              ]
            ),
          ]),
        ])
      );
      var u = $("login-username");
      if (u && u.focus) u.focus();
    }

    function showLoginError_(message) {
      var msg = $("login-msg");
      if (!msg) return;
      msg.textContent = message || "登入失敗，請再試一次。";
      msg.classList.remove("hidden");
    }
    function clearLoginError_() {
      var msg = $("login-msg");
      if (!msg) return;
      msg.textContent = "";
      msg.classList.add("hidden");
    }

    // -----------------------------------------------------------------
    // Recovery UI for transport/timeout/INTERNAL_ERROR. Renders
    // into the content area without replacing the document.
    // -----------------------------------------------------------------
    function renderRecoverableError_(kind) {
      var content = $("app-content");
      if (!content) return;
      clearChildren(content);
      var heading = "載入失敗";
      var detail = "網絡連線不穩定或伺服器暫時無法回應，請稍後再試。";
      if (kind === "AUTH_REQUIRED") {
        heading = "登入工作階段已失效";
        detail = "請重新登入。";
      } else if (kind === "BOOTSTRAP_FAILED") {
        heading = "無法載入個人資料";
        detail = "請稍後再試。";
      }
      content.appendChild(
        el("section", { class: "page view-error" }, [
          el("div", { class: "login-card text-center" }, [
            el("h2", { text: heading }),
            el("p", { class: "muted", text: detail }),
            el(
              "button",
              {
                id: "error-retry",
                class: "btn btn-primary btn-full",
                type: "button",
                "data-action": "retry",
                onclick: handleRetryClick_,
              },
              "重試"
            ),
          ]),
        ])
      );
    }

    function handleRetryClick_() {
      if (session_) {
        setAppState(STATE.RESTORING);
        renderLoadingSection_();
        restoreFromStorage_();
      } else {
        setAppState(STATE.SIGNED_OUT);
        renderLogin_();
      }
    }

    // -----------------------------------------------------------------
    // Login submit / logout click handlers
    // -----------------------------------------------------------------
    function handleLoginSubmit_(event) {
      if (event && event.preventDefault) event.preventDefault();
      if (loginPending_) return;
      var u = $("login-username");
      var p = $("login-pin");
      if (!u || !p) return;
      var username = u.value;
      var pin = p.value;
      if (!username || !pin) {
        showLoginError_("請輸入使用者名稱和 PIN 碼。");
        return;
      }
      loginPending_ = true;
      var submit = $("login-submit");
      if (submit) submit.setAttribute("disabled", "disabled");
      setStatus("登入中...");
      callServer_(
        "login",
        function (onSuccess, onFailure) {
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .api_loginUser(username, pin);
        },
        function (envelope) {
          loginPending_ = false;
          if (submit) submit.removeAttribute("disabled");
          handleRpcEnvelope_(envelope, "login");
        },
        function (err) {
          loginPending_ = false;
          if (submit) submit.removeAttribute("disabled");
          handleRpcFailure_(err, "login");
        }
      );
    }

    function handleLogoutClick_() {
      if (!session_) {
        clearAuthenticatedClientState_();
        setAppState(STATE.SIGNED_OUT);
        renderLogin_();
        return;
      }
      callServer_(
        "logout",
        function (onSuccess, onFailure) {
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .api_logoutUser(
              session_.userId,
              session_.sessionId,
              session_.sessionToken
            );
        },
        function () {
          clearAuthenticatedClientState_();
          setAppState(STATE.SIGNED_OUT);
          renderLogin_();
        },
        function () {
          clearAuthenticatedClientState_();
          setAppState(STATE.SIGNED_OUT);
          renderLogin_();
        }
      );
    }

    // -----------------------------------------------------------------
    // RPC envelope handling — spec 009 dispatch table.
    // -----------------------------------------------------------------
    function handleRpcEnvelope_(envelope, tag) {
      if (!envelope || typeof envelope !== "object") {
        handleRpcFailure_(
          { kind: "MALFORMED", message: "伺服器回應格式不正確。" },
          tag
        );
        return;
      }
      if (envelope.success === true) {
        if (tag === "login" || tag === "restore") {
          applyBootstrap_(envelope.data);
        }
        // logout is handled inline in handleLogoutClick_
        return;
      }
      // RpcFailure shape per rpc-envelope.gs:
      //   { success: false, requestId, error: { code, message } }.
      var code = (envelope.error && envelope.error.code) || "INTERNAL_ERROR";
      var message =
        (envelope.error && envelope.error.message) || "操作失敗，請稍後再試。";
      if (code === "AUTH_REQUIRED") {
        clearAuthenticatedClientState_();
        setAppState(STATE.SIGNED_OUT);
        renderLogin_();
        setStatus("");
        showLoginError_(message);
        return;
      }
      // FORBIDDEN: the session is valid but this operation is not
      // authorized (e.g. role/leadership changed sheet-side).
      // Refresh capabilities and let the server re-route to the
      // nearest permitted Section (issue #67 AC #10).
      if (code === "FORBIDDEN") {
        setStatus("");
        refreshAuthorization_();
        return;
      }
      if (tag === "login") {
        setAppState(STATE.SIGNED_OUT);
        renderLogin_();
        setStatus("");
        showLoginError_(message);
        return;
      }
      if (tag === "restore") {
        setAppState(STATE.RECOVERABLE_ERROR);
        renderRecoverableError_("BOOTSTRAP_FAILED");
        return;
      }
      setAppState(STATE.RECOVERABLE_ERROR);
      renderRecoverableError_("GENERIC");
    }

    function handleRpcFailure_(err, tag) {
      if (err && err.kind === "TRANSPORT") {
        if (tag === "login") {
          setAppState(STATE.SIGNED_OUT);
          renderLogin_();
          setStatus("");
          showLoginError_(err.message);
          return;
        }
        setAppState(STATE.RECOVERABLE_ERROR);
        renderRecoverableError_("TRANSPORT");
        return;
      }
      setAppState(STATE.RECOVERABLE_ERROR);
      renderRecoverableError_("TRANSPORT");
    }

    function applyBootstrap_(data) {
      if (!data || !data.session || !data.profile) {
        handleRpcFailure_(
          { kind: "MALFORMED", message: "伺服器回應格式不正確。" },
          "bootstrap"
        );
        return;
      }
      session_ = {
        userId: data.session.userId,
        name: data.session.name,
        role: data.session.role,
        username: data.profile.username,
        qrCodeString: data.session.qrCodeString,
        sessionId: data.session.sessionId,
        sessionToken: data.session.sessionToken,
      };
      // Store server-authorized sections for navigation rendering.
      sections_ = Array.isArray(data.sections) ? data.sections : [];
      writeStoredSession_(session_);
      setAppState(STATE.LOADING_SECTION);
      setStatus("載入中...");
      renderLoadingSection_();
      // Render navigation from server-authorized sections (issue #67).
      renderNavigation_();
      // Defer one tick so the LOADING_SECTION paint is observable.
      window.setTimeout(function () {
        setAppState(STATE.READY);
        setStatus("");
        navigateTo_(SECTION_KEYS.PROFILE);
      }, 0);
    }

    function clearAuthenticatedClientState_() {
      session_ = null;
      sections_ = [];
      currentSection_ = null;
      clearStoredSession_();
      // Hide navigation when signed out so bare Login has no nav.
      var pn = $("app-nav-phone");
      var dn = $("app-nav-desktop");
      if (pn) pn.setAttribute("hidden", "");
      if (dn) dn.setAttribute("hidden", "");
    }

    // -----------------------------------------------------------------
    // Bootstrap-on-load: if localStorage has a session, call
    // api_restoreApp once. Otherwise stay in SIGNED_OUT with zero
    // server calls (issue #66 AC #1).
    // -----------------------------------------------------------------
    function restoreFromStorage_() {
      var stored = readStoredSession_();
      if (!stored) {
        setAppState(STATE.SIGNED_OUT);
        renderLogin_();
        return;
      }
      setAppState(STATE.RESTORING);
      renderLoadingSection_();
      setStatus("載入中...");
      callServer_(
        "restore",
        function (onSuccess, onFailure) {
          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(onFailure)
            .api_restoreApp(
              stored.userId,
              stored.sessionId,
              stored.sessionToken
            );
        },
        function (envelope) {
          handleRpcEnvelope_(envelope, "restore");
        },
        function (err) {
          handleRpcFailure_(err, "restore");
        }
      );
    }

    function onReady() {
      // Issue #66 AC #1: with no stored session, stay in
      // SIGNED_OUT and show Login without any server call.
      // restoreFromStorage_ honors that by checking localStorage
      // first.
      restoreFromStorage_();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", onReady);
    } else {
      onReady();
    }

    // -----------------------------------------------------------------
    // Test-observability hooks (issue #68). Expose scoped functions
    // for Playwright E2E and Vitest unit testing without adding any
    // authorization bypass — these call the exact same internal
    // implementations that already enforce section authorization.
    // -----------------------------------------------------------------
    window.__e2eNavigate = navigateTo_;
    window.__test__ = {
      navigateTo_: navigateTo_,
      openTask_: openTask_,
      closeTask_: closeTask_,
      formatBadgeCount_: formatBadgeCount_,
      updateBadge_: updateBadge_,
      invalidateSection_: invalidateSection_,
      refreshSection_: refreshSection_,
      getEventsDemoCounter: function () {
        return eventsDemoCounter_;
      },
    };
  })();
</script>
