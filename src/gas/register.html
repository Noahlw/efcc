<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base target="_top" />
    <title>EFCC 顯恩堂 — 註冊</title>
    <?!= include('styles'); ?>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1 class="page-title">Register</h1>
        <p class="page-subtitle">Create your EFCC member account</p>
      </header>

      <div
        id="error-msg"
        class="msg-error hidden"
        role="alert"
        aria-live="assertive"
      ></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="label" for="name">Full Name</label>
          <input
            class="input"
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            required
            placeholder="Your full name"
          />
        </div>

        <div class="form-group">
          <label class="label" for="username">Username</label>
          <input
            class="input"
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            placeholder="Choose a username"
          />
        </div>

        <div class="form-group">
          <label class="label" for="pin">PIN Code (4 digits)</label>
          <input
            class="input"
            id="pin"
            name="pin"
            type="password"
            inputmode="numeric"
            pattern="[0-9]{4}"
            maxlength="4"
            autocomplete="new-password"
            required
            placeholder="4-digit PIN"
          />
        </div>

        <div class="form-group">
          <label class="label" for="phone">Phone</label>
          <input
            class="input"
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            required
            placeholder="Your phone number"
          />
        </div>

        <div class="form-group">
          <label class="label" for="address">Address (optional)</label>
          <textarea
            class="input"
            id="address"
            name="address"
            rows="2"
            placeholder="Your address"
          ></textarea>
        </div>

        <button
          class="btn btn-primary btn-full"
          id="register-btn"
          type="submit"
        >
          Register
        </button>
      </form>

      <div
        id="success-card"
        class="card text-center mt-lg hidden"
        role="status"
        aria-live="polite"
      >
        <div class="msg-success">Registration submitted</div>
        <p class="mt-md">
          Thanks, <strong id="success-name"></strong>. Your account (<strong
            id="success-username"
          ></strong
          >) is now pending staff approval.
        </p>
        <p>
          You'll be able to log in once a staff member approves your account.
        </p>
        <p class="mt-lg">
          <a href="#" class="btn btn-primary" id="goto-login-link"
            >Go to Login</a
          >
        </p>
      </div>

      <p class="text-center mt-md" id="back-to-login-row">
        <a href="#" id="back-to-login-link" class="btn btn-ghost btn-sm"
          >Back to Login</a
        >
      </p>
    </main>

    <script>
      (function () {
        var form = document.getElementById("register-form");
        var error = document.getElementById("error-msg");
        var button = document.getElementById("register-btn");
        var successCard = document.getElementById("success-card");
        var successName = document.getElementById("success-name");
        var successUsername = document.getElementById("success-username");
        var backRow = document.getElementById("back-to-login-row");
        var gotoLoginLink = document.getElementById("goto-login-link");

        var nameInput = document.getElementById("name");
        var usernameInput = document.getElementById("username");
        var pinInput = document.getElementById("pin");
        var phoneInput = document.getElementById("phone");
        var addressInput = document.getElementById("address");

        function showError(message) {
          error.textContent = message;
          error.classList.remove("hidden");
        }

        function clearError() {
          error.textContent = "";
          error.classList.add("hidden");
        }

        function validate(name, username, pin, phone) {
          if (!name || name.length < 2) return "Please enter your full name.";
          if (!username || !/^[a-zA-Z0-9_.]{3,32}$/.test(username))
            return 'Username must be 3-32 characters (letters, numbers, "_" or ".").';
          if (!/^\d{4}$/.test(pin))
            return "PIN must be exactly 4 numeric digits.";
          if (!phone || !/^[0-9+\-\s()]{7,20}$/.test(phone))
            return "Please enter a valid phone number.";
          return null;
        }

        function goToLoginShell_(event) {
          if (event) event.preventDefault();
          google.script.run
            .withSuccessHandler(function (html) {
              document.open();
              document.write(html);
              document.close();
            })
            .withFailureHandler(function () {
              clearError();
              error.textContent = "Unable to load login.";
              error.classList.remove("hidden");
            })
            .loadLoginShell_();
        }

        gotoLoginLink.addEventListener("click", goToLoginShell_);
        document
          .getElementById("back-to-login-link")
          .addEventListener("click", goToLoginShell_);

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          clearError();

          var name = nameInput.value.trim();
          var username = usernameInput.value.trim();
          var pin = pinInput.value.trim();
          var phone = phoneInput.value.trim();
          var address = addressInput.value.trim();

          var validationError = validate(name, username, pin, phone);
          if (validationError) {
            showError(validationError);
            return;
          }

          button.disabled = true;
          button.textContent = "Registering…";

          google.script.run
            .withSuccessHandler(function (response) {
              button.disabled = false;
              button.textContent = "Register";
              if (!response || !response.success) {
                showError(
                  (response && response.message) || "Registration failed."
                );
                return;
              }
              form.classList.add("hidden");
              backRow.classList.add("hidden");
              successName.textContent = name;
              successUsername.textContent = username;
              successCard.classList.remove("hidden");
            })
            .withFailureHandler(function (err) {
              button.disabled = false;
              button.textContent = "Register";
              showError(
                err && err.message
                  ? err.message
                  : "Registration failed. Please try again."
              );
            })
            .api_registerUser(name, username, pin, phone, address);
        });
      })();
    </script>
  </body>
</html>
