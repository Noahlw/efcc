<div class="scanner-fragment">
  <header class="page-header">
    <h1 class="page-title">Scanner / 掃描簽到</h1>
    <p class="page-subtitle">
      Scan QR codes or search members for event check-in
    </p>
  </header>

  <div id="scanner-status" class="hidden" aria-live="polite"></div>

  <!-- Access denied panel — only shown to MEMBER accounts that landed here
       (chrome should already have hidden this fragment for them; defense in
       depth). -->
  <div id="scanner-access-denied" class="msg-error hidden">
    <strong>Access denied.</strong> Only staff and program leaders can manage
    attendance.
  </div>

  <!-- Scanner body — only shown to granted users (STAFF/ADMIN or any user
       with an active Program_Leaders grant on at least one program). -->
  <section id="scanner-body" class="hidden">
    <!-- Event selector — populated from api_getEventsForLeader so the same
         per-program scoping rule that the server enforces shapes what the
         picker shows. -->
    <div class="form-group">
      <label class="label" for="scanner-event-select">Event</label>
      <select id="scanner-event-select" class="input" disabled>
        <option value="">Loading events&hellip;</option>
      </select>
    </div>

    <!-- Manual search — top of the form so it's the obvious fallback on
         phones where the camera may be unavailable. -->
    <div class="form-group">
      <label class="label" for="scanner-search-input">Manual Search</label>
      <input
        id="scanner-search-input"
        class="input"
        type="text"
        placeholder="Search by name, phone, or user ID..."
        autocomplete="off"
      />
      <div id="scanner-search-results" class="card-list mt-sm hidden"></div>
    </div>

    <!-- QR scanner — uses html5-qrcode@2.3.8 (the same library version the
         pre-rebuild scanner shipped with). Loads lazily; if the script is
         blocked or the camera is unavailable, manual search above stays
         usable. -->
    <div class="form-group mt-lg">
      <label class="label">QR Scanner (camera)</label>
      <div id="scanner-reader" class="hidden"></div>
      <div id="scanner-camera-error" class="msg-error hidden">
        Camera unavailable &mdash; use manual search above.
      </div>
      <button
        id="scanner-camera-toggle"
        class="btn btn-ghost btn-sm mt-sm"
        type="button"
      >
        Start Camera
      </button>
    </div>

    <!-- Attendance roster -->
    <div class="mt-lg">
      <div class="flex-between mb-sm">
        <h2 style="font-size: var(--text-lg); font-weight: 600; margin: 0">
          Attendance
        </h2>
        <button
          id="scanner-refresh-btn"
          class="btn btn-ghost btn-sm"
          type="button"
        >
          Refresh
        </button>
      </div>
      <div id="scanner-attendance-list">
        <div class="card text-center" style="color: var(--color-text-muted)">
          <p>Select an event to see its attendance roster.</p>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
  /* global google, Html5Qrcode */
  /**
   * initScanner() — fragment bootstrapper (called by main.html's loadMenuPage
   * after the fragment HTML is injected).
   *
   * Defense-in-depth (ADR-0008 §RBAC): the server re-authorizes every
   * api_checkInMember / api_getEventAttendance call per-program. The checks
   * below are a UX/sanity gate, not a security boundary.
   */
  function initScanner() {
    "use strict";

    var raw;
    try {
      raw = JSON.parse(localStorage.getItem("efccSession") || "null");
    } catch (_) {
      raw = null;
    }
    if (!raw || !raw.userId || !raw.token) return;

    var userId = raw.userId;
    var token = raw.token;

    var bodyEl = document.getElementById("scanner-body");
    var deniedEl = document.getElementById("scanner-access-denied");
    var statusEl = document.getElementById("scanner-status");
    var eventSelectEl = document.getElementById("scanner-event-select");
    var searchInputEl = document.getElementById("scanner-search-input");
    var searchResultsEl = document.getElementById("scanner-search-results");
    var readerEl = document.getElementById("scanner-reader");
    var cameraErrorEl = document.getElementById("scanner-camera-error");
    var cameraToggleEl = document.getElementById("scanner-camera-toggle");
    var attendanceListEl = document.getElementById("scanner-attendance-list");
    var refreshBtn = document.getElementById("scanner-refresh-btn");

    var selectedEventId = "";
    var qrScanner = null;
    var cameraRunning = false;
    var lastScannedText = "";
    var statusTimer = null;

    // --------------------------------------------------------------
    // Helpers
    // --------------------------------------------------------------

    function showStatus(msg, isError) {
      if (!statusEl) return;
      statusEl.textContent = msg;
      statusEl.className = isError ? "msg-error mt-md" : "msg-success mt-md";
      statusEl.classList.remove("hidden");
      if (statusTimer) clearTimeout(statusTimer);
      statusTimer = setTimeout(function () {
        statusEl.classList.add("hidden");
      }, 4000);
    }

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.appendChild(document.createTextNode(String(str == null ? "" : str)));
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // --------------------------------------------------------------
    // Event picker — list only the events the caller is authorized to
    // manage (api_getEventsForLeader already applies per-program scoping).
    // --------------------------------------------------------------

    function loadEvents() {
      google.script.run
        .withSuccessHandler(function (response) {
          if (
            !response ||
            !response.success ||
            !Array.isArray(response.data) ||
            response.data.length === 0
          ) {
            eventSelectEl.innerHTML =
              '<option value="">-- No events available --</option>';
            eventSelectEl.disabled = true;
            return;
          }
          eventSelectEl.innerHTML = "";
          for (var i = 0; i < response.data.length; i++) {
            var ev = response.data[i];
            var opt = document.createElement("option");
            opt.value = ev.eventId || "";
            opt.textContent =
              (ev.eventName || ev.eventId || "") +
              (ev.eventDate ? " (" + ev.eventDate + ")" : "");
            eventSelectEl.appendChild(opt);
          }
          eventSelectEl.disabled = false;
          if (eventSelectEl.options.length > 0) {
            selectedEventId = eventSelectEl.value;
            loadAttendance();
          }
        })
        .withFailureHandler(function () {
          eventSelectEl.innerHTML =
            '<option value="">-- Failed to load events --</option>';
          eventSelectEl.disabled = true;
        })
        .api_getEventsForLeader(userId, token);
    }

    eventSelectEl.addEventListener("change", function () {
      selectedEventId = eventSelectEl.value;
      loadAttendance();
    });

    // --------------------------------------------------------------
    // Manual search — delegates to api_searchMembers (members.gs).
    // --------------------------------------------------------------

    var searchDebounceTimer = null;
    searchInputEl.addEventListener("input", function () {
      var query = searchInputEl.value.trim();
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      if (!query) {
        searchResultsEl.innerHTML = "";
        searchResultsEl.classList.add("hidden");
        return;
      }
      searchDebounceTimer = setTimeout(function () {
        runSearch(query);
      }, 200);
    });

    function runSearch(query) {
      google.script.run
        .withSuccessHandler(function (response) {
          if (
            !response ||
            !response.success ||
            !Array.isArray(response.data) ||
            response.data.length === 0
          ) {
            searchResultsEl.innerHTML =
              '<div class="card text-center" style="color: var(--color-text-muted)"><p>No members found.</p></div>';
            searchResultsEl.classList.remove("hidden");
            return;
          }
          searchResultsEl.innerHTML = "";
          for (var i = 0; i < response.data.length; i++) {
            var m = response.data[i];
            var item = document.createElement("div");
            item.className = "card flex-between";
            item.innerHTML =
              "<div>" +
              "<strong>" +
              escapeHtml(m.name) +
              "</strong>" +
              (m.phone
                ? '<br><span style="font-size: var(--text-xs); color: var(--color-text-muted)">' +
                  escapeHtml(m.phone) +
                  "</span>"
                : "") +
              "</div>" +
              '<button class="btn btn-primary btn-sm scanner-check-in-btn" data-member-id="' +
              escapeAttr(m.userId) +
              '" data-member-name="' +
              escapeAttr(m.name) +
              '" type="button">Check In</button>';
            searchResultsEl.appendChild(item);
          }
          var btns = searchResultsEl.querySelectorAll(".scanner-check-in-btn");
          for (var b = 0; b < btns.length; b++) {
            btns[b].addEventListener("click", function (e) {
              var btn = e.currentTarget;
              var memberId = btn.getAttribute("data-member-id");
              btn.disabled = true;
              btn.textContent = "...";
              performCheckIn(memberId, "MANUAL_SEARCH").finally(function () {
                btn.disabled = false;
                btn.textContent = "Check In";
              });
            });
          }
          searchResultsEl.classList.remove("hidden");
        })
        .withFailureHandler(function () {
          searchResultsEl.innerHTML =
            '<div class="card text-center" style="color: var(--color-text-muted)"><p>Search error.</p></div>';
          searchResultsEl.classList.remove("hidden");
        })
        .api_searchMembers(query, userId, token);
    }

    // --------------------------------------------------------------
    // QR scanner — html5-qrcode@2.3.8 (same library the pre-rebuild
    // scanner shipped with, pinned for stability).
    // --------------------------------------------------------------

    cameraToggleEl.addEventListener("click", function () {
      if (cameraRunning) {
        stopCamera();
      } else {
        startCamera();
      }
    });

    function startCamera() {
      if (typeof Html5Qrcode === "undefined") {
        cameraErrorEl.classList.remove("hidden");
        readerEl.classList.add("hidden");
        cameraToggleEl.disabled = true;
        cameraToggleEl.textContent = "Camera Unavailable";
        return;
      }
      if (!selectedEventId) {
        showStatus("Select an event before starting the camera.", true);
        return;
      }
      if (qrScanner) {
        try {
          qrScanner.clear();
        } catch (_) {}
      }
      qrScanner = new Html5Qrcode("scanner-reader");
      readerEl.classList.remove("hidden");

      Html5Qrcode.getCameras()
        .then(function (cameras) {
          if (!cameras || cameras.length === 0) {
            throw new Error("No cameras");
          }
          // Prefer the back camera; fall back to the first available.
          var cameraId = cameras[0].id;
          for (var c = 0; c < cameras.length; c++) {
            if (
              cameras[c].label &&
              cameras[c].label.toLowerCase().indexOf("back") !== -1
            ) {
              cameraId = cameras[c].id;
              break;
            }
          }
          return qrScanner.start(
            cameraId,
            { fps: 10, qrbox: { width: 200, height: 200 } },
            onScanSuccess,
            function () {
              /* per-frame decode error — ignore */
            }
          );
        })
        .then(function () {
          cameraRunning = true;
          cameraToggleEl.textContent = "Stop Camera";
        })
        .catch(function () {
          cameraErrorEl.classList.remove("hidden");
          readerEl.classList.add("hidden");
          cameraToggleEl.textContent = "Camera Unavailable";
        });
    }

    function stopCamera() {
      if (!qrScanner) {
        cameraRunning = false;
        cameraToggleEl.textContent = "Start Camera";
        return;
      }
      qrScanner
        .stop()
        .then(function () {
          return qrScanner.clear();
        })
        .catch(function () {
          /* ignore — already stopped */
        })
        .finally(function () {
          cameraRunning = false;
          cameraToggleEl.textContent = "Start Camera";
        });
    }

    function onScanSuccess(decodedText) {
      // Suppress double-fire when the same QR is held in view.
      if (decodedText === lastScannedText) return;
      lastScannedText = decodedText;
      setTimeout(function () {
        lastScannedText = "";
      }, 2000);
      if (!selectedEventId) {
        showStatus("Select an event first.", true);
        return;
      }
      performCheckIn(decodedText, "QR_SCAN");
    }

    // --------------------------------------------------------------
    // Check-in — privileged mutation. Server-side authorization +
    // duplicate guard is enforced by api_checkInMember itself; the
    // client just renders the result.
    // --------------------------------------------------------------

    function performCheckIn(memberId, method) {
      if (!selectedEventId) {
        showStatus("Select an event first.", true);
        return Promise.resolve({
          success: false,
          message: "No event selected.",
        });
      }
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(function (response) {
            if (!response) {
              showStatus("Empty response from server.", true);
              resolve(response);
              return;
            }
            if (response.success) {
              showStatus(
                (response.data && response.data.memberName
                  ? response.data.memberName + " checked in at "
                  : "Checked in at ") +
                  (response.data && response.data.checkInTime
                    ? response.data.checkInTime
                    : ""),
                false
              );
              loadAttendance();
            } else if (response.duplicate) {
              // Server-side DENIED audit was logged. We surface it as a
              // warning rather than an error — the request was authorized,
              // the state was simply unchanged.
              showStatus(response.message || "Already checked in.", true);
            } else if (response.notEnrolled) {
              showStatus(
                response.message || "Not enrolled in this program.",
                true
              );
            } else {
              showStatus(response.message || "Check-in failed.", true);
            }
            resolve(response);
          })
          .withFailureHandler(function (err) {
            showStatus(
              (err && err.message) || "Check-in failed (network error).",
              true
            );
            resolve({
              success: false,
              message: (err && err.message) || "Network error",
            });
          })
          .api_checkInMember({
            staffId: userId,
            sessionToken: token,
            eventId: selectedEventId,
            userId: memberId,
            method: method,
          });
      });
    }

    // --------------------------------------------------------------
    // Attendance roster
    // --------------------------------------------------------------

    function loadAttendance() {
      if (!selectedEventId) {
        attendanceListEl.innerHTML =
          '<div class="card text-center" style="color: var(--color-text-muted)"><p>Select an event to see its attendance roster.</p></div>';
        return;
      }
      attendanceListEl.innerHTML =
        '<div class="card text-center" style="color: var(--color-text-muted)"><div class="spinner"></div><p class="mt-sm">Loading attendance&hellip;</p></div>';
      google.script.run
        .withSuccessHandler(function (response) {
          if (!response || !response.success) {
            attendanceListEl.innerHTML =
              '<div class="card text-center" style="color: var(--color-text-muted)"><p>' +
              escapeHtml(
                (response && response.message) || "Failed to load attendance."
              ) +
              "</p></div>";
            return;
          }
          renderAttendance(response.data || []);
        })
        .withFailureHandler(function () {
          attendanceListEl.innerHTML =
            '<div class="card text-center" style="color: var(--color-text-muted)"><p>Network error loading attendance.</p></div>';
        })
        .api_getEventAttendance(selectedEventId, userId, token);
    }

    function renderAttendance(records) {
      if (!records || records.length === 0) {
        attendanceListEl.innerHTML =
          '<div class="card text-center" style="color: var(--color-text-muted)"><p>No check-ins yet.</p></div>';
        return;
      }
      var html = '<table class="att-table"><thead><tr>';
      html += "<th>Name</th><th>Check-in Time</th><th>Method</th>";
      html += "</tr></thead><tbody>";
      for (var i = 0; i < records.length; i++) {
        var r = records[i];
        html += "<tr>";
        html += "<td>" + escapeHtml(r.userName || r.userId || "") + "</td>";
        html += "<td>" + escapeHtml(r.checkInTime || "") + "</td>";
        html +=
          '<td><span class="badge badge-regular">' +
          escapeHtml(r.checkInMethod || "") +
          "</span></td>";
        html += "</tr>";
      }
      html += "</tbody></table>";
      attendanceListEl.innerHTML = html;
    }

    refreshBtn.addEventListener("click", loadAttendance);

    // --------------------------------------------------------------
    // Bootstrap — confirm the user is granted (server-side filter is
    // authoritative; this is defense-in-depth), then reveal the body.
    // --------------------------------------------------------------

    function bootstrap() {
      // Probe with api_getLeaderProgramOptions: STAFF/ADMIN get all
      // programs back; MEMBER-role users get an empty array. If empty,
      // hide the body and show the access-denied message.
      google.script.run
        .withSuccessHandler(function (response) {
          if (
            !response ||
            !response.success ||
            !Array.isArray(response.data) ||
            response.data.length === 0
          ) {
            deniedEl.classList.remove("hidden");
            bodyEl.classList.add("hidden");
            return;
          }
          bodyEl.classList.remove("hidden");
          deniedEl.classList.add("hidden");
          loadEvents();
        })
        .withFailureHandler(function () {
          deniedEl.classList.remove("hidden");
          bodyEl.classList.add("hidden");
        })
        .api_getLeaderProgramOptions(userId, token);
    }

    bootstrap();
  }

  window.initScanner = initScanner;
</script>
