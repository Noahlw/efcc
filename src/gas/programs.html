<div class="programs-fragment">
  <header class="page-header">
    <h1 class="page-title">Programs 課程</h1>
    <p class="page-subtitle">
      Browse the program catalog and manage your enrollments.
    </p>
  </header>

  <div id="programs-status" class="msg-error hidden" aria-live="polite"></div>

  <div id="programs-spinner" class="text-center mt-lg" style="display: none">
    <span class="spinner"></span>
  </div>

  <ul class="card-list mt-md" id="programs-list"></ul>

  <div id="programs-empty" class="card text-center mt-md hidden">
    <p>No programs in the catalog yet.</p>
  </div>

  <div id="programs-no-mine" class="card text-center mt-md hidden">
    <p>You are not currently enrolled in any programs.</p>
  </div>
</div>

<script>
  function initPrograms() {
    var raw;
    try {
      raw = JSON.parse(localStorage.getItem("efccSession") || "null");
    } catch (_) {
      raw = null;
    }
    if (!raw || !raw.userId || !raw.token) {
      return;
    }

    var statusEl = document.getElementById("programs-status");
    var listEl = document.getElementById("programs-list");
    var spinnerEl = document.getElementById("programs-spinner");
    var emptyEl = document.getElementById("programs-empty");
    var noMineEl = document.getElementById("programs-no-mine");

    function showStatus(msg, isError) {
      if (!statusEl) return;
      statusEl.textContent = msg;
      statusEl.className = isError ? "msg-error" : "msg-success";
      statusEl.classList.remove("hidden");
    }
    function clearStatus() {
      if (!statusEl) return;
      statusEl.textContent = "";
      statusEl.classList.add("hidden");
    }
    function escapeHtml(str) {
      var div = document.createElement("div");
      div.appendChild(document.createTextNode(String(str == null ? "" : str)));
      return div.innerHTML;
    }

    function loadPrograms() {
      if (spinnerEl) spinnerEl.style.display = "block";
      if (emptyEl) emptyEl.classList.add("hidden");
      if (noMineEl) noMineEl.classList.add("hidden");
      if (listEl) listEl.innerHTML = "";
      clearStatus();

      google.script.run
        .withSuccessHandler(function (response) {
          if (spinnerEl) spinnerEl.style.display = "none";
          if (!response || !response.success || !Array.isArray(response.data)) {
            if (listEl) listEl.innerHTML = "";
            if (emptyEl) emptyEl.classList.remove("hidden");
            return;
          }
          renderPrograms(response.data);
        })
        .withFailureHandler(function (err) {
          if (spinnerEl) spinnerEl.style.display = "none";
          if (listEl) listEl.innerHTML = "";
          if (emptyEl) emptyEl.classList.remove("hidden");
          showStatus((err && err.message) || "Failed to load programs.", true);
        })
        .api_getAvailablePrograms(raw.userId, raw.token);
    }

    function renderPrograms(programs) {
      if (!listEl) return;
      if (!programs || programs.length === 0) {
        if (emptyEl) emptyEl.classList.remove("hidden");
        return;
      }
      listEl.innerHTML = programs.map(renderCard).join("");
      attachListeners();
    }

    function renderCard(p) {
      var typeBadge = p.type
        ? '<span class="badge badge-regular">' + escapeHtml(p.type) + "</span>"
        : "";
      var desc = p.description
        ? '<p class="text-sm" style="margin-top:var(--space-xs);color:var(--color-text-muted);">' +
          escapeHtml(p.description) +
          "</p>"
        : "";
      var isEnrolled = !!p.isEnrolled;
      var btnLabel = isEnrolled ? "Cancel Enrollment" : "Enroll";
      var btnClass = isEnrolled ? "btn-danger" : "btn-primary";
      var action = isEnrolled ? "cancel" : "enroll";
      var statusBadge = isEnrolled
        ? '<span class="badge badge-active">Enrolled</span>'
        : "";

      return (
        '<li class="card">' +
        '<div class="flex-between" style="margin-bottom:var(--space-xs);">' +
        "<strong>" +
        escapeHtml(p.title) +
        "</strong>" +
        typeBadge +
        "</div>" +
        desc +
        '<div class="flex-between" style="margin-top:var(--space-sm);">' +
        statusBadge +
        '<button class="btn btn-sm ' +
        btnClass +
        '" data-action="' +
        action +
        '" data-program-id="' +
        escapeHtml(p.programId) +
        '">' +
        btnLabel +
        "</button>" +
        "</div>" +
        "</li>"
      );
    }

    function attachListeners() {
      if (!listEl) return;
      var buttons = listEl.querySelectorAll("button[data-action]");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener("click", onAction);
      }
    }

    function onAction(evt) {
      var btn = evt.currentTarget;
      var action = btn.getAttribute("data-action");
      var programId = btn.getAttribute("data-program-id");
      if (!action || !programId) return;
      if (action === "enroll") doEnroll(programId, btn);
      else doCancel(programId, btn);
    }

    function doEnroll(programId, btn) {
      btn.disabled = true;
      var originalLabel = btn.textContent;
      btn.textContent = "Enrolling…";
      clearStatus();
      google.script.run
        .withSuccessHandler(function (response) {
          if (response && response.success) {
            loadPrograms();
            return;
          }
          btn.disabled = false;
          btn.textContent = originalLabel;
          showStatus(
            (response && response.message) || "Enrollment failed.",
            true
          );
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = originalLabel;
          showStatus((err && err.message) || "Network error.", true);
        })
        .api_enrollUser(raw.userId, programId, raw.token);
    }

    function doCancel(programId, btn) {
      btn.disabled = true;
      var originalLabel = btn.textContent;
      btn.textContent = "Cancelling…";
      clearStatus();
      google.script.run
        .withSuccessHandler(function (response) {
          if (response && response.success) {
            loadPrograms();
            return;
          }
          btn.disabled = false;
          btn.textContent = originalLabel;
          showStatus(
            (response && response.message) || "Cancellation failed.",
            true
          );
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = originalLabel;
          showStatus((err && err.message) || "Network error.", true);
        })
        .api_cancelEnrollment(raw.userId, programId, raw.token);
    }

    loadPrograms();
  }
</script>
