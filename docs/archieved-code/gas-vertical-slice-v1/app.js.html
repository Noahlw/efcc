<script>
  // =============================================================================
  // app.js.html — Shared Client-Side Utilities
  // Session management, API wrapper, navigation, role helpers.
  // Every page includes this via <?!= include('app.js') ?>.
  // =============================================================================

  (function () {
    "use strict";

    // --- Session Manager -------------------------------------------------------

    var STORAGE_KEY = "efcc_session";

    window.sessionManager = {
      getToken: function () {
        try {
          var data = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "null");
          return data ? data.token : null;
        } catch (_) {
          return null;
        }
      },

      get: function () {
        try {
          var data = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "null");
          return data || null;
        } catch (_) {
          return null;
        }
      },

      set: function (token, user) {
        var data = { token: token, user: user };
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      },

      getUser: function () {
        var data = this.get();
        return data ? data.user : null;
      },

      isLoggedIn: function () {
        return !!this.getToken();
      },

      clear: function () {
        sessionStorage.removeItem(STORAGE_KEY);
      },
    };

    // --- API Wrapper -----------------------------------------------------------

    window.api = {
      /**
       * Call a server-side Apps Script function.
       * Returns a Promise resolving to the server's response object.
       * Usage: api.call('api_loginUser', username, pin).then(r => { ... })
       */
      call: function (fnName) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          if (
            typeof google === "undefined" ||
            !google.script ||
            !google.script.run
          ) {
            reject(
              new Error(
                "Apps Script runtime not available. Deploy as a web app."
              )
            );
            return;
          }
          var runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(function (err) {
              reject(new Error(err.message || "Server call failed"));
            });
          runner[fnName].apply(runner, args);
        });
      },
    };

    // --- Navigation ------------------------------------------------------------

    function clickAnchor(page) {
      var a = document.createElement("a");
      a.href = "?page=" + encodeURIComponent(page);
      if (!document.querySelector('base[target="_top"]')) {
        a.target = "_top";
      }
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Fallback for non-user-activation contexts (setTimeout, Promise.then,
    // google.script.run callbacks). The synthetic anchor click is blocked
    // in these contexts, so use a meta-refresh which the GAS IFRAME
    // sandbox allows. This writes a tiny visible message first so the
    // user sees what happened, then refreshes to the target page.
    function redirectViaMetaRefresh(page) {
      var msg =
        '<main class="page"><div class="page-header">' +
        '<h1 class="page-title">Redirecting...</h1></div>' +
        '<p class="text-center">Taking you to ' + page + '.</p></main>';
      document.body.innerHTML = msg;
      var meta = document.createElement("meta");
      meta.httpEquiv = "refresh";
      meta.content = "0; url=?page=" + encodeURIComponent(page);
      document.head.appendChild(meta);
    }

    // Try synthetic-anchor first. If we're in a context where it would
    // be blocked (async callback), fall back to meta-refresh after a
    // short delay. If the anchor navigation succeeds, the page reloads
    // before the meta-refresh fires; if the anchor is blocked, the
    // meta-refresh kicks in. This covers both user-activation and
    // non-user-activation contexts without changing call sites.
    window.navigate = function (page) {
      clickAnchor(page);
      setTimeout(function () { redirectViaMetaRefresh(page); }, 300);
    };


    window.getCurrentPage = function () {
      var params = new URLSearchParams(window.location.search);
      return params.get("page") || "login";
    };

    // --- Role Helpers ----------------------------------------------------------

    window.isGrantedUser = function () {
      var user = sessionManager.getUser();
      if (!user) return false;
      var role = (user.role || "").toUpperCase();
      return role === "ADMIN" || role === "STAFF" || role === "EVENT_LEADER";
    };

    window.isStaff = function () {
      var user = sessionManager.getUser();
      if (!user) return false;
      var role = (user.role || "").toUpperCase();
      return role === "ADMIN" || role === "STAFF";
    };

    window.getRoleBadgeClass = function (role) {
      var r = (role || "").toUpperCase();
      switch (r) {
        case "ADMIN":
          return "badge badge-admin";
        case "STAFF":
          return "badge badge-staff";
        case "EVENT_LEADER":
          return "badge badge-event-leader";
        default:
          return "badge badge-member";
      }
    };

    // --- Session Restoration ---------------------------------------------------

    /**
     * Attempt to restore session on page load.
     * If valid, returns the user object. If not, redirects to login.
     * Call in every page's DOMContentLoaded handler.
     */
    window.restoreSession = function () {
      var sess = sessionManager.get();
      if (!sess || !sess.token || !sess.user) {
        navigate("login");
        return Promise.reject(new Error("No session"));
      }
      return api
        .call("api_getCurrentSession", sess.user.userId, sess.token)
        .then(function (response) {
          if (!response.success || !response.data) {
            sessionManager.clear();
            navigate("login");
            throw new Error(response.message || "Session expired");
          }
          // Refresh cached user data
          sessionManager.set(response.data.sessionToken, {
            userId: response.data.userId,
            name: response.data.name,
            role: response.data.role,
            qrCodeString: response.data.qrCodeString,
          });
          return sessionManager.getUser();
        })
        .catch(function (err) {
          // API call failed (network, runtime not ready, etc.) — redirect to login
          sessionManager.clear();
          navigate("login");
          throw err;
        });
    };

    // --- Logout ----------------------------------------------------------------

    window.logout = function () {
      var sess = sessionManager.get();
      if (sess && sess.token) {
        api
          .call("api_logoutUser", sess.user.userId, sess.token)
          .catch(function () {});
      }
      sessionManager.clear();
      navigate("login");
    };

    // --- Inactivity badge color ------------------------------------------------

    window.getInactivityBadge = function (days) {
      if (days === null || days === undefined)
        return "badge badge-inactive-gray";
      if (days <= 30) return "badge badge-inactive-green";
      if (days <= 60) return "badge badge-inactive-amber";
      return "badge badge-inactive-red";
    };

    window.getInactivityLabel = function (days) {
      if (days === null || days === undefined) return "Never";
      if (days <= 30) return days + "d";
      if (days <= 60) return days + "d";
      return days + "d";
    };

    // --- Page Init -------------------------------------------------------------

    document.addEventListener("DOMContentLoaded", function () {
      var currentPage = getCurrentPage();

      // On login page, check if already logged in and auto-redirect
      if (currentPage === "login" && sessionManager.isLoggedIn()) {
        restoreSession()
          .then(function () {
            navigate("profile");
          })
          .catch(function () {
            // Session invalid — stay on login page
          });
        return;
      }

      // On all other pages, require valid session
      if (currentPage !== "login" && currentPage !== "register") {
        if (!sessionManager.isLoggedIn()) {
          navigate("login");
          return;
        }
      }
    });
  })();
</script>
