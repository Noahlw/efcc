<!doctype html>
<html>
  <head>
    <base target="_top" />
    <title>EFCC 顯恩堂</title>
    <?!= include('styles'); ?>
    <style>
      /* SPA shell layout — sidebar (desktop ≥768px) + bottom tab bar (mobile <768px) */
      html,
      body {
        height: 100%;
        margin: 0;
      }

      .efcc-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Topbar — visible at all widths */
      #topbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #212529;
        color: #fff;
      }
      #topbar .efcc-topbar-title {
        font-weight: 600;
        flex-grow: 1;
      }
      #topbar button {
        background: transparent;
        color: inherit;
        border: 1px solid rgba(255, 255, 255, 0.5);
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
      }

      /* Main row — sidebar + content side by side on desktop */
      .efcc-shell-body {
        display: flex;
        flex-grow: 1;
        min-height: 0;
      }

      /* Sidebar — hidden on mobile, visible on desktop ≥768px.
       #menu and #bottom-tabs ul are populated at runtime by the
       DOMContentLoaded bootstrap below, from api_getAccessiblePages(). */
      #sidebar {
        display: none;
        width: 240px;
        flex-shrink: 0;
        background: #343a40;
        color: #fff;
        overflow-y: auto;
      }
      #sidebar-header {
        padding: 12px 16px;
        background: #212529;
        font-weight: 600;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      #menu {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #menu li a {
        display: block;
        color: #fff;
        padding: 10px 16px;
        text-decoration: none;
      }
      #menu li a:hover,
      #menu li a.active {
        background: #495057;
      }

      /* Content area — fills remaining space */
      #content {
        flex-grow: 1;
        overflow-y: auto;
        padding: 16px;
        background: #f8f9fa;
      }
      #main-content {
        min-height: 100%;
      }

      /* Bottom tab bar — hidden on desktop, visible on mobile <768px */
      #bottom-tabs {
        display: none;
        flex-shrink: 0;
        border-top: 1px solid #dee2e6;
        background: #fff;
        overflow-x: auto;
      }
      #bottom-tabs ul {
        display: flex;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #bottom-tabs li {
        flex-grow: 1;
        text-align: center;
      }
      #bottom-tabs li a {
        display: block;
        padding: 10px 6px;
        color: #495057;
        text-decoration: none;
        font-size: 0.85rem;
      }
      #bottom-tabs li a.active {
        color: #0d6efd;
        font-weight: 600;
      }

      /* Loading state for fragment swaps */
      .efcc-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 200px;
        color: #6c757d;
        font-style: italic;
      }

      /* Responsive breakpoints — mutually exclusive (≥768 vs <768) */
      @media (min-width: 768px) {
        .efcc-shell-body {
          flex-direction: row;
        }
        #sidebar {
          display: block;
        }
        #bottom-tabs {
          display: none;
        }
      }

      @media (max-width: 767px) {
        .efcc-shell-body {
          flex-direction: column;
        }
        #sidebar {
          display: none;
        }
        #bottom-tabs {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="efcc-shell">
      <nav id="topbar">
        <button type="button" onclick="toggleSidebar()" aria-label="切換側欄">
          ☰
        </button>
        <span class="efcc-topbar-title">EFCC 顯恩堂</span>
        <button type="button" onclick="logout()">登出</button>
      </nav>

      <div class="efcc-shell-body">
        <aside id="sidebar" aria-label="主導航">
          <div id="sidebar-header">EFCC</div>
          <ul id="menu">
            <!-- populated at runtime by DOMContentLoaded bootstrap -->
          </ul>
        </aside>

        <main id="content">
          <div id="main-content">
            <!-- populated by loadMenuPage('profile', ...) from the DOMContentLoaded bootstrap -->
          </div>
        </main>
      </div>

      <nav id="bottom-tabs" aria-label="行動導航">
        <ul>
          <!-- populated at runtime by DOMContentLoaded bootstrap -->
        </ul>
      </nav>
    </div>

    <script>
      /**
       * SPA shell — loadMenuPage(pageName, el)
       * Sequence: loading state → fetch → innerHTML inject → <script> re-execution → initXxx() call.
       *
       * T01 population contract (TODO/stub — wired by T01, NOT this ticket):
       *   - After login succeeds, T01 fetches the accessible-pages list from
       *     the server (RBAC-filtered per ADR-0006).
       *   - T01 fills #menu (desktop sidebar) with one <li><a> per page, each
       *     anchor carrying onclick="loadMenuPage('<pageName>', this)".
       *   - T01 fills #bottom-tabs > ul (mobile tab bar) with the same set.
       *   - T01 then calls loadMenuPage('profile', ...) to render the
       *     initial fragment into #main-content.
       */
      function loadMenuPage(pageName, el) {
        // 1. Highlight active menu item across both surfaces.
        document
          .querySelectorAll("#menu a, #bottom-tabs a")
          .forEach(function (a) {
            a.classList.remove("active");
          });
        if (el) el.classList.add("active");

        // 2. Loading state in #main-content.
        var container = document.getElementById("main-content");
        container.innerHTML = '<div class="efcc-loading">載入中，請稍候…</div>';

        // 3. Fetch fragment HTML from server.
        google.script.run
          .withSuccessHandler(function (html) {
            // 4. Inject returned HTML into #main-content.
            container.innerHTML = html;

            // 5. Re-execute any <script> tags in the injected content.
            //    innerHTML does not run scripts — we must clone each one so the browser
            //    evaluates it. Cleanup: append + immediately remove (script has already executed).
            var scripts = container.querySelectorAll("script");
            scripts.forEach(function (oldScript) {
              var newScript = document.createElement("script");
              // Copy attributes (src, type, etc.) — outerHTML clone preserves them all.
              for (var i = 0; i < oldScript.attributes.length; i++) {
                var attr = oldScript.attributes[i];
                newScript.setAttribute(attr.name, attr.value);
              }
              // Inline scripts carry their code as textContent; external scripts use src.
              newScript.text = oldScript.text;
              document.body.appendChild(newScript);
              document.body.removeChild(newScript);
            });

            // 6. Convention: each fragment exposes window['init' + Capitalize(name)]().
            var capitalized =
              pageName.charAt(0).toUpperCase() + pageName.slice(1);
            var initFn = window["init" + capitalized];
            if (typeof initFn === "function") {
              initFn();
            }
          })
          .withFailureHandler(function (err) {
            container.innerHTML =
              '<div class="msg-error">' +
              "Unable to load this page. " +
              (err && err.message ? err.message : "Please try again.") +
              "</div>";
          })
          .loadPage(pageName);

        // 7. UX: on mobile, close the drawer after picking an item.
        if (window.innerWidth < 768) {
          var sb = document.getElementById("sidebar");
          if (sb) sb.classList.remove("active");
        }
      }

      function toggleSidebar() {
        var sidebar = document.getElementById("sidebar");
        if (sidebar) sidebar.classList.toggle("active");
      }

      function toLoginShell_() {
        google.script.run
          .withSuccessHandler(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .loadLoginShell_();
      }

      function logout() {
        var raw;
        try {
          raw = JSON.parse(localStorage.getItem("efccSession") || "null");
        } catch (_) {
          raw = null;
        }
        var userId = raw && raw.userId;
        var token = raw && raw.token;
        localStorage.removeItem("efccSession");
        if (userId && token) {
          google.script.run
            .withSuccessHandler(toLoginShell_)
            .withFailureHandler(toLoginShell_)
            .api_logoutUser(userId, token);
        } else {
          toLoginShell_();
        }
      }

      function populateMenu_(pages) {
        var LABELS = {
          profile: "Profile 會員資料",
          programs: "Programs 課程",
          events: "Events 聚會",
          scanner: "Scanner 掃描",
          care: "Care 關懷",
        };
        var itemsHtml = pages
          .map(function (name) {
            var label = LABELS[name] || name;
            return (
              '<li><a href="#" onclick="loadMenuPage(\'' +
              name +
              "', this); return false;\">" +
              label +
              "</a></li>"
            );
          })
          .join("");
        document.getElementById("menu").innerHTML = itemsHtml;
        document.querySelector("#bottom-tabs ul").innerHTML = itemsHtml;
      }

      document.addEventListener("DOMContentLoaded", function () {
        var raw;
        try {
          raw = JSON.parse(localStorage.getItem("efccSession") || "null");
        } catch (_) {
          raw = null;
        }
        if (
          !raw ||
          !raw.token ||
          !raw.userId ||
          Number(raw.expiry) <= Date.now()
        ) {
          localStorage.removeItem("efccSession");
          toLoginShell_();
          return;
        }
        google.script.run
          .withSuccessHandler(function (sessionResponse) {
            if (
              !sessionResponse ||
              !sessionResponse.success ||
              !sessionResponse.data
            ) {
              localStorage.removeItem("efccSession");
              toLoginShell_();
              return;
            }
            google.script.run
              .withSuccessHandler(function (pagesResponse) {
                var pages = (pagesResponse &&
                  pagesResponse.success &&
                  pagesResponse.data) || ["profile"];
                populateMenu_(pages);
                var landing =
                  pages.indexOf("profile") !== -1 ? "profile" : pages[0];
                var landingLink = document.querySelector(
                  "#menu a[onclick*=\"'" + landing + "'\"]"
                );
                loadMenuPage(landing, landingLink);
              })
              .withFailureHandler(function () {
                populateMenu_(["profile"]);
                loadMenuPage("profile", document.querySelector("#menu a"));
              })
              .api_getAccessiblePages(raw.userId, raw.token);
          })
          .withFailureHandler(function () {
            localStorage.removeItem("efccSession");
            toLoginShell_();
          })
          .api_getCurrentSession(raw.userId, raw.token);
      });
    </script>
  </body>
</html>
