  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #c1ad95;color:#8a5b16;background:#f3eee8\">可報名<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onMessageDetail }}\">\n<div>\n  <div style=\"padding:6px 0 20px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ goHome }}\" style=\"display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-left:-8px;padding:8px;border:0;background:transparent;font-weight:550;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg>首頁<\u002Fbutton>\n    <h1 style=\"margin-top:14px;font-size:clamp(1.65rem,6vw,2.2rem)\">本週崇拜及聚會安排<\u002Fh1>\n    <p style=\"margin-top:12px;color:#59636a\">請留意本週三晚聚會改於二樓禮堂舉行。其他聚會時間維持不變。<\u002Fp>\n  <\u002Fdiv>\n  <article style=\"padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n    <h2 style=\"font-size:1.08rem;margin:0\">到達場地<\u002Fh2>\n    <p style=\"margin-top:10px;color:#59636a\">請按現場指示前往聚會地點，禮堂入口設有接待同工協助登記。<\u002Fp>\n  <\u002Farticle>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onScan }}\">\n<div style=\"{{ scanOverlayStyle }}\">\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;min-height:52px;padding:10px 56px;flex:none\">\n    <button type=\"button\" sc-camel-on-click=\"{{ goHome }}\" aria-label=\"返回首頁\" style=\"position:absolute;left:10px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#ffffff;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.14)\"><svg style=\"width:22px;height:22px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <h1 style=\"color:#ffffff;font-size:1.02rem;margin:0;font-weight:600;text-align:center\">{{ scanModeTitle }}<\u002Fh1>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;justify-content:center;padding:2px 16px 12px;flex:none\">\n    <div style=\"display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(255,255,255,.16)\">\n      <sc-if value=\"{{ scanModeIsSelf }}\"><button type=\"button\" aria-current=\"page\" sc-camel-on-click=\"{{ setScanModeSelf }}\" style=\"min-height:38px;padding:0 14px;border:0;border-radius:7px;color:#171a1d;background:#ffffff;font-weight:600;font-size:.82rem;cursor:pointer\">本人簽到<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ !scanModeIsSelf }}\"><button type=\"button\" sc-camel-on-click=\"{{ setScanModeSelf }}\" style=\"min-height:38px;padding:0 14px;border:0;border-radius:7px;color:#ffffff;background:transparent;font-weight:600;font-size:.82rem;cursor:pointer\">本人簽到<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ scanModeIsAssisted }}\"><button type=\"button\" aria-current=\"page\" sc-camel-on-click=\"{{ setScanModeAssisted }}\" style=\"min-height:38px;padding:0 14px;border:0;border-radius:7px;color:#171a1d;background:#ffffff;font-weight:600;font-size:.82rem;cursor:pointer\">代為簽到<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ !scanModeIsAssisted }}\"><button type=\"button\" sc-camel-on-click=\"{{ setScanModeAssisted }}\" style=\"min-height:38px;padding:0 14px;border:0;border-radius:7px;color:#ffffff;background:transparent;font-weight:600;font-size:.82rem;cursor:pointer\">代為簽到<\u002Fbutton><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ scanModeIsAssisted }}\">\n    <div style=\"padding:0 20px 14px;flex:none\">\n      <label style=\"position:relative;display:block\">\n        <span style=\"position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.7);font-size:.82rem;pointer-events:none\">課程<\u002Fspan>\n        <sc-raw-select value=\"{{ scanProgramKey }}\" sc-camel-on-change=\"{{ onScanProgramChange }}\" style=\"width:100%;min-height:44px;padding:0 14px 0 52px;border:1px solid rgba(255,255,255,.3);border-radius:9px;background:rgba(255,255,255,.1);color:#ffffff;font-size:.9rem;font-weight:600;appearance:none\">\n          <sc-for list=\"{{ scanProgramOptions }}\" as=\"popt\" hint-placeholder-count=\"6\"><option value=\"{{ popt.key }}\" style=\"color:#171a1d\">{{ popt.name }}<\u002Foption><\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;min-height:0\">\n    <p style=\"color:#ffffff;font-size:.88rem;margin:0 0 10px;text-align:center\">將二維碼放入框內掃描<\u002Fp>\n    <div style=\"position:relative;width:min(200px,58vw,24vh);height:min(200px,58vw,24vh);flex:none\">\n      <span style=\"position:absolute;top:0;left:0;width:26px;height:26px;border-top:3px solid #6bb3c7;border-left:3px solid #6bb3c7;border-radius:6px 0 0 0\"><\u002Fspan>\n      <span style=\"position:absolute;top:0;right:0;width:26px;height:26px;border-top:3px solid #6bb3c7;border-right:3px solid #6bb3c7;border-radius:0 6px 0 0\"><\u002Fspan>\n      <span style=\"position:absolute;bottom:0;left:0;width:26px;height:26px;border-bottom:3px solid #6bb3c7;border-left:3px solid #6bb3c7;border-radius:0 0 0 6px\"><\u002Fspan>\n      <span style=\"position:absolute;bottom:0;right:0;width:26px;height:26px;border-bottom:3px solid #6bb3c7;border-right:3px solid #6bb3c7;border-radius:0 0 6px 0\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"color:rgba(255,255,255,.65);font-size:.78rem;margin-top:10px;text-align:center\">相機權限只會在你按下開始掃描時請求。<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"flex:none;padding:18px 24px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px\">\n    <sc-if value=\"{{ scanModeIsSelf }}\"><button type=\"button\" sc-camel-on-click=\"{{ toastScanDemo }}\" aria-label=\"開始掃描\" style=\"width:64px;height:64px;border-radius:50%;background:#9c302c;color:#ffffff;border:0;display:grid;place-items:center;cursor:pointer\" style-hover=\"background:#8c2e2a\"><svg style=\"width:26px;height:26px\"><use href=\"#i-scan\"><\u002Fuse><\u002Fsvg><\u002Fbutton><\u002Fsc-if>\n    <sc-if value=\"{{ scanModeIsAssisted }}\"><button type=\"button\" sc-camel-on-click=\"{{ startAssistedScan }}\" aria-label=\"開始掃描\" style=\"width:64px;height:64px;border-radius:50%;background:#9c302c;color:#ffffff;border:0;display:grid;place-items:center;cursor:pointer\" style-hover=\"background:#8c2e2a\"><svg style=\"width:26px;height:26px\"><use href=\"#i-scan\"><\u002Fuse><\u002Fsvg><\u002Fbutton><\u002Fsc-if>\n    <span style=\"color:#ffffff;font-size:.78rem;font-weight:550\">開始掃描<\u002Fspan>\n    <button type=\"button\" sc-camel-on-click=\"{{ toastScanDemo }}\" style=\"margin-top:4px;min-height:44px;padding:8px 2px;border:0;color:#ffffff;background:transparent;font-weight:600;font-size:.85rem;cursor:pointer;text-decoration:underline\">無法使用相機？輸入代碼<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onAccount }}\">\n<div>\n  <div style=\"padding:14px 0 18px\"><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0\">帳戶<\u002Fh1><\u002Fdiv>\n  <article style=\"padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n    <span style=\"display:inline-flex;width:fit-content;min-height:28px;align-items:center;padding:4px 9px;border-radius:99px;font-size:.75rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff\">管理員身份<\u002Fspan>\n    <h2 style=\"margin-top:12px;font-size:1.4rem\">陳小明<\u002Fh2>\n    <p style=\"margin-top:6px;color:#59636a\">培育部 · 帳戶已啟用<\u002Fp>\n  <\u002Farticle>\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:26px 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">設定<\u002Fh2><\u002Fdiv>\n  <div style=\"overflow:hidden;border:1px solid #d6dcde;border-radius:10px;background:#ffffff\">\n    <button type=\"button\" sc-camel-on-click=\"{{ goAccountSettings }}\" style=\"width:100%;min-height:64px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;border:0;border-bottom:1px solid #d6dcde;background:transparent;cursor:pointer\" style-hover=\"background:#f7f7f7\"><span><span style=\"font-weight:600;display:block\">帳戶設定<\u002Fspan><span style=\"margin-top:4px;color:#59636a;font-size:.84rem;display:block\">更改登入名稱或密碼<\u002Fspan><\u002Fspan><svg style=\"width:20px;height:20px;color:#59636a\"><use href=\"#i-chevron\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ goDirectory }}\" style=\"width:100%;min-height:64px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;border:0;border-bottom:1px solid #d6dcde;background:transparent;cursor:pointer\" style-hover=\"background:#f7f7f7\"><span><span style=\"font-weight:600;display:block\">管理工作<\u002Fspan><span style=\"margin-top:4px;color:#59636a;font-size:.84rem;display:block\">待處理、審批、課程及出席<\u002Fspan><\u002Fspan><svg style=\"width:20px;height:20px;color:#59636a\"><use href=\"#i-chevron\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ doLogout }}\" style=\"width:100%;min-height:64px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;border:0;background:transparent;cursor:pointer\" style-hover=\"background:#f7f7f7\"><span style=\"font-weight:600;color:#b3261e\">登出<\u002Fspan><svg style=\"width:20px;height:20px;color:#59636a\"><use href=\"#i-chevron\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"margin-top:32px;padding-top:16px;border-top:1px solid #d6dcde;display:grid;gap:6px\">\n    <span style=\"color:#59636a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.68rem;font-weight:600;letter-spacing:.06em\">示範導覽（僅供預覽）<\u002Fspan>\n    <button type=\"button\" sc-camel-on-click=\"{{ goSwitchPersona }}\" style=\"min-height:40px;padding:6px 2px;border:0;color:#59636a;background:transparent;font-weight:550;cursor:pointer;font-size:.82rem;text-align:left\" style-hover=\"text-decoration:underline\">切換至會員身分視圖 →<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onAccountSettings }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:6px;padding:14px 0 18px\"><button type=\"button\" sc-camel-on-click=\"{{ goAccount }}\" style=\"display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:8px;border:0;background:transparent;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0\">帳戶設定<\u002Fh1><\u002Fdiv>\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">更改登入名稱<\u002Fh2><\u002Fdiv>\n  <div style=\"display:grid;gap:12px;padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n    <div><label sc-camel-html-for=\"mgmt-new-username\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">新登入名稱<\u002Flabel><input id=\"mgmt-new-username\" ref=\"{{ newUsernameRef }}\" sc-camel-auto-complete=\"username\" style=\"width:100%;min-height:50px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem\"><\u002Fdiv>\n    <p role=\"alert\" style=\"min-height:20px;color:#b3261e;font-size:.84rem;margin:0\">{{ usernameError }}<\u002Fp>\n    <button type=\"button\" sc-camel-on-click=\"{{ onSubmitUsername }}\" style=\"width:100%;min-height:48px;border-radius:9px;border:1px solid #868182;font-weight:600;cursor:pointer;color:#171a1d;background:#ffffff\">儲存登入名稱<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:24px 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">更改密碼<\u002Fh2><\u002Fdiv>\n  <div style=\"display:grid;gap:12px;padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n    <div><label sc-camel-html-for=\"mgmt-current-password\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">現時密碼<\u002Flabel><input id=\"mgmt-current-password\" ref=\"{{ currentPasswordRef }}\" type=\"password\" sc-camel-auto-complete=\"current-password\" style=\"width:100%;min-height:50px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem\"><\u002Fdiv>\n    <div><label sc-camel-html-for=\"mgmt-new-password\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">新密碼<\u002Flabel><input id=\"mgmt-new-password\" ref=\"{{ newPasswordRef }}\" type=\"password\" sc-camel-auto-complete=\"new-password\" style=\"width:100%;min-height:50px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem\"><span style=\"color:#59636a;font-size:.82rem;display:block;margin-top:7px\">最少 8 個字元。更改密碼後需在所有裝置重新登入。<\u002Fspan><\u002Fdiv>\n    <div><label sc-camel-html-for=\"mgmt-confirm-password\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">確認新密碼<\u002Flabel><input id=\"mgmt-confirm-password\" ref=\"{{ confirmPasswordRef }}\" type=\"password\" sc-camel-auto-complete=\"new-password\" style=\"width:100%;min-height:50px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem\"><\u002Fdiv>\n    <p role=\"alert\" style=\"min-height:20px;color:#b3261e;font-size:.84rem;margin:0\">{{ passwordError }}<\u002Fp>\n    <button type=\"button\" sc-camel-on-click=\"{{ onSubmitPassword }}\" style=\"width:100%;min-height:48px;border-radius:9px;border:1px solid #9c302c;font-weight:600;cursor:pointer;color:#ffffff;background:#9c302c\" style-hover=\"background:#8c2e2a;border-color:#8c2e2a\">更改密碼<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onNotAvailable }}\">\n<div style=\"max-width:460px;margin:40px auto 0\">\n  <article style=\"padding:30px 22px;text-align:center;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n    <div style=\"width:64px;height:64px;display:grid;place-items:center;margin:8px auto 20px;border-radius:50%;color:#59636a;background:#f1eff0\"><svg style=\"width:34px;height:34px\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n    <h1 style=\"font-size:1.6rem;margin:0\">找不到此內容<\u002Fh1>\n    <p style=\"margin-top:10px;color:#59636a\">此頁面不存在，或已不再適用於你的管理範圍。<\u002Fp>\n    <button type=\"button\" sc-camel-on-click=\"{{ goDirectory }}\" style=\"width:100%;min-height:48px;margin-top:18px;border-radius:9px;border:1px solid #9c302c;font-weight:600;cursor:pointer;color:#ffffff;background:#9c302c\">返回管理工作<\u002Fbutton>\n  <\u002Farticle>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onPrograms }}\">\n<div>\n  <div style=\"padding:14px 0 18px\"><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0\">課程<\u002Fh1><\u002Fdiv>\n\n  <sc-if value=\"{{ modeIsParticipant }}\">\n    <p style=\"margin:-8px 0 16px;color:#59636a;font-size:.8rem;line-height:1.5\">你目前在參與者頁面。你的帳戶擁有管理權限，可切換至「管理」查看課程工作台。<\u002Fp>\n    <div style=\"position:relative;margin-bottom:12px\"><svg style=\"width:22px;height:22px;position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#59636a\"><use href=\"#i-search\"><\u002Fuse><\u002Fsvg><input type=\"search\" placeholder=\"搜尋課程\" value=\"{{ programQuery }}\" sc-camel-on-change=\"{{ onProgramQueryChange }}\" style=\"width:100%;min-height:50px;padding:12px 14px 12px 46px;border:1px solid #868182;border-radius:9px;background:#ffffff;font-size:1rem\"><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px\">\n      <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <sc-if value=\"{{ f.active }}\"><button type=\"button\" aria-pressed=\"true\" sc-camel-on-click=\"{{ f.onSet }}\" style=\"flex:none;min-height:44px;padding:9px 14px;border:1px solid #171a1d;border-radius:99px;color:#ffffff;background:#171a1d;font-weight:550;cursor:pointer\">{{ f.label }}<\u002Fbutton><\u002Fsc-if>\n        <sc-if value=\"{{ !f.active }}\"><button type=\"button\" aria-pressed=\"false\" sc-camel-on-click=\"{{ f.onSet }}\" style=\"flex:none;min-height:44px;padding:9px 14px;border:1px solid #868182;border-radius:99px;color:#171a1d;background:#ffffff;font-weight:550;cursor:pointer\">{{ f.label }}<\u002Fbutton><\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"overflow:hidden;border:1px solid #868182;border-radius:10px;background:#ffffff\">\n      <sc-for list=\"{{ programRows }}\" as=\"prow\" hint-placeholder-count=\"4\">\n        <button type=\"button\" sc-camel-on-click=\"{{ prow.onOpen }}\" style=\"width:100%;min-height:72px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;border:0;border-bottom:1px solid #d6dcde;background:#ffffff;cursor:pointer\" style-hover=\"background:#f7f7f7\">\n          <span>\n            <sc-if value=\"{{ prow.isSuccess }}\"><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #9cb49d;color:#2e6b37;background:#e9f0ea\">{{ prow.tagLabel }}<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ prow.isPending }}\"><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #c1ad95;color:#8a5b16;background:#f3eee8\">{{ prow.tagLabel }}<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ prow.isNeutral }}\"><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff\">{{ prow.tagLabel }}<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ prow.isDanger }}\"><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #d7a199;color:#b3261e;background:#fbecea\">{{ prow.tagLabel }}<\u002Fspan><\u002Fsc-if>\n            <span style=\"font-weight:600;display:block;margin-top:9px\">{{ prow.name }}<\u002Fspan>\n            <span style=\"margin-top:5px;color:#59636a;font-size:.86rem;display:block\">{{ prow.copy }}<\u002Fspan>\n          <\u002Fspan>\n          <svg style=\"width:20px;height:20px;color:#59636a\"><use href=\"#i-chevron\"><\u002Fuse><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ programsEmpty }}\"><div style=\"padding:34px 22px;text-align:center;background:#ffffff;border:1px solid #d6dcde;border-radius:10px;margin-top:12px\"><h2 style=\"font-size:1.1rem;margin:0\">找不到相關課程<\u002Fh2><p style=\"margin-top:8px;color:#59636a\">請嘗試其他關鍵字或清除篩選。<\u002Fp><\u002Fdiv><\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ modeIsManagement }}\">\n    <p style=\"margin:-8px 0 16px;color:#59636a;font-size:.8rem;line-height:1.5\">管理模式只顯示目前帳戶獲授權範圍；先揀課程，再進入 Course Cockpit。<\u002Fp>\n    <div style=\"position:relative;margin-bottom:20px\"><svg style=\"width:22px;height:22px;position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#59636a\"><use href=\"#i-search\"><\u002Fuse><\u002Fsvg><input type=\"search\" placeholder=\"搜尋課程\" value=\"{{ mgmtProgramQuery }}\" sc-camel-on-change=\"{{ onMgmtProgramQueryChange }}\" style=\"width:100%;min-height:50px;padding:12px 14px 12px 46px;border:1px solid #868182;border-radius:9px;background:#ffffff;font-size:1rem\"><\u002Fdiv>\n\n    <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">最近管理<\u002Fh2><\u002Fdiv>\n    <div style=\"display:grid;gap:10px;margin-bottom:24px\">\n      <sc-for list=\"{{ recentRows }}\" as=\"rrow\" hin gn-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #9cb49d;color:#2e6b37;background:#e9f0ea\">已發布<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ mrow.isDraft }}\"><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff\">草稿<\u002Fspan><\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ mgmtProgramsEmpty }}\"><div style=\"padding:34px 22px;text-align:center;background:#ffffff;border:1px solid #d6dcde;border-radius:10px;margin-top:12px\"><h2 style=\"font-size:1.1rem;margin:0\">找不到相關課程<\u002Fh2><p style=\"margin-top:8px;color:#59636a\">請嘗試其他關鍵字。<\u002Fp><\u002Fdiv><\u002Fsc-if>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onProgramDetailP }}\">\n<div>\n  <div style=\"padding:6px 0 20px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ backFromProgramDetailP }}\" style=\"display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-left:-8px;padding:8px;border:0;background:transparent;font-weight:550;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg>課程<\u002Fbutton>\n    <sc-if value=\"{{ pdTagIsSuccess }}\"><span style=\"display:inline-flex;width:fit-content;min-height:28px;align-items:center;padding:4px 9px;border-radius:99px;font-size:.75rem;font-weight:550;border:1px solid #9cb49d;color:#2e6b37;background:#e9f0ea;margin-top:14px\">{{ pdTagLabel }}<\u002Fspan><\u002Fsc-if>\n    <sc-if value=\"{{ pdTagIsPending }}\"><span style=\"display:inline-flex;width:fit-content;min-height:28px;align-items:center;padding:4px 9px;border-radius:99px;font-size:.75rem;font-weight:550;border:1px solid #c1ad95;color:#8a5b16;background:#f3eee8;margin-top:14px\">{{ pdTagLabel }}<\u002Fspan><\u002Fsc-if>\n    <sc-if value=\"{{ pdTagIsNeutral }}\"><span style=\"display:inline-flex;width:fit-content;min-height:28px;align-items:center;padding:4px 9px;border-radius:99px;font-size:.75rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff;margin-top:14px\">{{ pdTagLabel }}<\u002Fspan><\u002Fsc-if>\n    <sc-if value=\"{{ pdTagIsDanger }}\"><span style=\"display:inline-flex;width:fit-content;min-height:28px;align-items:center;padding:4px 9px;border-radius:99px;font-size:.75rem;font-weight:550;border:1px solid #d7a199;color:#b3261e;background:#fbecea;margin-top:14px\">{{ pdTagLabel }}<\u002Fspan><\u002Fsc-if>\n    <h1 style=\"margin-top:14px;font-size:clamp(1.65rem,6vw,2.2rem)\">{{ pdName }}<\u002Fh1>\n    <p style=\"margin-top:12px;color:#59636a\">{{ pdPurpose }}<\u002Fp>\n  <\u002Fdiv>\n  <sc-if value=\"{{ pdHasNext }}\">\n  <article style=\"padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n    <span style=\"display:inline-flex;align-items:center;gap:7px;color:#59636a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;font-weight:600;letter-spacing:.08em\">下一次聚會<\u002Fspan>\n    <h2 style=\"margin:10px 0 16px;font-size:1.35rem\">{{ pdNextTitle }}<\u002Fh2>\n    <div style=\"display:grid;gap:9px;color:#59636a\">\n      <div style=\"display:flex;align-items:flex-start;gap:10px\"><svg style=\"width:19px;height:19px;margin-top:2px;flex:none\"><use href=\"#i-calendar\"><\u002Fuse><\u002Fsvg><span>{{ pdNextWhen }}<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:10px\"><svg style=\"width:19px;height:19px;margin-top:2px;flex:none\"><use href=\"#i-pin\"><\u002Fuse><\u002Fsvg><span>{{ pdNextWhere }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ pdHasConflict }}\"><p style=\"margin-top:10px;padding-top:10px;border-top:1px solid #d6dcde;color:#8a5b16;font-size:.82rem;line-height:1.5\"><svg style=\"width:14px;height:14px;display:inline;vertical-align:-2px;margin-right:4px\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg>{{ pdConflictNote }}<\u002Fp><\u002Fsc-if>\n    <button type=\"button\" sc-camel-on-click=\"{{ pdOnOpenEvent }}\" style=\"width:100%;min-height:48px;margin-top:16px;border-radius:9px;border:1px solid #868182;font-weight:600;cursor:pointer;color:#171a1d;background:#ffffff\" style-hover=\"background:#f7f7f7;border-color:#171a1d\">查看聚會詳情<\u002Fbutton>\n  <\u002Farticle>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ pdHasSchedule }}\">\n  <div style=\"margin-top:24px\"><h2 style=\"margin-bottom:12px;font-size:1.08rem\">聚會時間表<\u002Fh2>\n    <div style=\"padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n      <sc-for list=\"{{ pdScheduleRows }}\" as=\"row\" hint-placeholder-count=\"2\">\n        <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid #d6dcde\">\n          <div style=\"color:#59636a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;line-height:1.4\">{{ row.date }}<\u002Fdiv>\n          <div><div style=\"font-weight:600;line-height:1.5\">{{ row.title }}<\u002Fdiv><div style=\"margin-top:5px;color:#59636a;font-size:.88rem\">{{ row.copy }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"position:sticky;bottom:10px;margin-top:26px;padding:10px;border:1px solid #d6dcde;border-radius:12px;background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(23,26,29,.09)\">\n    <sc-if value=\"{{ pdHasAction }}\"><button type=\"button\" sc-camel-on-click=\"{{ pdOnAction }}\" style=\"width:100%;min-height:48px;border-radius:9px;border:1px solid #9c302c;font-weight:600;cursor:pointer;color:#ffffff;background:#9c302c\" style-hover=\"background:#8c2e2a;border-color:#8c2e2a\">{{ pdActionLabel }}<\u002Fbutton><\u002Fsc-if>\n    <sc-if value=\"{{ pdIsManagerOnly }}\"><div role=\"note\" style=\"padding:16px;border:1px solid #d6dcde;border-radius:9px;background:#ffffff\"><strong style=\"display:block;font-weight:600\">此課程由同工安排參加<\u002Fstrong><p style=\"margin-top:5px;color:#59636a;font-size:.88rem\">請向負責同工查詢參加安排。<\u002Fp><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ pdIsArchived }}\"><div role=\"note\" style=\"padding:16px;border:1px solid #d6dcde;border-radius:9px;background:#ffffff\"><strong style=\"display:block;font-weight:600\">此課程已封存<\u002Fstrong><p style=\"margin-top:5px;color:#59636a;font-size:.88rem\">暫不接受新報名。<\u002Fp><\u002Fdiv><\u002Fsc-if>\n    <p role=\"alert\" style=\"min-height:20px;color:#b3261e;font-size:.84rem;margin:6px 0 0\">{{ enrollError }}<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onEventDetailP }}\">\n<div>\n  <div style=\"padding:6px 0 20px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ edOnBack }}\" style=\"display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-left:-8px;padding:8px;border:0;background:transparent;font-weight:550;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg>返回<\u002Fbutton>\n    <span style=\"display:inline-flex;width:fit-content;min-height:28px;align-items:center;padding:4px 9px;border-radius:99px;font-size:.75rem;font-weight:550;border:1px solid #9cb49d;color:#2e6b37;background:#e9f0ea;margin-top:14px\">可簽到<\u002Fspan>\n    <h1 style=\"margin-top:14px;font-size:clamp(1.65rem,6vw,2.2rem)\">{{ edTitle }}<\u002Fh1>\n    <p style=\"margin-top:12px;color:#59636a\">{{ edProgramName }}<\u002Fp>\n  <\u002Fdiv>\n  <article style=\"padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n    <div style=\"display:grid;gap:9px;color:#59636a\">\n      <div style=\"display:flex;align-items:flex-start;gap:10px\"><svg style=\"width:19px;height:19px;margin-top:2px;flex:none\"><use href=\"#i-calendar\"><\u002Fuse><\u002Fsvg><span>{{ edWhen }}<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-start;gap:10px\"><svg style=\"width:19px;height:19px;margin-top:2px;flex:none\"><use href=\"#i-pin\"><\u002Fuse><\u002Fsvg><span>{{ edWhere }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n  <div style=\"position:sticky;bottom:10px;margin-top:26px;padding:10px;border:1px solid #d6dcde;border-radius:12px;background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(23,26,29,.09)\">\n    <button type=\"button\" sc-camel-on-click=\"{{ edGoScan }}\" style=\"width:100%;min-height:48px;border-radius:9px;border:1px solid #9c302c;font-weight:600;cursor:pointer;color:#ffffff;background:#9c302c\" style-hover=\"background:#8c2e2a;border-color:#8c2e2a\">前往掃描<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onProgramWorkspace }}\">\n<div>\n  <div style=\"display:flex;align-items:start;gap:10px;padding:14px 0 6px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ cwBackToPrograms }}\" style=\"display:inline-flex;align-items:center;min-height:44px;min-width:44px;margin-left:-8px;padding:8px;border:0;background:transparent;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <h1 style=\"font-size:clamp(1.4rem,5vw,1.8rem);margin:8px 0 0;flex:1\">{{ cwName }}<\u002Fh1>\n    <button type=\"button\" sc-camel-on-click=\"{{ cwOnEditCourse }}\" style=\"flex:none;margin-top:4px;min-height:44px;padding:9px 14px;border-radius:9px;border:1px solid #868182;font-weight:600;cursor:pointer;color:#171a1d;background:#ffffff;font-size:.88rem\" style-hover=\"background:#f7f7f7;border-color:#171a1d\">編輯課程<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:6px;padding:0 0 22px 0\">\n    <span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff\">{{ cwDept }}<\u002Fspan>\n    <span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff\">{{ cwLifecycle }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ cwShowNextBlock }}\">\n    <div style=\"margin:0 0 9px;color:#59636a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.74rem;font-weight:600;letter-spacing:.06em\">下一聚會<\u002Fdiv>\n    <div style=\"padding:20px;border:1px solid #d6dcde;border-radius:10px;background:#ffffff\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start\">\n        <div>\n          <strong style=\"display:block;font-size:1rem\">{{ cwNextTitle }}<\u002Fstrong>\n          <p style=\"margin-top:6px;color:#59636a;font-size:.88rem\">{{ cwNextWhen }} · {{ cwNextWhere }}<\u002Fp>\n          <span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;margin-top:10px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #9cb49d;color:#2e6b37;background:#e9f0ea\">自動排程<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ cwHasProgress }}\"><div style=\"min-width:72px;text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\"><span style=\"font-size:.95rem;font-weight:600\">{{ cwProgress }}<\u002Fspan><br><span style=\"color:#59636a;font-size:.8rem\">已簽到<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ cwOnOpenRoster }}\" style=\"width:100%;min-height:48px;margin-top:16px;border-radius:9px;border:1px solid #868182;font-weight:600;cursor:pointer;color:#171a1d;background:#ffffff\" style-hover=\"background:#f7f7f7;border-color:#171a1d\">前往管理名單<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:26px 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">營運<\u002Fh2><span style=\"color:#59636a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;font-weight:600;letter-spacing:.08em\">每週工作<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ cwOnEvents }}\" style=\"min-height:112px;padding:16px;text-align:left;border:1px solid #d6dcde;border-radius:10px;background:#ffffff;cursor:pointer\" style-hover=\"border-color:#171a1d;background:#f7f7f7\"><strong style=\"display:block;font-size:.96rem\">聚會<\u002Fstrong><span style=\"display:block;margin-top:7px;color:#59636a;font-size:.8rem;line-height:1.45\">{{ cwEventsCount }} 個聚會<\u002Fspan><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ cwOnParticipants }}\" style=\"min-height:112px;padding:16px;text-align:left;border:1px solid #d6dcde;border-radius:10px;background:#ffffff;cursor:pointer\" style-hover=\"border-color:#171a1d;background:#f7f7f7\">\n      <strong style=\"display:block;font-size:.96rem\">參與者<\u002Fstrong>\n      <sc-if value=\"{{ cwHasPending }}\"><span style=\"display:block;margin-top:7px;color:#8a5b16;font-size:.8rem;line-height:1.45;font-weight:600\">待審批報名 ×{{ cwPendingCount }}<\u002Fspan><\u002Fsc-if>\n      <sc-if value=\"{{ !cwHasPending }}\"><span style=\"display:block;margin-top:7px;color:#59636a;font-size:.8rem;line-height:1.45\">查看活躍名單<\u002Fspan><\u002Fsc-if>\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:26px 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">其他<\u002Fh2><span style=\"color:#59636a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;font-weight:600;letter-spacing:.08em\">低頻設定<\u002Fspan><\u002Fdiv>\n  <div style=\"overflow:hidden;border:1px solid #d6dcde;border-radius:10px;background:#ffffff\">\n    <button type=\"button\" sc-camel-on-click=\"{{ cwOnCourseFacts }}\" style=\"width:100%;min-height:58px;padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;border:0;border-bottom:1px solid #d6dcde;background:transparent;cursor:pointer\" style-hover=\"background:#f7f7f7\"><span><span style=\"font-weight:600;display:block\">課程資料<\u002Fspan><span style=\"margin-top:3px;color:#59636a;font-size:.82rem;display:block\">只讀摘要與分類標籤<\u002Fspan><\u002Fspan><svg style=\"width:20px;height:20px;color:#59636a\"><use href=\"#i-chevron\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ cwOnSettings }}\" style=\"width:100%;min-height:58px;padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;border:0;border-bottom:1px solid #d6dcde;background:transparent;cursor:pointer\" style-hover=\"background:#f7f7f7\"><span><span style=\"font-weight:600;display:block\">設定<\u002Fspan><span style=\"margin-top:3px;color:#59636a;font-size:.82rem;display:block\">課程範圍內的簽到及報名規則<\u002Fspan><\u002Fspan><svg style=\"width:20px;height:20px;color:#59636a\"><use href=\"#i-chevron\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ cwOnNotifications }}\" style=\"width:100%;min-height:58px;padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;border:0;background:transparent;cursor:pointer\" style-hover=\"background:#f7f7f7\"><span><span style=\"font-weight:600;display:block\">通知<\u002Fspan><span style=\"margin-top:3px;color:#59636a;font-size:.82rem;display:block\">課程消息訂閱及提醒<\u002Fspan><\u002Fspan><svg style=\"width:20px;height:20px;color:#59636a\"><use href=\"#i-chevron\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onCourseFacts }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:6px;padding:14px 0 18px\"><button type=\"button\" sc-camel-on-click=\"{{ cwBackToWorkspace }}\" style=\"display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:8px;border:0;background:transparent;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0\">課程資料<\u002Fh1><\u002Fdiv>\n  <article style=\"padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n    <div style=\"display:flex;gap:6px\"><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #9cb49d;color:#2e6b37;background:#e9f0ea\">{{ cwLifecycle }}<\u002Fspan><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff\">{{ cfListedLabel }}<\u002Fspan><\u002Fdiv>\n    <h2 style=\"margin-top:14px\">{{ cwName }}<\u002Fh2>\n    <p style=\"margin-top:8px;color:#59636a\">{{ cwPurpose }}<\u002Fp>\n    <dl style=\"display:grid;gap:12px;margin-top:18px\">\n      <div style=\"display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;font-size:.9rem\"><dt style=\"color:#59636a\">部門<\u002Fdt><dd style=\"margin:0;font-weight:550\">{{ cwDept }}<\u002Fdd><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;font-size:.9rem\"><dt style=\"color:#59636a\">報名模式<\u002Fdt><dd style=\"margin:0;font-weight:550\">{{ cfMode }}<\u002Fdd><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;font-size:.9rem\"><dt style=\"color:#59636a\">聚會形式<\u002Fdt><dd style=\"margin:0;font-weight:550\">{{ cfRecurringLabel }}<\u002Fdd><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;font-size:.9rem\"><dt style=\"color:#59636a\">可見性<\u002Fdt><dd style=\"margin:0;font-weight:550\">{{ cfListedLabel }}<\u002Fdd><\u002Fdiv>\n    <\u002Fdl>\n  <\u002Farticle>\n  <div style=\"margin-top:18px\"><button type=\"button\" sc-camel-on-click=\"{{ cwOnEditCourse }}\" style=\"width:100%;min-height:48px;border-radius:9px;border:1px solid #868182;font-weight:600;cursor:pointer;color:#171a1d;background:#ffffff\" style-hover=\"background:#f7f7f7;border-color:#171a1d\">編輯課程<\u002Fbutton><\u002Fdiv>\n  <p style=\"margin-top:14px;color:#59636a;font-size:.82rem;line-height:1.5\">課程資料是只讀摘要；編輯時會重新驗證目前管理範圍。<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onCourseEdit }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:6px;padding:14px 0 18px\"><button type=\"button\" sc-camel-on-click=\"{{ cwOnCourseFacts }}\" style=\"display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:8px;border:0;background:transparent;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0\">編輯課程<\u002Fh1><\u002Fdiv>\n  <div style=\"display:grid;gap:16px;padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n    <div><label sc-camel-html-for=\"course-name\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">課程名稱<\u002Flabel><input id=\"course-name\" ref=\"{{ courseNameRef }}\" sc-camel-default-value=\"{{ cwName }}\" style=\"width:100%;min-height:50px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem\"><\u002Fdiv>\n    <div><label sc-camel-html-for=\"course-purpose\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">課程簡介<\u002Flabel><textarea id=\"course-purpose\" ref=\"{{ coursePurposeRef }}\" sc-camel-default-value=\"{{ cwPurpose }}\" style=\"width:100%;min-height:96px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem;resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{ onSubmitCourseEdit }}\" style=\"width:100%;min-height:48px;border-radius:9px;border:1px solid #9c302c;font-weight:600;cursor:pointer;color:#ffffff;background:#9c302c\" style-hover=\"background:#8c2e2a;border-color:#8c2e2a\">儲存課程資料<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onProgramEvents }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:6px;padding:14px 0 6px\"><button type=\"button\" sc-camel-on-click=\"{{ backFromProgramEvents }}\" style=\"display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:8px;border:0;background:transparent;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0;flex:1\">聚會<\u002Fh1><button type=\"button\" sc-camel-on-click=\"{{ openCreateEvent }}\" style=\"flex:none;min-height:44px;padding:0 14px;border-radius:9px;border:1px solid #9c302c;font-weight:600;cursor:pointer;color:#ffffff;background:#9c302c;font-size:.9rem\" style-hover=\"background:#8c2e2a;border-color:#8c2e2a\">建立聚會<\u002Fbutton><\u002Fdiv>\n  <p style=\"color:#59636a;margin:0 0 18px\">{{ cwName }} 的個別聚會；「重複標記」只作顯示參考，不會自動生成其他聚會。<\u002Fp>\n  <div style=\"overflow:hidden;border:1px solid #d6dcde;border-radius:10px;background:#ffffff\">\n    <sc-for list=\"{{ eventRows }}\" as=\"erow\" hint-placeholder-count=\"3\">\n      <div style=\"padding:14px 16px;border-bottom:1px solid #d6dcde\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px\">\n          <div><span style=\"font-weight:600;display:block\">{{ erow.name }}<\u002Fspan><span style=\"margin-top:4px;color:#59636a;font-size:.84rem;display:block\">{{ erow.dateLabel }} · {{ erow.time }} · {{ erow.type }} · 重複：{{ erow.recurrenceTag }}<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ erow.isActive }}\"><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #9cb49d;color:#2e6b37;background:#e9f0ea\">開放簽到<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ erow.isCancelled }}\"><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff\">已取消<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ erow.isActive }}\">\n        <div style=\"display:flex;gap:16px;margin-top:10px;flex-wrap:wrap\">\n          <button type=\"button\" sc-camel-on-click=\"{{ erow.onComplete }}\" style=\"min-height:36px;padding:0;border:0;color:#2e6b37;background:transparent;font-weight:600;font-size:.84rem;cursor:pointer\" style-hover=\"text-decoration:underline\">標記完成<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ erow.onEdit }}\" style=\"min-height:36px;padding:0;border:0;color:#171a1d;background:transparent;font-weight:600;font-size:.84rem;cursor:pointer\" style-hover=\"text-decoration:underline\">編輯<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ erow.onCancel }}\" style=\"min-height:36px;padding:0;border:0;color:#b3261e;background:transparent;font-weight:600;font-size:.84rem;cursor:pointer\" style-hover=\"text-decoration:underline\">取消聚會<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ eventRowsEmpty }}\"><div style=\"padding:34px 22px;text-align:center;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\"><p style=\"color:#59636a;margin:0\">此課程暫時沒有開放中的聚會。按「建立聚會」新增。<\u002Fp><\u002Fdiv><\u002Fsc-if>\n  <p style=\"margin-top:14px;color:#59636a;font-size:.82rem;line-height:1.5\">已有出席記錄的聚會不能取消；如需更正出席，請使用聚會詳情內的作廢功能。編輯有出席記錄的聚會會被記錄原因與時間。<\u002Fp>\n\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:28px 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">歷史<\u002Fh2><\u002Fdiv>\n  <div style=\"overflow:hidden;border:1px solid #d6dcde;border-radius:10px;background:#ffffff\">\n    <sc-for list=\"{{ eventHistoryRows }}\" as=\"hevrow\" hint-placeholder-count=\"2\">\n      <div style=\"padding:14px 16px;border-bottom:1px solid #d6dcde\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px\">\n          <div><span style=\"font-weight:600;display:block\">{{ hevrow.name }}<\u002Fspan><span style=\"margin-top:4px;color:#59636a;font-size:.84rem;display:block\">{{ hevrow.dateLabel }} · {{ hevrow.time }} · {{ hevrow.type }}<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ hevrow.isCompleted }}\"><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #9cb49d;color:#2e6b37;background:#e9f0ea\">已完成<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ hevrow.isCancelled }}\"><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff\">已取消<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"margin-top:8px\"><button type=\"button\" sc-camel-on-click=\"{{ hevrow.onUndo }}\" style=\"min-height:36px;padding:0;border:0;color:#176a87;background:transparent;font-weight:600;font-size:.84rem;cursor:pointer\" style-hover=\"text-decoration:underline\">復原（誤按？）<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ eventHistoryEmpty }}\"><div style=\"padding:24px 22px;text-align:center;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\"><p style=\"color:#59636a;margin:0;font-size:.88rem\">暫無已完成或已取消的聚會。<\u002Fp><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onAttendanceChooser }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:6px;padding:14px 0 6px\"><button type=\"button\" sc-camel-on \u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ onRejectRegistration }}\" style=\"width:100%;min-height:48px;border-radius:9px;border:1px solid #868182;font-weight:600;cursor:pointer;color:#171a1d;background:#ffffff\">拒絕<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onParticipants }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:6px;padding:14px 0 18px\"><button type=\"button\" sc-camel-on-click=\"{{ goDirectory }}\" style=\"display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:8px;border:0;background:transparent;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0\">參與者<\u002Fh1><\u002Fdiv>\n  <div style=\"position:relative;margin-bottom:12px\"><svg style=\"width:22px;height:22px;position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#59636a\"><use href=\"#i-search\"><\u002Fuse><\u002Fsvg><input type=\"search\" placeholder=\"搜尋會員姓名、登入名稱或電話\" value=\"{{ participantQuery }}\" sc-camel-on-change=\"{{ onParticipantQueryChange }}\" style=\"width:100%;min-height:50px;padding:12px 14px 12px 46px;border:1px solid #868182;border-radius:9px;background:#ffffff;font-size:1rem\"><\u002Fdiv>\n  <div style=\"overflow:hidden;border:1px solid #d6dcde;border-radius:10px;background:#ffffff\">\n    <sc-for list=\"{{ memberRows }}\" as=\"mbrow\" hint-placeholder-count=\"4\">\n      <sc-if value=\"{{ mbrow.visible }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ mbrow.onOpen }}\" style=\"width:100%;min-height:64px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;border:0;border-bottom:1px solid #d6dcde;background:transparent;cursor:pointer\" style-hover=\"background:#f7f7f7\"><span><span style=\"font-weight:600;display:block\">{{ mbrow.name }}<\u002Fspan><span style=\"margi
