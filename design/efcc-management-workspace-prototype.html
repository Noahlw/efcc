-size:.9rem\"><dt style=\"color:#59636a\">電話<\u002Fdt><dd style=\"margin:0;font-weight:550\">{{ currentParticipantPhone }}<\u002Fdd><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;font-size:.9rem\"><dt style=\"color:#59636a\">狀態<\u002Fdt><dd style=\"margin:0;font-weight:550\">{{ currentParticipantStatus }}<\u002Fdd><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;font-size:.9rem\"><dt style=\"color:#59636a\">部門<\u002Fdt><dd style=\"margin:0;font-weight:550\">{{ currentParticipantDept }}<\u002Fdd><\u002Fdiv>\n    <\u002Fdl>\n  <\u002Farticle>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onHomeEditor }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:6px;padding:14px 0 18px\"><button type=\"button\" sc-camel-on-click=\"{{ goDirectory }}\" style=\"display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:8px;border:0;background:transparent;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0\">首頁內容<\u002Fh1><\u002Fdiv>\n\n  <sc-if value=\"{{ homeConflict }}\">\n  <div role=\"alert\" style=\"padding:16px;margin-bottom:16px;border:1px solid #d7a199;border-radius:9px;background:#fbecea\">\n    <strong style=\"display:block;font-weight:600\">有其他管理員已發佈較新版本<\u002Fstrong>\n    <p style=\"margin-top:6px;color:#59636a;font-size:.88rem\">你的變更尚未儲存。示範資料：模擬並行編輯衝突。<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ onDismissConflictReload }}\" style=\"min-height:44px;border-radius:9px;border:1px solid #868182;font-weight:600;cursor:pointer;color:#171a1d;background:#ffffff\">重新載入最新版本<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ onDismissConflictOverwrite }}\" style=\"min-height:44px;border-radius:9px;border:1px solid #9c302c;font-weight:600;cursor:pointer;color:#ffffff;background:#9c302c\">仍要覆寫<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px\">\n    <sc-if value=\"{{ homeTemplateIsA }}\"><button type=\"button\" aria-pressed=\"true\" sc-camel-on-click=\"{{ setHomeTemplateA }}\" style=\"flex:none;min-height:44px;padding:9px 14px;border:1px solid #171a1d;border-radius:99px;color:#ffffff;background:#171a1d;font-weight:550;cursor:pointer\">版面 A · 近期聚會優先<\u002Fbutton><\u002Fsc-if>\n    <sc-if value=\"{{ !homeTemplateIsA }}\"><button type=\"button\" aria-pressed=\"false\" sc-camel-on-click=\"{{ setHomeTemplateA }}\" style=\"flex:none;min-height:44px;padding:9px 14px;border:1px solid #868182;border-radius:99px;color:#171a1d;background:#ffffff;font-weight:550;cursor:pointer\">版面 A · 近期聚會優先<\u002Fbutton><\u002Fsc-if>\n    <sc-if value=\"{{ homeTemplateIsB }}\"><button type=\"button\" aria-pressed=\"true\" sc-camel-on-click=\"{{ setHomeTemplateB }}\" style=\"flex:none;min-height:44px;padding:9px 14px;border:1px solid #171a1d;border-radius:99px;color:#ffffff;background:#171a1d;font-weight:550;cursor:pointer\">版面 B · 教會消息優先<\u002Fbutton><\u002Fsc-if>\n    <sc-if value=\"{{ !homeTemplateIsB }}\"><button type=\"button\" aria-pressed=\"false\" sc-camel-on-click=\"{{ setHomeTemplateB }}\" style=\"flex:none;min-height:44px;padding:9px 14px;border:1px solid #868182;border-radius:99px;color:#171a1d;background:#ffffff;font-weight:550;cursor:pointer\">版面 B · 教會消息優先<\u002Fbutton><\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ homeTemplateIsA }}\">\n    <article style=\"padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n      <span style=\"color:#59636a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;font-weight:600;letter-spacing:.08em\">版面 A<\u002Fspan>\n      <div style=\"margin-top:12px\"><label sc-camel-html-for=\"featured-event\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">主打聚會<\u002Flabel>\n        <sc-raw-select id=\"featured-event\" style=\"width:100%;min-height:50px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem\">\n          <option>門徒訓練基礎課 · 第三課聚會（8月20日）<\u002Foption>\n          <option>慕道入門課程 · 第一課（9月7日）<\u002Foption>\n          <option>同行成長小組 · 彼此認識與同行（8月22日）<\u002Foption>\n        <\u002Fsc-raw-select>\n        <span style=\"color:#59636a;font-size:.82rem;display:block;margin-top:7px\">若所選聚會取消或過期，會自動改用下一個合資格的聚會。<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ homeTemplateIsB }}\">\n    <article style=\"display:grid;gap:16px;padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n      <span style=\"color:#59636a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;font-weight:600;letter-spacing:.08em\">版面 B<\u002Fspan>\n      <div><label sc-camel-html-for=\"msg-title\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">消息標題<\u002Flabel><input id=\"msg-title\" ref=\"{{ msgTitleRef }}\" sc-camel-default-value=\"本週崇拜及聚會安排\" style=\"width:100%;min-height:50px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem\"><\u002Fdiv>\n      <div><label sc-camel-html-for=\"msg-summary\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">摘要<\u002Flabel><textarea id=\"msg-summary\" ref=\"{{ msgSummaryRef }}\" sc-camel-default-value=\"請留意本週三晚聚會改於二樓禮堂舉行。\" style=\"width:100%;min-height:70px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem;resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n      <div><label sc-camel-html-for=\"msg-body\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">內文（純文字）<\u002Flabel><textarea id=\"msg-body\" ref=\"{{ msgBodyRef }}\" sc-camel-default-value=\"本週三晚聚會改於二樓禮堂舉行，其他聚會時間維持不變。\" style=\"width:100%;min-height:96px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem;resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n      <div><label sc-camel-html-for=\"msg-cta\" style=\"font-weight:550;font-size:.92rem;display:block;margin-bottom:7px\">按鈕標籤<\u002Flabel><input id=\"msg-cta\" ref=\"{{ msgCtaRef }}\" sc-camel-default-value=\"查看詳情\" style=\"width:100%;min-height:50px;padding:12px 14px;border:1px solid #868182;border-radius:8px;background:#ffffff;font-size:1rem\"><\u002Fdiv>\n      <span style=\"color:#59636a;font-size:.82rem\">外部目的地會標示「外部連結」，並在新視窗開啟。切換版面不會影響另一個版面的草稿。<\u002Fspan>\n    <\u002Farticle>\n  <\u002Fsc-if>\n\n  <div style=\"display:grid;gap:10px;margin-top:18px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ onPreviewHome }}\" style=\"width:100%;min-height:48px;border-radius:9px;border:1px solid #868182;font-weight:600;cursor:pointer;color:#171a1d;background:#ffffff\">預覽<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ onSaveDraft }}\" style=\"width:100%;min-height:48px;border-radius:9px;border:1px solid #868182;font-weight:600;cursor:pointer;color:#171a1d;background:#ffffff\">儲存草稿<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ onOpenPublish }}\" style=\"width:100%;min-height:48px;border-radius:9px;border:1px solid #9c302c;font-weight:600;cursor:pointer;color:#ffffff;background:#9c302c\" style-hover=\"background:#8c2e2a;border-color:#8c2e2a\">發佈<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ onSimulateConflict }}\" style=\"min-height:40px;padding:6px 2px;border:0;color:#59636a;background:transparent;font-weight:550;cursor:pointer;font-size:.78rem;justify-self:center\" style-hover=\"text-decoration:underline\">示範：模擬版本衝突<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:26px 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">發佈記錄<\u002Fh2><\u002Fdiv>\n  <div style=\"padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px\">\n    <sc-for list=\"{{ homeAuditRows }}\" as=\"hdrow\" hint-placeholder-count=\"2\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid #d6dcde\"><span><span style=\"font-weight:550;font-size:.86rem;display:block\">{{ hdrow.who }}<\u002Fspan><span style=\"color:#59636a;font-size:.8rem;margin-top:3px;display:block\">{{ hdrow.what }}<\u002Fspan><\u002Fspan><span style=\"color:#59636a;font-size:.72rem;white-space:nowrap\">{{ hdrow.when }}<\u002Fspan><\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <p style=\"margin-top:14px;color:#59636a;font-size:.82rem;line-height:1.5\">示範資料：以上編輯、預覽、發佈流程只作demonstration，未連接真實資料庫。排程到期後會還原至最近一個仍然有效的版本；如無則顯示系統首頁。<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onNotifications }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:6px;padding:14px 0 18px\"><button type=\"button\" sc-camel-on-click=\"{{ goDirectory }}\" style=\"display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:8px;border:0;background:transparent;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0\">通知<\u002Fh1><\u002Fdiv>\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">教會消息訂閱<\u002Fh2><\u002Fdiv>\n  <article style=\"padding:20px;background:#ffffff;border:1px solid #d6dcde;border-radius:10px;display:grid;gap:14px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\"><span><span style=\"font-weight:600;display:block\">教會消息<\u002Fspan><span style=\"margin-top:3px;color:#59636a;font-size:.82rem;display:block\">透過首頁發佈的教會消息，選擇性訂閱<\u002Fspan><\u002Fspan><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #9cb49d;color:#2e6b37;background:#e9f0ea\">已訂閱<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\"><span><span style=\"font-weight:600;display:block\">培育部課程更新<\u002Fspan><span style=\"margin-top:3px;color:#59636a;font-size:.82rem;display:block\">新課程及報名通知<\u002Fspan><\u002Fspan><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #9cb49d;color:#2e6b37;background:#e9f0ea\">已訂閱<\u002Fspan><\u002Fdiv>\n  <\u002Farticle>\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:24px 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">通知保留<\u002Fh2><\u002Fdiv>\n  <p style=\"color:#59636a;line-height:1.6;margin:0\">已讀通知保留 90 日；未解決的待處理工作會一直保留，直到來源完成或授權被撤銷。<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onSettings }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:6px;padding:14px 0 18px\"><button type=\"button\" sc-camel-on-click=\"{{ goDirectory }}\" style=\"display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:8px;border:0;background:transparent;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0\">設定<\u002Fh1><\u002Fdiv>\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">帳戶與權限<\u002Fh2><\u002Fdiv>\n  <div style=\"overflow:hidden;border:1px solid #d6dcde;border-radius:10px;background:#ffffff\">\n    <button type=\"button\" sc-camel-on-click=\"{{ goAccountPermissions }}\" style=\"width:100%;min-height:64px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;border:0;border-bottom:1px solid #d6dcde;background:transparent;cursor:pointer\" style-hover=\"background:#f7f7f7\"><span><span style=\"font-weight:600;display:block\">帳戶與權限<\u002Fspan><span style=\"margin-top:4px;color:#59636a;font-size:.84rem;display:block\">管理帳戶及授權<\u002Fspan><\u002Fspan><svg style=\"width:20px;height:20px;color:#59636a\"><use href=\"#i-chevron\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ goCheckinSettings }}\" style=\"width:100%;min-height:64px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;border:0;border-bottom:1px solid #d6dcde;background:transparent;cursor:pointer\" style-hover=\"background:#f7f7f7\"><span><span style=\"font-weight:600;display:block\">簽到設定<\u002Fspan><span style=\"margin-top:4px;color:#59636a;font-size:.84rem;display:block\">簽到時段及方式<\u002Fspan><\u002Fspan><svg style=\"width:20px;height:20px;color:#59636a\"><use href=\"#i-chevron\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ goTimezoneSettings }}\" style=\"width:100%;min-height:64px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;border:0;background:transparent;cursor:pointer\" style-hover=\"background:#f7f7f7\"><span><span style=\"font-weight:600;display:block\">時區<\u002Fspan><span style=\"margin-top:4px;color:#59636a;font-size:.84rem;display:block\">香港時間（GMT+8）<\u002Fspan><\u002Fspan><svg style=\"width:20px;height:20px;color:#59636a\"><use href=\"#i-chevron\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ onAccountPermissions }}\">\n<div>\n  <div style=\"display:flex;align-items:center;gap:6px;padding:14px 0 18px\"><button type=\"button\" sc-camel-on-click=\"{{ goSettings }}\" style=\"display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:8px;border:0;background:transparent;cursor:pointer\"><svg style=\"width:20px;height:20px\"><use href=\"#i-back\"><\u002Fuse><\u002Fsvg><\u002Fbutton><h1 style=\"font-size:clamp(1.5rem,5.5vw,1.9rem);margin:0\">帳戶與權限<\u002Fh1><\u002Fdiv>\n  <p style=\"color:#59636a;margin:0 0 18px\">管理員帳戶可指派角色及部門授權。角色變更會即時反映；部門管理者不能自行授予管理者權限。<\u002Fp>\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">管理員帳戶<\u002Fh2><\u002Fdiv>\n  <div style=\"overflow:hidden;border:1px solid #d6dcde;border-radius:10px;background:#ffffff\">\n    <div style=\"min-height:64px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;border-bottom:1px solid #d6dcde\"><span><span style=\"font-weight:600;display:block\">陳小明<\u002Fspan><span style=\"margin-top:4px;color:#59636a;font-size:.84rem;display:block\">管理員 · 培育部<\u002Fspan><\u002Fspan><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff\">管理員<\u002Fspan><\u002Fdiv>\n    <div style=\"min-height:64px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px\"><span><span style=\"font-weight:600;display:block\">黃家豪<\u002Fspan><span style=\"margin-top:4px;color:#59636a;font-size:.84rem;display:block\">同工 · 崇拜部<\u002Fspan><\u002Fspan><span style=\"display:inline-flex;width:fit-content;min-height:26px;align-items:center;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:550;border:1px solid #d6dcde;color:#59636a;background:#ffffff\">部門管理者<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:end;justify-content:space-between;gap:16px;margin:24px 0 12px\"><h2 style=\"font-size:1.1rem;margin:0\">角色<\u002Fh2><\u002Fdiv>\n  <div style=\"overflow:hidden;border:1px solid #d6dcde;border-radius:10px;background:#ffffff\">\n    <div style=\"mi
