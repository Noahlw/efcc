<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harden: Event Detail (Open Check-in)</title>
    <style>
      :root {
        --surface: #f4f5f3;
        --surface-raised: #ffffff;
        --ink: #171a1d;
        --ink-muted: #59636a;
        --line: #d6dcde;
        --line-strong: #aeb8bc;
        --accent: #9c302c;
        --accent-deep: #76231f;
        --focus: #176a87;
        --success: #2e6b37;
        --success-surface: #eef4ef;
        --success-border: #b9cfbe;
        --error: #b3261e;
        --error-surface: #fbeeed;
        --error-border: #e5b4b0;
        --pending: #8a5b16;
        --pending-surface: #f3eee8;
        --pending-border: #c1ad95;
        --skeleton: #e3e0e1;
        --font-sans:
          -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC",
          "Microsoft JhengHei", Arial, sans-serif;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-pill: 999px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--surface);
        color: var(--ink);
        font-family: var(--font-sans);
        line-height: 1.5;
        padding: 1rem;
        display: flex;
        justify-content: center;
      }
      .preview-wrapper {
        width: 100%;
        max-width: 390px;
        background: var(--surface-raised);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 1.25rem;
        min-height: 600px;
        position: relative;
      }
      .badge-tag {
        display: inline-block;
        padding: 0.1875rem 0.5625rem;
        border-radius: var(--radius-pill);
        font-size: 0.75rem;
        font-weight: 700;
      }
      .badge-success {
        border: 1px solid var(--success-border);
        color: var(--success);
        background: var(--success-surface);
      }
      .badge-neutral {
        border: 1px solid var(--line-strong);
        color: var(--ink-muted);
        background: var(--surface);
      }
      .badge-pending {
        border: 1px solid var(--pending-border);
        color: var(--pending);
        background: var(--pending-surface);
      }
      .badge-error {
        border: 1px solid var(--error-border);
        color: var(--error);
        background: var(--error-surface);
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        min-height: 44px;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: var(--surface-raised);
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        margin-bottom: 1rem;
      }
      .back-btn:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .header {
        display: grid;
        gap: 0.375rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--line);
        margin-bottom: 1rem;
      }
      .eyebrow {
        color: var(--ink-muted);
        font-size: 0.875rem;
        font-weight: 700;
      }
      .title {
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .info-card {
        display: grid;
        gap: 0.625rem;
        padding: 1.25rem;
        background: var(--surface-raised);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        margin-bottom: 1.25rem;
      }
      .fact-row {
        display: flex;
        align-items: flex-start;
        gap: 0.625rem;
        color: var(--ink-muted);
        line-height: 1.6;
      }
      .fact-icon {
        width: 1.25rem;
        height: 1.25rem;
        flex: 0 0 auto;
        margin-top: 0.25rem;
      }
      .section {
        display: grid;
        gap: 0.625rem;
        margin-bottom: 1.5rem;
      }
      .section-heading {
        font-size: 1rem;
        font-weight: 800;
      }
      .section-desc {
        color: var(--ink-muted);
        line-height: 1.6;
      }
      .sticky-bar {
        position: sticky;
        bottom: 1rem;
        padding: 0.625rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: color-mix(in srgb, var(--surface-raised) 94%, transparent);
        box-shadow: 0 -8px 24px color-mix(in srgb, var(--ink) 10%, transparent);
        backdrop-filter: blur(8px);
      }
      .btn-primary {
        display: block;
        width: 100%;
        min-height: 48px;
        padding: 0.6875rem 1.25rem;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 1rem;
        font-weight: 800;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      .btn-primary:hover {
        background: var(--accent-deep);
      }
      .btn-secondary {
        display: block;
        width: 100%;
        min-height: 48px;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: var(--surface-raised);
        color: var(--ink);
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      .btn-secondary:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .panel-error {
        padding: 1rem;
        background: var(--error-surface);
        border: 1px solid var(--error-border);
        border-radius: var(--radius-sm);
        color: var(--ink);
        margin-bottom: 1rem;
      }
      .panel-error h2 {
        font-size: 1.1rem;
        margin-bottom: 0.5rem;
        color: var(--error);
      }
      .panel-error p {
        margin-bottom: 0.75rem;
        color: var(--ink-muted);
      }
      .skeleton-box {
        background: var(--skeleton);
        border-radius: var(--radius-sm);
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
      .offline-banner {
        background: var(--pending-surface);
        border: 1px solid var(--pending-border);
        color: var(--pending);
        padding: 0.5rem 0.75rem;
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <svg style="display: none">
      <symbol id="icon-back" viewBox="0 0 24 24">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m15 18-6-6 6-6"
        />
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <rect
          x="3"
          y="5"
          width="18"
          height="16"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <path
          d="M16 3v4M8 3v4M3 10h18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24">
        <path
          d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle
          cx="12"
          cy="10"
          r="2.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        />
      </symbol>
    </svg>

    <div class="preview-wrapper">
      <button class="back-btn" type="button">
        <svg class="fact-icon"><use href="#icon-back" /></svg> 返回
      </button>
      <header class="header">
        <span class="badge-tag badge-success">可簽到</span>
        <p class="eyebrow">門徒訓練基礎課</p>
        <h1 class="title">第三課聚會</h1>
      </header>

      <article class="info-card">
        <p class="fact-row">
          <svg class="fact-icon"><use href="#icon-calendar" /></svg>
          <time datetime="2026-08-20T19:30:00+08:00"
            >8月20日（三）晚上 7:30–9:00</time
          >
        </p>
        <p class="fact-row">
          <svg class="fact-icon"><use href="#icon-pin" /></svg>
          <span>二樓禮堂</span>
        </p>
      </article>

      <section class="section">
        <h2 class="section-heading">簽到說明</h2>
        <p class="section-desc">請於簽到時間內前往掃描，確認聚會後完成簽到。</p>
      </section>

      <div class="sticky-bar">
        <a href="/scanner?event=e-101" class="btn-primary">前往掃描</a>
      </div>
    </div>
  </body>
</html>
