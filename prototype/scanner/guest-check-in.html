<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f5f3" />
    <title>EFCC 訪客簽到</title>
    <link rel="stylesheet" href="./civic.css" />
    <script src="./vendor/html5-qrcode.min.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <button
          class="app__back"
          type="button"
          aria-label="返回"
          onclick="history.back()"
        >
          ←
        </button>
        <div>
          <h1 class="app__title">訪客簽到</h1>
          <p class="app__subtitle">無需帳戶，掃描或輸入簽到碼即可</p>
        </div>
      </header>

      <div class="stack" id="token-step">
        <div class="panel">
          <p class="panel__title">掃描課程 QR 碼</p>
          <div class="viewfinder" id="viewfinder">
            <div id="scanner-reader" class="viewfinder__reader"></div>
            <div class="viewfinder__reticle">
              <div class="viewfinder__box">
                <span class="viewfinder__corner viewfinder__corner--tl"></span>
                <span class="viewfinder__corner viewfinder__corner--tr"></span>
                <span class="viewfinder__corner viewfinder__corner--bl"></span>
                <span class="viewfinder__corner viewfinder__corner--br"></span>
              </div>
              <p class="viewfinder__hint">對準 Program QR Code</p>
            </div>
          </div>
        </div>

        <button class="btn btn--block" id="toggle-manual" type="button">
          輸入簽到碼
        </button>
      </div>

      <div class="stack hidden" id="manual-step">
        <div class="panel">
          <p class="panel__title">輸入 6 位簽到碼</p>
          <form class="code-form" id="manual-form" onsubmit="return false;">
            <div class="code-form__fields">
              <input
                class="code-char"
                inputmode="text"
                maxlength="1"
                autocomplete="off"
                aria-label="簽到碼第 1 位"
              />
              <input
                class="code-char"
                inputmode="text"
                maxlength="1"
                autocomplete="off"
                aria-label="簽到碼第 2 位"
              />
              <input
                class="code-char"
                inputmode="text"
                maxlength="1"
                autocomplete="off"
                aria-label="簽到碼第 3 位"
              />
              <input
                class="code-char"
                inputmode="text"
                maxlength="1"
                autocomplete="off"
                aria-label="簽到碼第 4 位"
              />
              <input
                class="code-char"
                inputmode="text"
                maxlength="1"
                autocomplete="off"
                aria-label="簽到碼第 5 位"
              />
              <input
                class="code-char"
                inputmode="text"
                maxlength="1"
                autocomplete="off"
                aria-label="簽到碼第 6 位"
              />
            </div>
            <button class="btn btn--block" type="button" id="manual-submit">
              繼續
            </button>
          </form>
        </div>
        <button class="btn btn--ghost" id="toggle-scanner" type="button">
          返回掃描
        </button>
      </div>

      <div class="stack hidden" id="guest-form-step">
        <div class="panel">
          <p class="panel__title">訪客資料</p>
          <div class="stack" style="gap: var(--space-md)">
            <div class="field">
              <label class="field__label" for="guest-name">姓名</label>
              <input
                class="field__input"
                id="guest-name"
                type="text"
                placeholder="請輸入姓名"
              />
            </div>
            <div class="field">
              <label class="field__label" for="guest-phone">電話</label>
              <input
                class="field__input"
                id="guest-phone"
                type="tel"
                placeholder="例如 9123 4567"
              />
              <p class="field__hint">供需要時聯絡你</p>
            </div>
            <button
              class="btn btn--primary btn--block"
              id="guest-submit"
              type="button"
            >
              確認簽到
            </button>
          </div>
        </div>
      </div>

      <div class="result hidden" id="result" role="status" aria-live="polite">
        <span class="result__glyph" aria-hidden="true"></span>
        <div>
          <p class="result__title"></p>
          <p class="result__text"></p>
        </div>
      </div>

      <div
        class="text-center"
        style="margin-top: auto; padding-top: var(--space-xl)"
      >
        <a
          href="./check-in.html"
          style="color: var(--civic-ink-muted); font-size: 0.875rem"
        >
          已有帳戶？登入後簽到
        </a>
      </div>
    </main>

    <script src="./mock-backend.js"></script>
    <script src="./check-in-ui.js"></script>
    <script>
      const mockBackend = window.MOCK;
      const ui = window.UI;

      const tokenStep = ui.q("#token-step");
      const manualStep = ui.q("#manual-step");
      const guestFormStep = ui.q("#guest-form-step");
      const resultEl = ui.q("#result");

      let resolvedToken = "";

      const scanner = new InlineScanner("scanner-reader", (tokenOrCode) => {
        resolvedToken = tokenOrCode;
        scanner.stop();
        showGuestForm();
      });

      function showResult(tone, glyph, title, text) {
        ui.setResult(resultEl, { tone, glyph, title, text });
      }

      function showGuestForm() {
        ui.show(tokenStep, false);
        ui.show(manualStep, false);
        ui.show(guestFormStep, true);
        ui.clearResult(resultEl);
        ui.q("#guest-name").focus();
      }

      function submitGuest() {
        const name = ui.q("#guest-name").value.trim();
        const phone = ui.q("#guest-phone").value.trim();
        if (!name) {
          showResult("error", "✗", "請輸入姓名", "訪客簽到需要至少姓名。");
          return;
        }
        const outcome = mockBackend.recordGuestCheckIn({
          tokenOrCode: resolvedToken,
          guestName: name,
          guestPhone: phone,
        });
        if (!outcome.ok) {
          showResult(
            "error",
            "✗",
            "簽到無法進行",
            "目前沒有開放簽到的聚會，或簽到碼已過期。"
          );
          return;
        }
        ui.show(guestFormStep, false);
        showResult(
          "success",
          "✓",
          "訪客簽到成功",
          `${outcome.program.name} · ${outcome.event.name} · ${ui.formatTime(outcome.attendance.checkedInAt)}`
        );
      }

      ui.q("#toggle-manual").addEventListener("click", () => {
        scanner.stop();
        ui.show(tokenStep, false);
        ui.show(manualStep, true);
        ui.clearResult(resultEl);
        ui.q("#manual-form .code-char").focus();
      });

      ui.q("#toggle-scanner").addEventListener("click", () => {
        ui.show(manualStep, false);
        ui.show(tokenStep, true);
        ui.clearResult(resultEl);
        scanner.start().catch(() => {
          showResult("error", "✗", "相機無法啟動", "請改用輸入簽到碼。");
        });
      });

      const manual = wireManualCodeForm(ui.q("#manual-form"), (code) => {
        resolvedToken = code;
        showGuestForm();
      });

      ui.q("#manual-submit").addEventListener("click", () => {
        const code = manual.value();
        if (code.length === 6) {
          resolvedToken = code;
          showGuestForm();
        }
      });

      ui.q("#guest-submit").addEventListener("click", submitGuest);

      scanner.start().catch(() => {
        showResult("error", "✗", "相機無法啟動", "請改用輸入簽到碼。");
      });
    </script>
  </body>
</html>
