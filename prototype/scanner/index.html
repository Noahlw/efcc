<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0f" />
    <title>EFCC QR 掃描</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- Pinned self-hosted decoders (ADR-0015; supply-chain control).
         html5-qrcode@2.3.8 is the primary decoder (validated fast on phone);
         jsQR@1.4.0 is the escape hatch via ?decoder=jsqr. The library's own
         UI is hidden via CSS; a custom reticle overlays the camera. -->
    <script src="./vendor/html5-qrcode.min.js"></script>
    <script src="./vendor/jsQR.js"></script>
  </head>
  <body>
    <main class="scan">
      <header class="scan__top">
        <button class="scan__close" id="close" type="button" aria-label="關閉掃描器">
          ✕
        </button>
        <div class="scan__event" id="event">EFCC 掃描</div>
        <span class="scan__spacer" aria-hidden="true"></span>
      </header>

      <div class="scan__view" id="viewfinder">
        <!-- html5-qrcode primary path injects its video + (hidden) UI here -->
        <div id="qr-reader" class="scan__reader"></div>
        <!-- jsQR escape-hatch path renders here -->
        <video
          id="video"
          autoplay
          muted
          playsinline
          class="scan__video scan__video--hidden"
        ></video>
        <!-- Custom aim reticle (purely visual; decode uses the full frame) -->
        <div class="reticle" id="reticle" aria-hidden="true">
          <div class="reticle__box">
            <span class="reticle__corner reticle__corner--tl"></span>
            <span class="reticle__corner reticle__corner--tr"></span>
            <span class="reticle__corner reticle__corner--bl"></span>
            <span class="reticle__corner reticle__corner--br"></span>
            <span class="reticle__line"></span>
          </div>
          <p class="reticle__hint" id="hint">對準 QR Code</p>
        </div>
      </div>

      <canvas id="canvas" class="scan__canvas--hidden"></canvas>

      <div
        class="result"
        id="result"
        role="status"
        aria-live="polite"
        data-tone="info"
        data-loading="true"
      >
        <span class="result__glyph" id="result-glyph" aria-hidden="true"></span>
        <span class="result__text" id="result-text">開啟掃描器…</span>
      </div>

      <div class="scan__actions">
        <button class="btn btn--retry" id="retry" type="button" hidden>
          重試
        </button>
        <button class="btn btn--resume" id="resume" type="button" hidden>
          返回掃描
        </button>
      </div>
    </main>

    <script type="module" src="./scanner.js"></script>
  </body>
</html>
