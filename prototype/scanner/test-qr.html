<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>測試用 QR Code</title>
    <script src="./vendor/qrcode-generator.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #fff;
        color: #111;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
          sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.85rem;
        color: #555;
        margin: 0 0 16px;
      }
      input {
        font-size: 1rem;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        width: 280px;
        text-align: center;
      }
      .qr {
        margin: 24px auto;
        background: #fff;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        display: inline-block;
      }
      .qr svg {
        display: block;
      }
      .code {
        font-family: ui-monospace, monospace;
        font-size: 1.4rem;
        margin-top: 12px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <h1>測試用 QR Code</h1>
    <p>在手機上掃描這個 QR Code（或自行輸入代碼）。</p>
    <input id="code" type="text" value="GC-MEM-0001" maxlength="64" />
    <div class="qr" id="qr"></div>
    <div class="code" id="codeLabel">GC-MEM-0001</div>

    <script>
      const input = document.getElementById("code");
      const box = document.getElementById("qr");
      const label = document.getElementById("codeLabel");

      function render() {
        const text = input.value || "GC-MEM-0001";
        label.textContent = text;
        // typeNumber 0 = auto size; errorCorrectionLevel "M".
        const qr = qrcode(0, "M");
        qr.addData(text);
        qr.make();
        box.innerHTML = qr.createSvgTag({
          cellSize: 8,
          margin: 2,
          scalable: true,
        });
      }

      input.addEventListener("input", render);
      render();
    </script>
  </body>
</html>
