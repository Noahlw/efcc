<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Church Member Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide { display: none !important; }
        .pb-safe { padding-bottom: 80px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen w-screen overflow-x-hidden flex flex-col relative">

    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center z-10 relative">
        <h1 class="text-xl font-bold tracking-tight">播道會顯恩堂</h1>
        <button id="logoutBtn" class="hide text-sm bg-indigo-700 hover:bg-indigo-800 px-3 py-1 rounded-full transition">Log Out</button>
    </header>

    <main id="loginScreen" class="flex-grow flex flex-col items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full border border-gray-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Welcome</h2>
                <p class="text-sm text-gray-500 mt-1">Sign in to your portal.</p>
            </div>

            <div id="loginContainer" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="usernameInput" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">4-Digit PIN</label>
                    <input type="password" id="pinInput" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" maxlength="4" required>
                </div>
                <div id="errorMsg" class="text-red-500 text-sm hidden text-center font-medium"></div>
                <button type="button" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow transition transform active:scale-95">Sign In</button>
            </div>
        </div>
    </main>

    <main id="dashboardScreen" class="hide flex-grow flex flex-col p-4 max-w-md mx-auto w-full pb-safe">
        <div class="mb-6 mt-2">
            <h2 class="text-2xl font-bold text-gray-900">Hello, <span id="userNameDisplay">Member</span>!</h2>
            <p class="text-gray-500 text-sm">Have a blessed day.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-6 flex flex-col items-center mb-6">
            <h3 class="font-semibold text-gray-700 mb-4 tracking-wide uppercase text-xs">Your Attendance QR</h3>
            <div class="p-2 bg-white rounded-xl shadow-inner border border-gray-100 min-h-[200px] min-w-[200px] flex justify-center items-center">
                <img id="qrImage" src="" alt="User QR Code" class="w-48 h-48 object-contain">
            </div>
            <p class="mt-4 text-sm text-gray-500 text-center">Show this code to your teacher to record attendance.</p>
        </div>
    </main>

    <main id="enrollScreen" class="hide flex-grow flex flex-col p-4 max-w-md mx-auto w-full pb-safe">
        <div class="mb-4 mt-2">
            <h2 class="text-2xl font-bold text-gray-900">Join a Program</h2>
            <p class="text-gray-500 text-sm">Browse and enroll in upcoming courses and events.</p>
        </div>

        <div id="catalogContainer" class="space-y-4">
            <p class="text-center text-gray-500 text-sm py-4">Loading programs...</p>
        </div>
    </main>

    <nav id="bottomNav" class="hide bg-white border-t border-gray-200 fixed bottom-0 w-full md:max-w-md md:left-1/2 md:-translate-x-1/2 z-20 pb-safe">
        <div class="flex justify-around items-center h-16">
            <button id="navHome" class="flex flex-col items-center justify-center w-full h-full text-indigo-600 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button id="navEnroll" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-indigo-600 transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                <span class="text-[10px] font-medium">Enroll</span>
            </button>
        </div>
    </nav>

    <script>
        var loginScreen = document.getElementById('loginScreen');
        var dashboardScreen = document.getElementById('dashboardScreen');
        var enrollScreen = document.getElementById('enrollScreen');
        var bottomNav = document.getElementById('bottomNav');
        var loginBtn = document.getElementById('loginBtn');
        var logoutBtn = document.getElementById('logoutBtn');
        var errorMsg = document.getElementById('errorMsg');
        var catalogContainer = document.getElementById('catalogContainer');
        
        var currentUserId = null;
        var programsCache = null;
        var userEnrolledIds = {};
        var programsLoading = false;

        // --- LOGIN LOGIC ---
        loginBtn.addEventListener('click', function() {
            var username = document.getElementById('usernameInput').value.trim();
            var pin = document.getElementById('pinInput').value.trim();

            if (!username || !pin) {
                showError("Please enter both Username and PIN.");
                return;
            }

            if (typeof google === 'undefined' || typeof google.script === 'undefined') {
                showError("Must be run from the Google Apps Script published URL.");
                return;
            }

            loginBtn.textContent = "Verifying...";
            loginBtn.disabled = true;
            errorMsg.classList.add('hidden');

            google.script.run
                .withSuccessHandler(handleLoginResponse)
                .withFailureHandler(function(error) {
                    var msg = (error && error.message) ? error.message : "System error. Try again.";
                    showError(msg);
                })
                .verifyLogin(username, pin);
        });

        function handleLoginResponse(response) {
            loginBtn.textContent = "Sign In";
            loginBtn.disabled = false;

            if (response && response.success) {
                currentUserId = response.userId;
                document.getElementById('userNameDisplay').textContent = response.name;
                document.getElementById('qrImage').src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(response.qrString);

                userEnrolledIds = {};
                if (response.enrolledProgramIds && response.enrolledProgramIds.length) {
                    response.enrolledProgramIds.forEach(function(id) {
                        userEnrolledIds[id] = true;
                    });
                }
                programsCache = null;
                loadPrograms(true);

                loginScreen.classList.add('hide');
                dashboardScreen.classList.remove('hide');
                bottomNav.classList.remove('hide');
                logoutBtn.classList.remove('hide');
                
                // Clear the PIN input so it doesn't linger
                document.getElementById('pinInput').value = '';
            } else {
                showError(response ? response.message : "Invalid credentials.");
            }
        }

        function mergeProgramsWithEnrollment(programs) {
            return (programs || []).map(function(prog) {
                return {
                    id: prog.id,
                    name: prog.name,
                    type: prog.type,
                    description: prog.description,
                    isEnrolled: !!userEnrolledIds[prog.id]
                };
            });
        }

        function loadPrograms(forceServerFetch) {
            if (!currentUserId) return;

            if (programsCache && !forceServerFetch) {
                renderPrograms(mergeProgramsWithEnrollment(programsCache));
                return;
            }
            if (programsLoading) return;

            programsLoading = true;
            catalogContainer.innerHTML = '<p class="text-center text-gray-500 text-sm py-4">Loading programs...</p>';
            google.script.run
                .withSuccessHandler(function(programs) {
                    programsLoading = false;
                    programsCache = programs || [];
                    renderPrograms(mergeProgramsWithEnrollment(programsCache));
                })
                .withFailureHandler(function() {
                    programsLoading = false;
                    catalogContainer.innerHTML = '<p class="text-center text-red-500 text-sm py-4">Could not load programs.</p>';
                })
                .getProgramsCatalog();
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
            loginBtn.textContent = "Sign In";
            loginBtn.disabled = false;
        }

        // --- ENROLLMENT LOGIC ---
        function renderPrograms(programs) {
            catalogContainer.innerHTML = ''; 
            
            if (!programs || programs.length === 0) {
                catalogContainer.innerHTML = '<p class="text-center text-gray-500">No upcoming programs found.</p>';
                return;
            }

            programs.forEach(function(prog) {
                var card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-gray-100 p-5";
                
                var typeText = prog.type ? prog.type : 'Program';
                var descText = prog.description ? prog.description : 'No description provided.';
                
                card.innerHTML = 
                    '<div class="flex justify-between items-start mb-2">' +
                    '  <div>' +
                    '    <span class="inline-block px-2 py-1 bg-purple-100 text-purple-700 text-[10px] font-bold rounded-full mb-2 uppercase tracking-wide">' + typeText + '</span>' +
                    '    <h3 class="font-bold text-gray-900 text-lg leading-tight">' + prog.name + '</h3>' +
                    '  </div>' +
                    '</div>' +
                    '<p class="text-sm text-gray-600 mb-4 line-clamp-2">' + descText + '</p>';
                
                var btn = document.createElement('button');
                
                // Forces the button to read the database state
                if (prog.isEnrolled) {
                    btn.className = "w-full bg-green-500 text-white font-bold py-2 px-4 rounded-xl transition";
                    btn.textContent = "✓ Enrolled";
                    btn.disabled = true;
                } else {
                    btn.className = "w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-2 px-4 rounded-xl transition";
                    btn.textContent = "Enroll Now";
                    btn.onclick = function() { enrollUser(btn, prog.id); };
                }
                
                card.appendChild(btn);
                catalogContainer.appendChild(card);
            });
        }

        function enrollUser(btnElement, programId) {
            btnElement.textContent = "Enrolling...";
            btnElement.disabled = true;

            google.script.run
                .withSuccessHandler(function(res) {
                    if (res && res.success) {
                        userEnrolledIds[programId] = true;
                        if (programsCache) {
                            renderPrograms(mergeProgramsWithEnrollment(programsCache));
                        } else {
                            loadPrograms(true);
                        }
                    } else {
                        btnElement.textContent = "Enroll Now";
                        btnElement.disabled = false;
                        alert((res && res.message) ? res.message : "Enrollment failed.");
                    }
                })
                .withFailureHandler(function(err) {
                    btnElement.textContent = "Enroll Now";
                    btnElement.disabled = false;
                    alert((err && err.message) ? err.message : "Enrollment failed.");
                })
                .enrollUser(currentUserId, programId);
        }

        // --- NAVIGATION & LOGOUT ---
        logoutBtn.addEventListener('click', function() {
            currentUserId = null;
            programsCache = null;
            userEnrolledIds = {};
            programsLoading = false;
            document.getElementById('qrImage').src = "";
            document.getElementById('usernameInput').value = ""; 
            
            // Clears the HTML immediately so it doesn't flash on the next login
            catalogContainer.innerHTML = '<p class="text-center text-gray-500 text-sm py-4">Loading programs...</p>';
            
            dashboardScreen.classList.add('hide');
            enrollScreen.classList.add('hide');
            bottomNav.classList.add('hide');
            logoutBtn.classList.add('hide');
            
            loginScreen.classList.remove('hide');
            
            navHome.classList.replace('text-gray-400', 'text-indigo-600');
            navEnroll.classList.replace('text-indigo-600', 'text-gray-400');
        });

        var navHome = document.getElementById('navHome');
        var navEnroll = document.getElementById('navEnroll');

        function switchTab(tab) {
            if (tab === 'home') {
                dashboardScreen.classList.remove('hide');
                enrollScreen.classList.add('hide');
                navHome.classList.replace('text-gray-400', 'text-indigo-600');
                navEnroll.classList.replace('text-indigo-600', 'text-gray-400');
            } else if (tab === 'enroll') {
                enrollScreen.classList.remove('hide');
                dashboardScreen.classList.add('hide');
                navEnroll.classList.replace('text-gray-400', 'text-indigo-600');
                navHome.classList.replace('text-indigo-600', 'text-gray-400');
                loadPrograms(false);
            }
        }
        navHome.addEventListener('click', function() { switchTab('home'); });
        navEnroll.addEventListener('click', function() { switchTab('enroll'); });
    </script>
</body>
</html>
